<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>マイページ | AFRO Horse</title>
<meta name="description" content="AFRO Horseのマイページ。あなたの会員カード、陣営情報を確認できます。">
<meta name="theme-color" content="#0e2e1f">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="canonical" href="https://afro-horse.com/mypage.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;700;900&family=Kosugi+Maru&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  overflow-x: hidden;
  width: 100%;
  max-width: 100%;
}
body {
  background: #0a1f15;
  color: #fff;
  font-family: 'Noto Sans JP', sans-serif;
  line-height: 1.6;
  min-height: 100vh;
}

/* ヘッダー */
.header {
  background: #0e2e1f;
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #1a4a32;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  font-family: 'Dela Gothic One', sans-serif;
  font-size: 20px;
  color: #fff;
  text-decoration: none;
  letter-spacing: 1px;
}
.home-link {
  color: #c0e8d0;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}

/* ローディング */
.loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  color: #87b89c;
}
.loading.hide { display: none; }

/* 未ログイン */
.not-login {
  display: none;
  text-align: center;
  padding: 80px 20px;
}
.not-login.show { display: block; }
.not-login h2 {
  font-size: 22px;
  font-weight: 900;
  margin-bottom: 16px;
}
.not-login p {
  color: #c0e8d0;
  margin-bottom: 30px;
}

/* マイページコンテンツ */
.mypage {
  display: none;
  max-width: 600px;
  margin: 0 auto;
  padding: 30px 20px;
}
.mypage.show { display: block; }

/* タイトル */
.page-title {
  text-align: center;
  margin-bottom: 30px;
}
.page-title .label {
  font-size: 11px;
  color: #87b89c;
  letter-spacing: 3px;
  margin-bottom: 4px;
}
.page-title h1 {
  font-family: 'Dela Gothic One', sans-serif;
  font-size: 28px;
  letter-spacing: 2px;
}

/* 会員カード */
.card-section {
  text-align: center;
  margin-bottom: 30px;
}
#cardCanvas {
  max-width: 100%;
  border-radius: 12px;
  box-shadow: 0 12px 40px rgba(255, 217, 107, 0.25);
  margin-bottom: 16px;
}

/* 情報カード */
.info-card {
  background: rgba(26, 74, 50, 0.5);
  border: 1px solid #1a4a32;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
}
.info-card h2 {
  font-size: 14px;
  color: #ffd96b;
  margin-bottom: 16px;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.info-row:last-child { border-bottom: none; }
.info-row .label {
  font-size: 13px;
  color: #87b89c;
}
.info-row .value {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
}
.info-row .value.highlight {
  color: #ffd96b;
}
.info-row img {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #fff;
  padding: 3px;
}

/* ボタン */
.btn {
  display: block;
  width: 100%;
  padding: 14px;
  border-radius: 999px;
  font-weight: 900;
  cursor: pointer;
  border: none;
  font-size: 14px;
  letter-spacing: 1px;
  text-decoration: none;
  text-align: center;
  margin-bottom: 12px;
  transition: all 0.2s ease;
  font-family: inherit;
}
.btn-primary {
  background: #ffd96b;
  color: #0a1f15;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255, 217, 107, 0.4);
}
.btn-secondary {
  background: transparent;
  color: #87b89c;
  border: 1px solid #1a4a32;
}
.btn-line {
  background: #06C755;
  color: #fff;
  font-size: 16px;
}
.btn-danger {
  background: transparent;
  color: #c0392b;
  border: 1px solid rgba(192, 57, 43, 0.3);
}
.btn-danger:hover {
  background: rgba(192, 57, 43, 0.1);
}

.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 2px solid #fff;
  border-radius: 50%;
  border-top-color: transparent;
  animation: spin 0.6s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* フッター */
.footer {
  text-align: center;
  padding: 30px 20px;
  color: #587264;
  font-size: 12px;
  border-top: 1px solid #1a4a32;
  margin-top: 40px;
}
</style>
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">AFRO Horse</a>
  <a href="index.html" class="home-link">← HOME</a>
</header>

<!-- ローディング -->
<div class="loading" id="loading">
  <div class="spinner" style="width:32px; height:32px; border-color:#ffd96b; border-top-color:transparent;"></div>
  <p style="margin-top:16px;">読み込み中...</p>
</div>

<!-- 未ログイン -->
<div class="not-login" id="notLogin">
  <h2>マイページを見るには</h2>
  <p>ログインが必要です</p>
  <button class="btn btn-line" onclick="login()" style="max-width:300px; margin:0 auto;">
    LINEでログイン
  </button>
  <p style="margin-top:20px; font-size:13px; color:#87b89c;">
    まだ会員登録してない方は<br>
    <a href="register.html" style="color:#ffd96b;">こちらから登録</a>
  </p>
</div>

<!-- マイページ -->
<div class="mypage" id="mypage">
  <div class="page-title">
    <div class="label">MEMBER</div>
    <h1>マイページ</h1>
  </div>
  
  <!-- カード -->
  <div class="card-section">
    <canvas id="cardCanvas"></canvas>
    <button class="btn btn-primary" onclick="downloadCard()">
      📥 カードを保存
    </button>
  </div>
  
  <!-- 会員情報 -->
  <div class="info-card">
    <h2>👤 会員情報</h2>
    <div class="info-row">
      <span class="label">会員番号</span>
      <span class="value highlight" id="infoMemberNo">#---</span>
    </div>
    <div class="info-row">
      <span class="label">ユーザーネーム</span>
      <span class="value" id="infoNickname">---</span>
    </div>
    <div class="info-row">
      <span class="label">入隊日</span>
      <span class="value" id="infoJoinedAt">---</span>
    </div>
  </div>
  
  <!-- 陣営情報 -->
  <div class="info-card">
    <h2>🎌 陣営</h2>
    <div class="info-row">
      <span class="label">所属陣営</span>
      <span class="value highlight" id="infoJinei">---</span>
    </div>
    <div class="info-row">
      <span class="label">予想スタイル</span>
      <span class="value" id="infoJineiStyle">---</span>
    </div>
  </div>
  
  <!-- 推し馬 -->
  <div class="info-card">
    <h2>💛 推し馬</h2>
    <div class="info-row">
      <span class="label">マイパートナー</span>
      <span style="display:flex; align-items:center; gap:10px;">
        <span class="value highlight" id="infoOshi">---</span>
        <img id="infoOshiImg" src="" alt="">
      </span>
    </div>
  </div>
  
  <!-- アクション -->
  <div style="margin-top: 30px;">
    <button class="btn btn-danger" onclick="confirmLogout()">
      ログアウト
    </button>
  </div>
</div>

<footer class="footer">
  © 2026 AFRO Horse. All rights reserved.
</footer>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/auth.js"></script>

<script>
// ========================================
// カードレイアウト設定
// ========================================
const CARD_LAYOUT = {
  font: 'Kosugi Maru',
  name:  { x: 230, y: 1088, size: 50, color: '#000000', weight: '700', align: 'left' },
  jinei: { x: 230, y: 1153, size: 45, color: '#0e2e1f', weight: '700', align: 'left' },
  no:    { x: 883, y: 129,  size: 55, color: '#000000', weight: '700', align: 'center' },
  date:  { x: 847, y: 1132, size: 45, color: '#000000', weight: '700', align: 'center' }
};

// 6キャラデータ（カード画像URL用）
const CHARACTERS = [
  { id: 'afuwa', name: 'アフワ', img: 'images/afuwa.png', cardImg: 'images/cards/card_afuwa.png' },
  { id: 'yancha', name: 'やんちゃアフワ', img: 'images/yanchaahuwa.png', cardImg: 'images/cards/card_yancha.png' },
  { id: 'buruma', name: 'ブルマ', img: 'images/buruma.png', cardImg: 'images/cards/card_buruma.png' },
  { id: 'chahuwa', name: 'チャフワ', img: 'images/chahuwa.png', cardImg: 'images/cards/card_chahuwa.png' },
  { id: 'kurohuwa', name: 'クロフワ', img: 'images/kurohuwa.png', cardImg: 'images/cards/card_kurohuwa.png' },
  { id: 'ginma', name: 'ギンマ', img: 'images/ginma.png', cardImg: 'images/cards/card_ginma.png' }
];

let userInfo = null;
let kizunaInfo = null;

// ========================================
// 起動
// ========================================
async function main() {
  const user = await initAuth();
  
  if (!user) {
    showNotLogin();
    return;
  }
  
  // ユーザーデータ取得
  userInfo = getCurrentUserData();
  
  // キズナデータ取得
  kizunaInfo = await getKizunaData(user.userId);
  
  if (!kizunaInfo || !kizunaInfo.jineiId) {
    // 未入隊 → 登録ページへ
    alert('まだ入隊していません。会員登録ページに移動します。');
    location.href = 'register.html';
    return;
  }
  
  // 表示
  showMyPage();
}

function showNotLogin() {
  document.getElementById('loading').classList.add('hide');
  document.getElementById('notLogin').classList.add('show');
}

function showMyPage() {
  document.getElementById('loading').classList.add('hide');
  document.getElementById('mypage').classList.add('show');
  
  // 情報埋め込み
  fillInfo();
  
  // カード生成
  generateCard();
}

// ========================================
// 情報を画面に埋め込み
// ========================================
function fillInfo() {
  // 会員番号
  document.getElementById('infoMemberNo').textContent = 
    '#' + String(userInfo.memberNumber || '---').padStart(3, '0');
  
  // ニックネーム
  document.getElementById('infoNickname').textContent = userInfo.nickname || '---';
  
  // 入隊日
  if (kizunaInfo.joinedAt) {
    const date = kizunaInfo.joinedAt.toDate ? kizunaInfo.joinedAt.toDate() : new Date(kizunaInfo.joinedAt);
    const dateStr = date.getFullYear() + '.' + 
                    String(date.getMonth() + 1).padStart(2, '0') + '.' + 
                    String(date.getDate()).padStart(2, '0');
    document.getElementById('infoJoinedAt').textContent = dateStr;
  }
  
  // 陣営
  document.getElementById('infoJinei').textContent = kizunaInfo.jinei + ' 陣営';
  document.getElementById('infoJineiStyle').textContent = kizunaInfo.jineiStyle;
  
  // 推し馬
  const oshi = CHARACTERS.find(c => c.id === kizunaInfo.oshiId);
  if (oshi) {
    document.getElementById('infoOshi').textContent = oshi.name;
    document.getElementById('infoOshiImg').src = oshi.img;
  }
}

// ========================================
// カード生成
// ========================================
async function generateCard() {
  const canvas = document.getElementById('cardCanvas');
  const ctx = canvas.getContext('2d');
  
  // フォント読み込み待ち
  try {
    await document.fonts.load(`700 50px "${CARD_LAYOUT.font}"`);
    await document.fonts.load(`700 45px "${CARD_LAYOUT.font}"`);
    await document.fonts.ready;
  } catch (e) {
    console.warn('フォント読み込み待ち失敗:', e);
  }
  
  const oshi = CHARACTERS.find(c => c.id === kizunaInfo.oshiId);
  if (!oshi) {
    console.error('推し馬データなし');
    return;
  }
  
  const cardImg = new Image();
  cardImg.crossOrigin = 'anonymous';
  
  cardImg.onload = () => {
    canvas.width = cardImg.width;
    canvas.height = cardImg.height;
    
    ctx.drawImage(cardImg, 0, 0);
    drawCardText(ctx);
  };
  
  cardImg.onerror = () => {
    console.error('カード画像読み込み失敗:', oshi.cardImg);
  };
  
  cardImg.src = oshi.cardImg;
}

function drawCardText(ctx) {
  const memberNo = '#' + String(userInfo.memberNumber || '---').padStart(3, '0');
  
  // 入隊日（保存されてるやつ）
  let dateStr = '';
  if (kizunaInfo.joinedAt) {
    const date = kizunaInfo.joinedAt.toDate ? kizunaInfo.joinedAt.toDate() : new Date(kizunaInfo.joinedAt);
    dateStr = date.getFullYear() + '.' + 
              String(date.getMonth() + 1).padStart(2, '0') + '.' + 
              String(date.getDate()).padStart(2, '0');
  }
  
  drawText(ctx, userInfo.nickname || '', CARD_LAYOUT.name);
  drawText(ctx, kizunaInfo.jinei + ' 陣営', CARD_LAYOUT.jinei);
  drawText(ctx, memberNo, CARD_LAYOUT.no);
  drawText(ctx, dateStr, CARD_LAYOUT.date);
}

function drawText(ctx, text, layout) {
  ctx.fillStyle = layout.color;
  ctx.font = `${layout.weight} ${layout.size}px "${CARD_LAYOUT.font}", "Noto Sans JP", sans-serif`;
  ctx.textAlign = layout.align;
  ctx.textBaseline = 'middle';
  ctx.fillText(text, layout.x, layout.y);
}

// ========================================
// カード保存
// ========================================
function downloadCard() {
  const canvas = document.getElementById('cardCanvas');
  const memberNo = String(userInfo.memberNumber || '000').padStart(3, '0');
  
  const link = document.createElement('a');
  link.download = `afro-horse-card-${memberNo}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// ========================================
// ログアウト
// ========================================
function confirmLogout() {
  if (confirm('ログアウトしますか？')) {
    logout();
  }
}

main();
</script>

</body>
</html>
