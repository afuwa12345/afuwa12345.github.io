*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#eee;font-family:'Noto Sans JP',sans-serif;min-height:100vh;padding:20px}
h1{font-family:'Dela Gothic One',serif;color:#e30613;font-size:24px;margin-bottom:20px;text-align:center}
.container{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:420px 1fr;gap:24px}
@media(max-width:900px){.container{grid-template-columns:1fr}.form-panel{position:static!important;max-height:none!important}}
.form-panel{background:#1a1a1a;padding:20px;border-radius:8px;border:1px solid #333;position:sticky;top:20px;height:fit-content;max-height:calc(100vh - 40px);overflow-y:auto;color:#f5f1e8}
.form-section{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid #333}
.form-section:last-child{border-bottom:none;padding-bottom:0}
.section-title{font-family:'Dela Gothic One',serif;color:#f5c518;font-size:13px;margin-bottom:10px;letter-spacing:1px}
label{display:block;font-size:11px;color:#aaa;margin-bottom:4px;margin-top:8px}
input,textarea,select{width:100%;padding:8px;background:#0a0a0a;color:#f5f1e8;border:1px solid #444;border-radius:4px;font-family:inherit;font-size:13px}
textarea{resize:vertical;min-height:50px}
.btn{display:block;width:100%;padding:14px;background:#e30613;color:white;border:none;border-radius:4px;font-family:'Dela Gothic One',serif;font-size:14px;cursor:pointer;margin-top:8px;letter-spacing:2px}
.btn:hover{background:#a80008}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-sub{background:#333;font-size:12px;padding:10px}
.btn-sub:hover{background:#444}
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.theme-btn{padding:10px 4px;font-size:10px;border:2px solid #333;background:#0a0a0a;color:#fff;cursor:pointer;border-radius:4px;font-family:inherit;text-align:center}
.theme-btn.active{border-color:#f5c518}
.theme-btn:hover{border-color:#888}
.race-tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.race-tab{flex:1;min-width:0;padding:8px;background:#0a0a0a;color:#888;border:2px solid #333;border-radius:4px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px}
.race-tab.active{border-color:#e30613;color:#fff;background:#1a0a0a}
.race-tab:hover{border-color:#666}
.add-race-btn{padding:8px 12px;background:#1a8c4a;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;font-weight:700}
.del-race-btn{padding:1px 5px;background:#444;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:10px}

.preview-area{display:flex;flex-direction:column;gap:30px;align-items:center}
.slide-wrapper{position:relative}
.slide-num{position:absolute;top:-14px;left:0;background:#f5c518;color:#000;padding:4px 14px;font-family:'Bebas Neue';font-size:14px;border-radius:4px;z-index:10;letter-spacing:1px}

.slide{width:540px;height:540px;background:var(--bg);position:relative;overflow:hidden;font-family:'Noto Sans JP',sans-serif;color:var(--text);border:2px solid #333}
.slide::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--accent) 0%,var(--accent2) 100%);z-index:5}
.noise{position:absolute;inset:0;opacity:0.04;pointer-events:none;background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,0.5) 2px,rgba(255,255,255,0.5) 3px)}
.brand{position:absolute;bottom:12px;right:16px;font-family:'Bebas Neue';font-size:12px;color:var(--text-sub);letter-spacing:2px;z-index:5}

.char{display:flex;align-items:center;justify-content:center;font-size:0;color:transparent;flex-shrink:0;background-size:contain;background-position:center;background-repeat:no-repeat;background-color:transparent}
.char img{width:100%;height:100%;object-fit:contain;display:block}

/* SLIDE 1 表紙（全体カバー） */
.cover{padding:24px 26px 22px;display:flex;flex-direction:column;height:100%;position:relative}
.cover-label{font-family:'Bebas Neue';color:var(--accent2);font-size:16px;letter-spacing:5px;text-align:center}
.cover-title{font-family:'Dela Gothic One',serif;color:var(--accent);font-size:44px;letter-spacing:4px;text-align:center;margin-top:4px}
.cover-divider{width:60px;height:3px;background:var(--accent);margin:12px auto 12px}
.cover-date{font-family:'Bebas Neue';color:var(--text-sub);font-size:14px;text-align:center;letter-spacing:2px;margin-bottom:12px}
.cover-races{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.cover-race-item{background:var(--bg2);padding:10px 14px;display:flex;align-items:center;gap:10px;border-left:4px solid var(--accent2)}
.cover-race-grade{display:inline-block;background:var(--accent);color:#fff;font-family:'Dela Gothic One';padding:3px 9px;font-size:11px;letter-spacing:1px;flex-shrink:0;min-width:36px;text-align:center}
.cover-race-name{font-family:'Dela Gothic One',serif;font-size:18px;color:var(--text);line-height:1.1;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cover-chars{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:8px 0 10px}
.cover-chars .char{width:70px;height:70px;filter:drop-shadow(2px 4px 6px rgba(0,0,0,0.35))}
.cover-tagline{font-family:'Dela Gothic One',serif;color:var(--accent2);font-size:22px;line-height:1.4;text-align:center;margin-top:auto}
.cover-tagline span{color:var(--accent)}
.cover-bg-text{position:absolute;top:120px;right:-50px;font-family:'Bebas Neue';font-size:200px;color:rgba(255,255,255,0.04);line-height:0.8;letter-spacing:-8px;z-index:1;font-weight:bold}

/* SLIDE 本命（各レース） */
.honmei{padding:24px 26px 22px;display:flex;flex-direction:column;height:100%}
.honmei-race{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
.honmei-race-grade{display:inline-block;background:var(--accent);color:#fff;font-family:'Dela Gothic One';padding:3px 10px;font-size:12px;letter-spacing:1px}
.honmei-race-name{font-family:'Dela Gothic One',serif;font-size:24px;color:var(--text);line-height:1}
.honmei-label{font-family:'Bebas Neue';color:var(--accent2);font-size:12px;letter-spacing:4px;text-align:center;margin-top:2px}
.honmei-divider{width:50px;height:3px;background:var(--accent);margin:8px auto 10px}
.honmei-grid{display:flex;flex-direction:column;gap:6px;flex:1}
.honmei-card{background:var(--bg2);padding:7px 10px;display:flex;align-items:center;gap:9px;border-left:3px solid var(--accent)}
.honmei-card .char{width:50px;height:50px;filter:drop-shadow(2px 3px 5px rgba(0,0,0,0.3))}
.honmei-card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.honmei-card-row1{display:flex;align-items:center;gap:5px}
.honmei-card-tag{display:inline-block;background:var(--accent);color:#fff;font-family:'Dela Gothic One';padding:1px 5px;font-size:8px;letter-spacing:1px;flex-shrink:0}
.honmei-card-name{font-family:'Dela Gothic One',serif;font-size:13px;color:var(--text);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.honmei-card-comment{font-size:10px;color:var(--text-sub);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}

/* SLIDE 注目馬（全レース統合） */
.focus{padding:24px 26px 22px;display:flex;flex-direction:column;height:100%}
.focus-label{font-family:'Bebas Neue';color:var(--accent2);font-size:16px;letter-spacing:4px;text-align:center}
.focus-title{font-family:'Dela Gothic One',serif;font-size:28px;color:var(--text);text-align:center;line-height:1.1;margin-top:2px}
.focus-sub{font-size:13px;color:var(--text-sub);text-align:center;margin-top:4px}
.focus-divider{width:50px;height:3px;background:var(--accent);margin:10px auto 14px}
.focus-list{display:flex;flex-direction:column;gap:10px;flex:1}
.focus-item{background:var(--bg2);padding:14px 16px;border-left:4px solid var(--accent);position:relative}
.focus-race-tag{display:inline-block;background:var(--accent2);color:var(--bg);font-family:'Dela Gothic One';padding:3px 9px;font-size:11px;letter-spacing:1px;margin-right:6px}
.focus-name{font-family:'Dela Gothic One',serif;font-size:20px;color:var(--text);line-height:1.2;display:inline}
.focus-info{font-size:12px;color:var(--text-sub);margin-top:5px;font-weight:700}
.focus-info b{color:var(--accent2)}
.focus-supporters{display:flex;align-items:center;gap:4px;margin-top:6px;flex-wrap:wrap}
.focus-supporters-label{font-size:12px;color:var(--text-sub);margin-right:2px}
.focus-supporters .char{width:36px;height:36px;filter:drop-shadow(1px 2px 3px rgba(0,0,0,0.3))}

/* SLIDE CTA */
.cta{padding:24px 26px 22px;display:flex;flex-direction:column;height:100%;align-items:center;justify-content:center;text-align:center}
.cta-label{font-family:'Bebas Neue';color:var(--accent2);font-size:18px;letter-spacing:5px}
.cta-title{font-family:'Dela Gothic One',serif;font-size:40px;color:var(--text);line-height:1.2;margin-top:6px}
.cta-divider{width:60px;height:3px;background:var(--accent);margin:18px auto}
.cta-msg{font-family:'Dela Gothic One',serif;font-size:26px;color:var(--accent);line-height:1.4;margin-bottom:20px}
.cta-msg span{color:var(--accent2)}
.cta-chars{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:16px 0}
.cta-chars .char{width:80px;height:80px;filter:drop-shadow(2px 4px 6px rgba(0,0,0,0.35))}
.cta-button{background:var(--accent);color:#fff;font-family:'Dela Gothic One';padding:14px 28px;font-size:18px;letter-spacing:2px;border-radius:6px;margin-top:12px}
.cta-url{font-family:'Bebas Neue';font-size:20px;color:var(--accent2);margin-top:10px;letter-spacing:2px}
.cta-bg-text{position:absolute;font-family:'Bebas Neue';font-size:240px;color:rgba(255,255,255,0.04);line-height:0.8;letter-spacing:-10px;z-index:1;font-weight:bold;left:-30px;top:80px}
</style>
</head>
<body>
<h1>🐎 AFRO HORSE 本命発表ジェネレーター</h1>

<div class="container">
  <div class="form-panel">

    <div class="form-section">
      <div class="section-title">🎨 カラーテーマ</div>
      <div class="theme-grid">
        <button class="theme-btn active" data-t="classic" onclick="setTheme(this)">クラシック</button>
        <button class="theme-btn" data-t="g1gold" onclick="setTheme(this)">G1 GOLD</button>
        <button class="theme-btn" data-t="spring" onclick="setTheme(this)">春爛漫</button>
        <button class="theme-btn" data-t="summer" onclick="setTheme(this)">夏空</button>
        <button class="theme-btn" data-t="autumn" onclick="setTheme(this)">秋深</button>
        <button class="theme-btn" data-t="winter" onclick="setTheme(this)">冬銀</button>
        <button class="theme-btn" data-t="neon" onclick="setTheme(this)">ナイター</button>
        <button class="theme-btn" data-t="forest" onclick="setTheme(this)">深緑</button>
        <button class="theme-btn" data-t="cream" onclick="setTheme(this)">クリーム</button>
        <button class="theme-btn" data-t="sky" onclick="setTheme(this)">そら</button>
        <button class="theme-btn" data-t="mint" onclick="setTheme(this)">ミント</button>
        <button class="theme-btn" data-t="peach" onclick="setTheme(this)">ピーチ</button>
      </div>
    </div>

    <div class="form-section" style="background:#102a18;padding:14px;border-radius:6px;border:1px solid #205a30">
      <div class="section-title" style="color:#6bff8e">🤖 AI 自動生成（Gemini無料）</div>
      <label>Google AI Studio APIキー</label>
      <input id="apiKey" type="password" placeholder="AIzaSy...">
      <button class="btn" id="aiBtn" onclick="aiGenerate()" style="margin-top:10px;background:#1a8c4a">🤖 全レース・全コメント自動生成</button>
      <div style="font-size:10px;color:#888;margin-top:6px;line-height:1.5">
        <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:#6bff8e">aistudio.google.com</a> で無料取得
      </div>
    </div>

    <!-- 表紙＆共通設定 -->
    <div class="form-section">
      <div class="section-title">▼ 表紙・共通設定</div>
      <label>開催日（例：5月3日(土)・4日(日)）</label>
      <input id="g_date" value="5月3日(土)・4日(日)">
      <label>キャッチ（&lt;span&gt;で強調）</label>
      <textarea id="g_tagline">6キャラがそれぞれの視点で<span>本命</span>を選定！</textarea>
      <label>CTAメッセージ</label>
      <textarea id="g_ctaMsg">最終判断は<span>レース直前のサイト</span>で！</textarea>
    </div>

    <!-- レース管理 -->
    <div class="form-section">
      <div class="section-title">▼ レース管理</div>
      <div class="race-tabs" id="raceTabs"></div>
      <button class="add-race-btn" onclick="addRace()">＋ レース追加</button>
    </div>

    <!-- 各レース入力 -->
    <div id="raceFormContainer"></div>

    <!-- 注目馬（全レース統合） -->
    <div class="form-section">
      <div class="section-title">▼ 注目馬ピックアップ（全レース統合）</div>
      <div style="font-size:10px;color:#888;margin-bottom:8px">複数キャラが選んだ馬を1枚に集約。空欄ならスキップ</div>
      <label>注目馬1 [レース名 / 馬名 / 情報 / 推すキャラ]</label>
      <input id="ff1race" placeholder="レース名（短縮形：天皇春、青葉等）" value="平安S">
      <input id="ff1name" placeholder="馬名" value="11番 メルカントゥール">
      <input id="ff1info" placeholder="情報（4歳、父ディープ等）" value="過去3走・<b>GBM17.2%</b>">
      <input id="ff1support" placeholder="推すキャラ：アフワ,ギンマ" value="アフワ,チャフワ">
      <label>注目馬2</label>
      <input id="ff2race" placeholder="レース名" value="京王杯SC">
      <input id="ff2name" placeholder="馬名" value="13番 ファンダム">
      <input id="ff2info" placeholder="情報" value="過去6走・<b>GBM15.3%</b>">
      <input id="ff2support" placeholder="推すキャラ" value="アフワ,チャフワ">
      <label>注目馬3（任意）</label>
      <input id="ff3race" placeholder="レース名" value="京王杯SC">
      <input id="ff3name" placeholder="馬名" value="17番 ダノンマッキンリー">
      <input id="ff3info" placeholder="情報" value="過去15走・<b>GBM8.6%</b>">
      <input id="ff3support" placeholder="推すキャラ" value="クロフワ,ブルマ">
    </div>

    <div class="form-section">
      <button class="btn" onclick="render()">🔄 プレビュー更新</button>
      <button class="btn btn-sub" onclick="downloadAll()">📥 全スライド まとめてダウンロード</button>
    </div>
  </div>

  <div class="preview-area" id="preview"></div>
</div>

<script>
const $ = id => document.getElementById(id) ? document.getElementById(id).value : '';
let currentTheme = 'classic';
let currentRaceIdx = 0;
let races = [
  {
    "raceName": "平安S",
    "grade": "G3",
    "b1n": "11番 メルカントゥール",
    "b1c": "GBM17.2%で堅実",
    "b2n": "12番 デールエルバハリ",
    "b2c": "血統お宝の穴馬というわけだ",
    "b3n": "6番 ヴィエントデコラ",
    "b3c": "強い相手と戦ってきた実戦経験",
    "b4n": "10番 セイントエルモズ",
    "b4c": "スピード上昇中の絶好調馬",
    "b5n": "11番 メルカントゥール",
    "b5c": "騎手勝率16.4%",
    "b6n": "3番 ガウラディスコ",
    "b6c": "評価より走るぜ、下剋上だ"
  },
  {
    "raceName": "京王杯SC",
    "grade": "G2",
    "b1n": "13番 ファンダム",
    "b1c": "GBM15.3%で堅実",
    "b2n": "15番 レイベリング",
    "b2c": "血統お宝の穴馬というわけだ",
    "b3n": "17番 ダノンマッキンリー",
    "b3c": "強い相手と戦ってきた実戦経験",
    "b4n": "17番 ダノンマッキンリー",
    "b4c": "スピード上昇中の絶好調馬",
    "b5n": "13番 ファンダム",
    "b5c": "騎手勝率20.0%",
    "b6n": "9番 フリームファクシ",
    "b6c": "評価より走るぜ、下剋上だ"
  },
  {
    "raceName": "天皇賞・春",
    "grade": "G1",
    "b1n": "12番 ヘデントール",
    "b1c": "GBM22.9%で堅実",
    "b2n": "3番 アドマイヤテラ",
    "b2c": "血統お宝の穴馬というわけだ",
    "b3n": "6番 エヒト",
    "b3c": "強い相手と戦ってきた実戦経験",
    "b4n": "2番 サンライズソレイユ",
    "b4c": "スピード上昇中の絶好調馬",
    "b5n": "12番 ヘデントール",
    "b5c": "騎手勝率31.6%",
    "b6n": "11番 タガノデュード",
    "b6c": "評価より走るぜ、下剋上だ"
  }
];

function createEmptyRace(name='', grade='G3'){
  return {
    raceName: name, grade: grade,
    b1n:'サンプル馬A', b1c:'安定感あるかも…',
    b2n:'サンプル馬B', b2c:'血統お宝というわけだ',
    b3n:'サンプル馬C', b3c:'相手選ばないタフネスだな',
    b4n:'サンプル馬D', b4c:'最近めっちゃ調子いいよ♡',
    b5n:'サンプル馬E', b5c:'この騎手大好きなんだ〜！',
    b6n:'サンプル馬F', b6c:'人気薄でも刺すぜ'
  };
}

function setTheme(btn){
  document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentTheme = btn.dataset.t;
  document.querySelectorAll('.slide').forEach(s=>s.setAttribute('data-theme', currentTheme));
}

function charDiv(name){
  const fileMap = {'アフワ':'afuwa1','ギンマ':'ginma1','クロフワ':'kurofuwa1','ブルマ':'buruma1','チャフワ':'chafuwa1','やんちゃアフワ':'yanchaahuwa1'};
  const f = fileMap[name] || 'afuwa1';
  return `<div class="char char-${name}"><img src="./Images/${f}.png" alt="${name}"></div>`;
}

function escapeHtml(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function addRace(){
  if(races.length >= 5){ alert('最大5レースまで'); return; }
  saveCurrentForm();
  races.push(createEmptyRace(`レース${races.length+1}`));
  currentRaceIdx = races.length - 1;
  renderTabs();
  renderForm();
  render();
}

function deleteRace(idx, e){
  e.stopPropagation();
  if(races.length <= 1){ alert('最低1レースは必要'); return; }
  if(!confirm(`${races[idx].raceName} を削除しますか？`)) return;
  races.splice(idx, 1);
  if(currentRaceIdx >= races.length) currentRaceIdx = races.length - 1;
  renderTabs();
  renderForm();
  render();
}

function selectRace(idx){
  saveCurrentForm();
  currentRaceIdx = idx;
  renderTabs();
  renderForm();
  render();
}

function renderTabs(){
  document.getElementById('raceTabs').innerHTML = races.map((r, i) => `
    <button class="race-tab ${i===currentRaceIdx?'active':''}" onclick="selectRace(${i})">
      ${i+1}.${r.raceName||'未'}
      ${races.length > 1 ? `<span class="del-race-btn" onclick="deleteRace(${i},event)">×</span>` : ''}
    </button>
  `).join('');
}

function saveCurrentForm(){
  const r = races[currentRaceIdx];
  if(!r) return;
  ['raceName','grade','b1n','b1c','b2n','b2c','b3n','b3c','b4n','b4c','b5n','b5c','b6n','b6c'].forEach(k => {
    const el = document.getElementById('f_'+k);
    if(el) r[k] = el.value;
  });
}

function renderForm(){
  const r = races[currentRaceIdx];
  if(!r){ document.getElementById('raceFormContainer').innerHTML = ''; return; }
  const html = `
    <div class="form-section">
      <div class="section-title">▼ レース${currentRaceIdx+1} 設定</div>
      <label>レース名</label>
      <input id="f_raceName" value="${escapeHtml(r.raceName)}">
      <label>グレード</label>
      <input id="f_grade" value="${escapeHtml(r.grade)}">
    </div>

    <div class="form-section">
      <div class="section-title">▼ 6キャラの本命</div>
      <label>🟠 アフワ「データ最強馬」</label>
      <input id="f_b1n" placeholder="馬名" value="${escapeHtml(r.b1n)}">
      <textarea id="f_b1c" placeholder="コメント">${escapeHtml(r.b1c)}</textarea>
      <label>⚪ ギンマ「血統お宝発掘」</label>
      <input id="f_b2n" placeholder="馬名" value="${escapeHtml(r.b2n)}">
      <textarea id="f_b2c" placeholder="コメント">${escapeHtml(r.b2c)}</textarea>
      <label>⚫ クロフワ「実戦タフネス」</label>
      <input id="f_b3n" placeholder="馬名" value="${escapeHtml(r.b3n)}">
      <textarea id="f_b3c" placeholder="コメント">${escapeHtml(r.b3c)}</textarea>
      <label>🌸 ブルマ「絶好調の馬♡」</label>
      <input id="f_b4n" placeholder="馬名" value="${escapeHtml(r.b4n)}">
      <textarea id="f_b4c" placeholder="コメント">${escapeHtml(r.b4c)}</textarea>
      <label>🎩 チャフワ「お手馬職人」</label>
      <input id="f_b5n" placeholder="馬名" value="${escapeHtml(r.b5n)}">
      <textarea id="f_b5c" placeholder="コメント">${escapeHtml(r.b5c)}</textarea>
      <label>🔥 やんちゃ「下剋上ねらい」</label>
      <input id="f_b6n" placeholder="馬名" value="${escapeHtml(r.b6n)}">
      <textarea id="f_b6c" placeholder="コメント">${escapeHtml(r.b6c)}</textarea>
    </div>
  `;
  document.getElementById('raceFormContainer').innerHTML = html;
  ['raceName','grade','b1n','b1c','b2n','b2c','b3n','b3c','b4n','b4c','b5n','b5c','b6n','b6c'].forEach(k => {
    const el = document.getElementById('f_'+k);
    if(el) el.addEventListener('input', () => { saveCurrentForm(); renderTabs(); render(); });
  });
}

// ── スライド構築 ──

function buildCover(){
  const racesHtml = races.map(r => `
    <div class="cover-race-item">
      <span class="cover-race-grade">${r.grade}</span>
      <span class="cover-race-name">${r.raceName}</span>
    </div>
  `).join('');
  return `<div class="slide cover" data-theme="${currentTheme}">
    <div class="noise"></div>
    <div class="cover-bg-text">FINAL</div>
    <div class="cover-label">FINAL PREDICTION</div>
    <div class="cover-title">本命発表！</div>
    <div class="cover-divider"></div>
    <div class="cover-date">${$('g_date')||''}</div>
    <div class="cover-races">${racesHtml}</div>
    <div class="cover-chars">
      ${charDiv('アフワ')}${charDiv('ギンマ')}${charDiv('クロフワ')}
      ${charDiv('ブルマ')}${charDiv('チャフワ')}${charDiv('やんちゃアフワ')}
    </div>
    <div class="cover-tagline">${$('g_tagline')||''}</div>
    <div class="brand">AFRO-Horse</div>
  </div>`;
}

function honmeiCard(name, tag, horse, comment){
  return `<div class="honmei-card">
    ${charDiv(name)}
    <div class="honmei-card-body">
      <div class="honmei-card-row1">
        <span class="honmei-card-tag">${tag}</span>
        <span class="honmei-card-name">${horse||'検討中…'}</span>
      </div>
      <div class="honmei-card-comment">${comment||''}</div>
    </div>
  </div>`;
}

function buildHonmei(race){
  return `<div class="slide honmei" data-theme="${currentTheme}">
    <div class="noise"></div>
    <div class="honmei-race">
      <span class="honmei-race-grade">${race.grade}</span>
      <span class="honmei-race-name">${race.raceName}</span>
    </div>
    <div class="honmei-label">6 CHARACTERS' PICK</div>
    <div class="honmei-divider"></div>
    <div class="honmei-grid">
      ${honmeiCard('アフワ','データ最強馬',race.b1n,race.b1c)}
      ${honmeiCard('ギンマ','血統お宝発掘',race.b2n,race.b2c)}
      ${honmeiCard('クロフワ','実戦タフネス',race.b3n,race.b3c)}
      ${honmeiCard('ブルマ','絶好調の馬♡',race.b4n,race.b4c)}
      ${honmeiCard('チャフワ','お手馬職人',race.b5n,race.b5c)}
      ${honmeiCard('やんちゃアフワ','下剋上ねらい',race.b6n,race.b6c)}
    </div>
    <div class="brand">AFRO-Horse</div>
  </div>`;
}

function focusItem(raceTag, name, info, supportStr){
  if(!name||!name.trim()) return '';
  const supporters = (supportStr||'').split(/[,、]/).map(s=>s.trim()).filter(Boolean);
  const supportHtml = supporters.length > 0
    ? `<div class="focus-supporters">
        <span class="focus-supporters-label">推し:</span>
        ${supporters.map(c=>charDiv(c)).join('')}
       </div>`
    : '';
  return `<div class="focus-item">
    <div>
      ${raceTag ? `<span class="focus-race-tag">${raceTag}</span>` : ''}
      <span class="focus-name">${name}</span>
    </div>
    ${info ? `<div class="focus-info">${info}</div>` : ''}
    ${supportHtml}
  </div>`;
}

function buildFocus(){
  const items = [];
  for(let i=1; i<=3; i++){
    const name = $(`ff${i}name`);
    if(name && name.trim()){
      items.push(focusItem(
        $(`ff${i}race`),
        name,
        $(`ff${i}info`),
        $(`ff${i}support`)
      ));
    }
  }
  if(items.length === 0) return '';
  return `<div class="slide focus" data-theme="${currentTheme}">
    <div class="noise"></div>
    <div class="focus-label">SPOTLIGHT</div>
    <div class="focus-title">🌟 注目馬ピックアップ</div>
    <div class="focus-sub">複数キャラが推す要マーク馬</div>
    <div class="focus-divider"></div>
    <div class="focus-list">${items.join('')}</div>
    <div class="brand">AFRO-Horse</div>
  </div>`;
}

function buildCTA(){
  return `<div class="slide cta" data-theme="${currentTheme}">
    <div class="noise"></div>
    <div class="cta-bg-text">GO!</div>
    <div style="position:relative;z-index:2">
      <div class="cta-label">CHECK NOW</div>
      <div class="cta-title">最終予想</div>
      <div class="cta-divider"></div>
      <div class="cta-msg">${$('g_ctaMsg')||''}</div>
      <div class="cta-chars">
        ${charDiv('アフワ')}${charDiv('ギンマ')}${charDiv('やんちゃアフワ')}
      </div>
      <div class="cta-button">▶ 詳細予想はサイトへ</div>
      <div class="cta-url">afro-horse.com</div>
    </div>
  </div>`;
}

function render(){
  saveCurrentForm();
  const slides = [];
  slides.push(buildCover());
  races.forEach(r => slides.push(buildHonmei(r)));
  const focus = buildFocus();
  if(focus) slides.push(focus);
  slides.push(buildCTA());

  document.getElementById('preview').innerHTML =
    slides.map((s,i)=>`<div class="slide-wrapper"><div class="slide-num">SLIDE ${i+1}/${slides.length}</div>${s}</div>`).join('');
}

async function aiGenerate(){
  const btn = document.getElementById('aiBtn');
  const key = $('apiKey').trim();
  if(!key){ alert('APIキーを入力してください'); return; }
  saveCurrentForm();
  btn.textContent = '🤖 生成中...';
  btn.disabled = true;

  const racesContext = races.map((r,i) => `
レース${i+1}: ${r.raceName}（${r.grade}）
  アフワ「データ最強馬」: ${r.b1n||'未定'}
  ギンマ「血統お宝発掘」: ${r.b2n||'未定'}
  クロフワ「実戦タフネス」: ${r.b3n||'未定'}
  ブルマ「絶好調の馬♡」: ${r.b4n||'未定'}
  チャフワ「お手馬職人」: ${r.b5n||'未定'}
  やんちゃ「下剋上ねらい」: ${r.b6n||'未定'}
`).join('');

  const prompt = `あなたはAFRO Horseという競馬予想ブランドの6キャラクターです。

【キャラ設定】
- アフワ（♂）: ビビりで優しい、慎重派。語尾「〜だよね…」「〜かも」、心配性。

- ブルマ（♀）: 元気ポジティブ、おしゃれと友情。語尾「〜だよ♡」「〜かもっ！」、可愛い口調。

      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`,
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},

          contents:[{parts:[{text:prompt}]}],
          generationConfig:{responseMimeType:"application/json",maxOutputTokens:4000,temperature:0.9}
        })
      }
    );
    const result = await res.json();
    if(result.error) throw new Error(result.error.message);
    let text = result.candidates[0].content.parts.map(p=>p.text||'').join('');
    text = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(text);

    if(parsed.races && parsed.races.length){
      parsed.races.forEach((r, i) => {
        if(races[i]){
          ['b1c','b2c','b3c','b4c','b5c','b6c'].forEach(k => {
            if(r[k]) races[i][k] = r[k];
          });
        }
      });
      renderForm();
      render();
    }
  } catch(e) {
    alert('生成失敗: ' + e.message);
  } finally {

async function downloadAll(){
  const slides = document.querySelectorAll('.slide');
  for(let i=0;i<slides.length;i++){
    const canvas = await html2canvas(slides[i],{
      width:540,height:540,scale:3,
      backgroundColor:null,useCORS:true,allowTaint:true
    });
    const link = document.createElement('a');
    link.download = `afro_honmei_${currentTheme}_${String(i+1).padStart(2,'0')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    await new Promise(r=>setTimeout(r,500));
  }
}
