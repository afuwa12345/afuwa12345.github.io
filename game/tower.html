<style>
  #scTitle { --bgt: url(../images/bgt/tower.webp); --veil: .58; }

  #scPlay { padding-bottom: 6px; }
  #scPlay .ain.grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* 空。高く積むほど色が濃くなるので、段数で --sky を動かす */
  #stage {
    background-color: #0b1630;
    background-image:
      radial-gradient(120% 60% at 50% 100%, rgba(120, 200, 255, .22), transparent 60%),
      linear-gradient(180deg,
        hsl(218, 62%, calc(16% + var(--sky, 0) * 1%)) 0%,
        hsl(205, 66%, calc(30% + var(--sky, 0) * 1.2%)) 100%);
    overflow: hidden;
  }
  /* 高さのめやす。うっすらした横線 */
  #stage::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: repeating-linear-gradient(180deg,
      rgba(255,255,255,.055) 0 1px, transparent 1px 34px);
  }

  /* 雲を置く層。塔より遅く下がるので、奥にあるように見える */
  #sky {
    position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
    transition: transform .22s ease-out;
  }

  /* 積んだ塔ぜんぶを入れる器。伸びたぶんだけ下へずらす */
  #col {
    position: absolute; left: 0; right: 0; bottom: 0; top: 0; z-index: 2;
    transition: transform .22s ease-out;
  }

  .tb {
    position: absolute; overflow: hidden;
    border-radius: 7px;
    background: linear-gradient(180deg, #f3d98d 0%, #dcb757 46%, #b98f33 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 0 rgba(0,0,0,.18),
                0 2px 5px rgba(0,0,0,.4);
    border: 1.5px solid #6d4f17;
  }
  .tb img {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    height: 112%; width: auto; max-width: none; pointer-events: none;
  }
  /* 土台。干し草の絵が細長くつぶれないよう2段ぶんの高さにして、
     下半分はステージの外へ出す。地面に埋まっているように見える */
  .tb.base {
    background: linear-gradient(180deg, #e0c477 0%, #c2a052 50%, #8e6d2a 100%);
  }
  .tb.base img { height: 100%; width: 100%; object-fit: cover; object-position: center top; }
  .tb.perfect { box-shadow: 0 0 16px 2px var(--gold), inset 0 1px 0 rgba(255,255,255,.8); }

  /* いま動いている段 */
  .tb.live { border-color: #fff4c2; }

  /* 切り落とされたかけら。飾りなので落ちきらなくても困らない */
  .tchip {
    position: absolute; z-index: 3; border-radius: 6px;
    background: linear-gradient(180deg, #e8cf84 0%, #b98f33 100%);
    border: 1.5px solid #6d4f17; opacity: .95;
    animation: tChip .62s ease-in forwards;
  }
  @keyframes tChip {
    0%   { transform: translateY(0) rotate(0); opacity: .95; }
    100% { transform: translateY(240px) rotate(42deg); opacity: 0; }
  }

  /* 流れる雲。高くなってきた感じを出すための飾り */
  .t-cloud {
    position: absolute; z-index: 1; pointer-events: none;
    border-radius: 999px; background: rgba(255, 255, 255, .5);
    filter: blur(1px);
  }
  .t-cloud::before, .t-cloud::after {
    content: ''; position: absolute; border-radius: 999px; background: inherit;
  }
  .t-cloud::before { left: 16%; top: -52%; width: 42%; height: 150%; }
  .t-cloud::after  { right: 14%; top: -34%; width: 34%; height: 128%; }

  /* ぴったり置けたときの波紋 */
  .t-ring {
    position: absolute; z-index: 6; pointer-events: none;
    border: 3px solid var(--gold); border-radius: 12px;
    animation: tRing .5s ease-out forwards;
  }
  @keyframes tRing {
    0%   { transform: scale(1); opacity: .95; }
    100% { transform: scale(1.9); opacity: 0; }
  }

  /* 節目。10段ごとに光らせる */
  .t-flash {
    position: absolute; inset: 0; z-index: 7; pointer-events: none;
    background: radial-gradient(circle at 50% 60%, rgba(255,214,10,.55), transparent 66%);
    opacity: 0; transition: opacity .16s;
  }
  #stage.mile .t-flash { opacity: 1; }

  /* 節目の帯 */
  .t-mile {
    position: absolute; left: 0; right: 0; top: 30%; z-index: 8; text-align: center;
    pointer-events: none; opacity: 0;
    font-family: 'Dela Gothic One', sans-serif; font-size: 30px; color: #fff;
    text-shadow: 0 0 20px var(--gold), 3px 3px 0 var(--red-d);
  }
  .t-mile.on { animation: tMile 1.1s ease-out; }
  @keyframes tMile {
    0%   { opacity: 0; transform: scale(.6); }
    18%  { opacity: 1; transform: scale(1.12); }
    34%  { transform: scale(1); }
    78%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-16px); }
  }

  /* 終わったときに塔が崩れる。飾りなので、途中で止まっても結果は出る */
  .tb.fall { animation: tFall .9s cubic-bezier(.5,0,.85,.3) forwards; }
  @keyframes tFall {
    0%   { transform: translate(0, 0) rotate(0); opacity: 1; }
    100% { transform: translate(var(--fx, 40px), 420px) rotate(var(--fr, 70deg)); opacity: .15; }
  }

  /* コンボ */
  .ahud-val.combo { color: var(--magenta); text-shadow: 0 0 12px var(--magenta); }

  /* まんなかの合図 */
  .t-cue {
    position: absolute; left: 0; right: 0; top: 13%; z-index: 6; text-align: center;
    font-family: 'Dela Gothic One', sans-serif; font-size: 23px; color: var(--gold);
    text-shadow: 0 0 18px var(--gold), 2px 2px 0 rgba(0,0,0,.5);
    opacity: 0; transition: opacity .12s;
  }
  .t-cue.on { opacity: 1; animation: tCue .42s ease-out; }
  @keyframes tCue {
    0%   { transform: scale(.7); }
    40%  { transform: scale(1.14); }
    100% { transform: scale(1); }
  }
</style>

<script src="../js/afro-rank-config.js"></script>
<script src="../js/afro-sfx.js"></script>
<script src="../js/afro-score.js"></script>
<script src="../js/afro-ui.js"></script>
<script>
(function () {
  var FACES = ['afuwa', 'buruma', 'chafuwa', 'kurofuwa', 'ginma', 'yancha'];
  var BH = 30;                 /* 1段の高さ */
  var VIS = 8;                 /* 画面に見せておく段数。これを超えたら下へずらす */
  var SPD0 = 150, SPD_UP = 9, SPD_MAX = 480;   /* 横に流れる速さ px/秒 */
  var PERFECT = 5;             /* この幅までのズレは「ぴったり」 */
  var PERFECT_RUN = 3;         /* 続けてぴったりなら太くなる */
  var GROW = 14;               /* 太くなる幅 */

  var stage  = document.getElementById('stage');
  var col    = document.getElementById('col');
  var sky    = document.getElementById('sky');
  var cueEl  = document.getElementById('cue');
  var mileEl = document.getElementById('mile');
  var floorEl = document.getElementById('hFloor');
  var perfEl  = document.getElementById('hPerf');
  var bestEl  = document.getElementById('hBest');

  var W = 0, H = 0, baseW = 0;
  var blocks = [];             /* 積んだ段 [{left, w}] 0番目は土台 */
  var live = null;             /* いま流れている段 {left, w, dir, el} */
  var perfRun = 0, perfBest = 0;
  var MILE = 10;               /* 何段ごとに節目にするか */
  var playing = false, raf = 0, last = 0;

  (function () {
    for (var i = 0; i < FACES.length; i++) {
      var im = new Image(); im.src = '../images/face/' + FACES[i] + '.webp';
    }
    var b = new Image(); b.src = '../images/tower/base.webp';
  })();

  function screen(id) {
    var all = document.querySelectorAll('.ascreen');
    for (var i = 0; i < all.length; i++) all[i].classList.toggle('active', all[i].id === id);
  }

  AfroScore.setup({
    game: 'tower',
    title: 'アフロタワー',
    hash: 'アフロタワー',
    unit: '段',
    lower: false,
    grades: [
      { v: 40, name: '雲の上' },
      { v: 28, name: 'G1級の積み' },
      { v: 20, name: 'オープン級' },
      { v: 14, name: '3勝クラス' },
      { v: 8,  name: '1勝クラス' },
      { v: 0,  name: '新馬' }
    ],
    onRetry: go
  });

  function cue(text) {
    cueEl.textContent = text;
    cueEl.classList.remove('on'); void cueEl.offsetWidth;
    cueEl.classList.add('on');
    clearTimeout(cue._t);
    cue._t = setTimeout(function () { cueEl.classList.remove('on'); }, 640);
  }

  /* ぴったり置けたときの波紋。飾り */
  function ring(el) {
    var r = document.createElement('div');
    r.className = 't-ring';
    r.style.left = el.style.left;
    r.style.width = el.style.width;
    r.style.height = el.style.height;
    r.style.bottom = el.style.bottom;
    col.appendChild(r);
    setTimeout(function () { r.remove(); }, 560);
  }

  /* 節目。10段ごとに光らせて帯を出す */
  function milestone(n) {
    mileEl.textContent = n + '段！';
    mileEl.classList.remove('on'); void mileEl.offsetWidth;
    mileEl.classList.add('on');
    stage.classList.add('mile');
    clearTimeout(milestone._t);
    milestone._t = setTimeout(function () { stage.classList.remove('mile'); }, 260);
    Sfx.record();
  }

  /* 連続ぴったりの音。1回ごとに1音ずつ上がっていく */
  var SCALE = [0, 2, 4, 5, 7, 9, 11, 12];
  function comboNote(run) {
    var i = Math.min(run - 1, 15);
    var semi = SCALE[i % SCALE.length] + 12 * Math.floor(i / SCALE.length);
    Sfx.note(523.25 * Math.pow(2, semi / 12));
  }

  /* 空に雲を置く。奥行きが出て、高くなった実感につながる */
  function makeSky() {
    sky.innerHTML = '';
    for (var i = 0; i < 7; i++) {
      var c = document.createElement('div');
      c.className = 't-cloud';
      var w = 46 + Math.random() * 78;
      c.style.width = w + 'px';
      c.style.height = (w * 0.3) + 'px';
      c.style.left = (Math.random() * 92) + '%';
      c.style.bottom = (60 + Math.random() * 520) + 'px';
      c.style.opacity = (0.16 + Math.random() * 0.24).toFixed(2);
      sky.appendChild(c);
    }
  }

  /* 積んだ段を1枚描く。i 段目は下から i*BH の位置 */
  function makeEl(i, left, w, cls) {
    var e = document.createElement('div');
    e.className = 'tb' + (cls ? ' ' + cls : '');
    e.style.left = left + 'px';
    e.style.width = w + 'px';
    /* 土台だけ2段ぶんの高さにして、下半分は画面の外へ */
    e.style.height = (cls === 'base' ? BH * 2 : BH) + 'px';
    e.style.bottom = (cls === 'base' ? -BH : i * BH) + 'px';
    var src = (cls === 'base')
      ? '../images/tower/base.webp'
      : '../images/face/' + FACES[i % FACES.length] + '.webp';
    var img = document.createElement('img');
    img.src = src;
    img.alt = '';
    /* 絵がまだ無ければ外す。下の色だけで積み木として成立する */
    img.addEventListener('error', function () { this.remove(); });
    e.appendChild(img);
    col.appendChild(e);
    return e;
  }

  /* 塔が伸びたぶん、器ごと下へずらして頭を画面内に保つ */
  function follow() {
    var over = Math.max(0, blocks.length - VIS);
    col.style.transform = 'translateY(' + (over * BH) + 'px)';
    /* 雲は塔の半分だけ下げる。奥のものはゆっくり動いて見える */
    sky.style.transform = 'translateY(' + (over * BH * 0.5) + 'px)';
    stage.style.setProperty('--sky', String(Math.min(30, blocks.length)));
  }

  function spawn() {
    var top = blocks[blocks.length - 1];
    var i = blocks.length;
    var fromLeft = (i % 2 === 0);
    var e = makeEl(i, fromLeft ? 0 : (W - top.w), top.w, 'live');
    live = {
      left: fromLeft ? 0 : (W - top.w),
      w: top.w,
      dir: fromLeft ? 1 : -1,
      spd: Math.min(SPD_MAX, SPD0 + i * SPD_UP),
      el: e
    };
    follow();
  }

  function chip(left, w, bottom) {
    var c = document.createElement('div');
    c.className = 'tchip';
    c.style.left = left + 'px';
    c.style.width = w + 'px';
    c.style.height = BH + 'px';
    c.style.bottom = bottom + 'px';
    col.appendChild(c);
    setTimeout(function () { c.remove(); }, 700);
  }

  function drop() {
    if (!playing || !live) return;
    var prev = blocks[blocks.length - 1];
    var i = blocks.length;

    var l = Math.max(prev.left, live.left);
    var r = Math.min(prev.left + prev.w, live.left + live.w);
    var w = r - l;

    if (w <= 2) { over(); return; }

    var gap = Math.abs(live.left - prev.left);
    if (gap <= PERFECT) {                 /* ぴったり */
      l = prev.left; w = prev.w;
      perfRun++;
      if (perfRun > perfBest) perfBest = perfRun;
      perfEl.textContent = perfRun;
      live.el.classList.add('perfect');
      ring(live.el);
      comboNote(perfRun);
      if (perfRun % PERFECT_RUN === 0) {  /* ごほうびに太くする。土台の幅までで打ち止め */
        var nw = Math.min(baseW, w + GROW);
        l = Math.max(0, Math.min(W - nw, l - GROW / 2));
        w = nw;
        cue('ふとくなった！');
      } else if (perfRun >= 2) {
        cue(perfRun + '連続！');
      } else {
        cue('ぴったり！');
      }
    } else {
      if (perfRun >= 3) cue('とぎれた');
      perfRun = 0;
      perfEl.textContent = '0';
      /* はみ出したかけらを落とす */
      if (live.left < l) chip(live.left, l - live.left, i * BH);
      else chip(r, (live.left + live.w) - r, i * BH);
      Sfx.hit();
    }

    live.el.classList.remove('live');
    live.el.style.left = l + 'px';
    live.el.style.width = w + 'px';
    blocks.push({ left: l, w: w });
    live = null;
    var floors = blocks.length - 1;
    floorEl.textContent = floors;
    if (floors % MILE === 0) milestone(floors);
    spawn();
  }

  function over() {
    playing = false;
    cancelAnimationFrame(raf);
    if (live && live.el) live.el.remove();
    live = null;
    stage.classList.remove('ashake'); void stage.offsetWidth; stage.classList.add('ashake');
    Sfx.bad();

    /* 上から順に崩れ落ちる。飾りなので、途中で止まっても結果は出る */
    var all = col.querySelectorAll('.tb:not(.base)');
    for (var k = all.length - 1, d = 0; k >= 0 && d < 12; k--, d++) {
      (function (el, delay) {
        setTimeout(function () {
          var sign = (Math.random() < 0.5) ? -1 : 1;
          el.style.setProperty('--fx', (sign * (30 + Math.random() * 90)) + 'px');
          el.style.setProperty('--fr', (sign * (40 + Math.random() * 80)) + 'deg');
          el.classList.add('fall');
        }, delay);
      })(all[k], d * 55);
    }

    var score = blocks.length - 1;
    setTimeout(function () {
      AfroScore.finish(score);
      bestEl.textContent = document.getElementById('gBest').textContent;
    }, 900);
  }

  function step(t) {
    if (!playing) return;
    var dt = Math.min(0.045, (t - last) / 1000);
    last = t;
    if (live) {
      live.left += live.dir * live.spd * dt;
      if (live.left <= 0) { live.left = 0; live.dir = 1; }
      var max = W - live.w;
      if (live.left >= max) { live.left = max; live.dir = -1; }
      live.el.style.left = live.left + 'px';
    }
    raf = requestAnimationFrame(step);
  }

  function go() {
    screen('scPlay');
    cancelAnimationFrame(raf);
    col.innerHTML = '';
    col.style.transform = 'translateY(0)';
    blocks = []; live = null; perfRun = 0; perfBest = 0;
    makeSky();
    stage.classList.remove('mile');
    mileEl.classList.remove('on');
    floorEl.textContent = '0';
    perfEl.textContent = '0';
    bestEl.textContent = document.getElementById('gBest').textContent;

    W = stage.clientWidth || 320;
    H = stage.clientHeight || 360;
    VIS = Math.max(5, Math.floor(H / BH) - 2);

    baseW = Math.round(W * 0.56);
    var base = { left: Math.round((W - baseW) / 2), w: baseW };
    blocks.push(base);
    makeEl(0, base.left, base.w, 'base');

    playing = true;
    spawn();
    Sfx.bgm('tower');
    Sfx.start();
    last = performance.now();
    raf = requestAnimationFrame(step);
  }

  var viaPointer = false;
  stage.addEventListener('pointerdown', function (e) { e.preventDefault(); viaPointer = true; drop(); });
  stage.addEventListener('click', function () {
    if (viaPointer) { viaPointer = false; return; }
    drop();
  });
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* 画面の幅が変わったら、はみ出したままにならないよう入れ直す */
  addEventListener('resize', function () {
    if (!playing) return;
    var nw = stage.clientWidth || W;
    if (nw === W) return;
    W = nw;
    if (live && live.left + live.w > W) {
      live.left = Math.max(0, W - live.w);
      live.el.style.left = live.left + 'px';
    }
  });

  document.getElementById('startBtn').addEventListener('click', function () { Sfx.unlock(); go(); });

  var snd = document.getElementById('sndBtn');
  function paintSnd() {
    snd.classList.toggle('on', Sfx.enabled());
    snd.textContent = Sfx.enabled() ? 'SOUND' : 'MUTED';
  }
  snd.addEventListener('click', function () { Sfx.toggle(); paintSnd(); });
  paintSnd();
})();
</script>
</body>
</html>
