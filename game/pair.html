<style>
  /* 背景の絵がまだ無いあいだは、下の色だけが見える */
  #scTitle { --bgt: url(../images/bgt/pair.webp); --veil: .58; }

  #scPlay { padding-bottom: 6px; }
  #scPlay .ain.grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* 場。カードが緑なので、台は木の色にして浮かせる */
  #stage {
    background-color: #3a2a1b;
    background-image:
      radial-gradient(120% 80% at 50% 0%, rgba(255,214,150,.10), transparent 62%),
      repeating-linear-gradient(90deg,
        rgba(0,0,0,.10) 0 2px, transparent 2px 5px,
        rgba(255,255,255,.03) 5px 6px, transparent 6px 11px);
    padding: 10px;
    display: grid; gap: 8px;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(4, 1fr);
  }
  @media (min-width: 560px) {
    #stage { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); }
  }

  /* 1枚のカード。表と裏を背中合わせにして回す */
  .pc { position: relative; perspective: 620px; cursor: pointer; min-height: 0; }
  .pc-in {
    position: absolute; inset: 0; transform-style: preserve-3d;
    transition: transform .34s cubic-bezier(.3,.8,.35,1);
  }
  .pc.on .pc-in, .pc.done .pc-in { transform: rotateY(180deg); }
  .pc-f, .pc-b {
    position: absolute; inset: 0; border-radius: 8px; overflow: hidden;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
  }

  /* 裏面。画像が入るまでは、ここに書いた絵がそのまま見える */
  .pc-b {
    background: linear-gradient(160deg, #1d6b45 0%, #0f4a2e 55%, #0a3522 100%);
    border: 2px solid #f0e6c8;
    box-shadow: inset 0 0 0 2px #0a3522, 0 2px 6px rgba(0,0,0,.45);
  }
  .pc-b::after {           /* まんなかのアフロ印 */
    content: ''; width: 56%; height: 46%;
    background:
      radial-gradient(circle at 50% 74%, #0a3522 0 40%, transparent 41%),
      radial-gradient(circle at 22% 52%, #0a3522 0 28%, transparent 29%),
      radial-gradient(circle at 78% 52%, #0a3522 0 28%, transparent 29%),
      radial-gradient(circle at 36% 24%, #0a3522 0 26%, transparent 27%),
      radial-gradient(circle at 64% 24%, #0a3522 0 26%, transparent 27%);
    opacity: .9;
  }
  /* 裏の絵が入ったら、CSSで描いていた裏面は引っこめる。
     絵じたいが枠まで描いてあるので、切らずに収める */
  .pc-b.pic { background: none; border: 0; box-shadow: none; }
  .pc-b.pic::after { display: none; }
  .pc-b img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }

  /* 表面 */
  .pc-f {
    transform: rotateY(180deg);
    background: #fbf5e2; border: 2px solid #e2d4a8;
    box-shadow: 0 2px 6px rgba(0,0,0,.45);
  }
  .pc-f img { width: 86%; height: 86%; object-fit: contain; }

  .pc.done { cursor: default; animation: pcPop .3s ease-out; }
  .pc.done .pc-f { border-color: var(--gold); box-shadow: 0 0 14px rgba(255,214,10,.65); }
  @keyframes pcPop { 40% { transform: scale(1.08); } }
  .pc.miss .pc-f { border-color: var(--red); }

  /* そろった組のしるし */
  .p-left { display: flex; gap: 5px; justify-content: center; padding: 8px 0 4px; }
  .p-left i {
    width: 22px; height: 6px; border-radius: 3px;
    background: rgba(255,255,255,.16); transition: background .2s;
  }
  .p-left i.done { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
</style>
</head>
<body class="nav-game">

<div class="abg"></div>

<nav class="anav">
  <a class="anav-logo" href="../game.html">AFRO<em>Horse</em></a>
  <div class="anav-r">
    <button class="anav-btn" type="button" id="sndBtn">SOUND</button>
    <a class="anav-btn" href="../game.html">EXIT</a>
  </div>
</nav>

<!-- ===== タイトル ===== -->
<section class="ascreen active" id="scTitle">
  <div class="at-eye">MEMORY PAIR</div>
  <h1 class="at-logo" data-name="アフロペア"><img src="../images/icon/pair.webp" alt="アフロペア"></h1>
  <p class="at-sub">同じ顔の2枚を、そろえる</p>
  <div class="at-best">自己ベスト <b id="gBest">—</b></div>
  <button class="abtn" type="button" id="startBtn">スタート</button>
  <button class="abtn ghost" type="button" id="howBtn">説明</button>
</section>

<!-- ===== 説明 ===== -->
<div class="ahow" id="howPop" hidden>
  <div class="ahow-card">
    <div class="ahow-t">あそびかた</div>
    <ul class="at-how">
    <li>はじめの2秒だけ、12枚ぜんぶが見える</li>
    <li>カードをめくって、同じアフロ馬の2枚をそろえる</li>
    <li>ちがう2枚をめくると裏にもどる</li>
    <li>6組そろうまでの速さが記録。そろわなかった1回につき2秒つく</li>
    </ul>
    <button class="gr-btn primary" type="button" id="howClose">とじる</button>
  </div>
</div>

<!-- ===== プレイ ===== -->
<section class="ascreen" id="scPlay">
  <div class="ain">
    <div class="ahud">
      <div class="ahud-cell"><span class="ahud-lbl">TIME</span><span class="ahud-val" id="hTime">0.0</span></div>
      <div class="ahud-cell"><span class="ahud-lbl">MISS</span><span class="ahud-val" id="hMiss">0</span></div>
      <div class="ahud-cell"><span class="ahud-lbl">BEST</span><span class="ahud-val gold" id="hBest">—</span></div>
    </div>
  </div>
  <div class="ain grow">
    <div class="astage" id="stage"></div>
    <div class="p-left" id="left"></div>
    <p class="astage-note">カードをタップしてめくります</p>
  </div>
</section>

<div id="gResult"></div>

<script src="../js/afro-rank-config.js"></script>
<script src="../js/afro-sfx.js"></script>
<script src="../js/afro-score.js"></script>
<script src="../js/afro-ui.js"></script>
<script>
(function () {
  var FACES = ['afuwa', 'buruma', 'chafuwa', 'kurofuwa', 'ginma', 'yancha'];
  var PAIRS = FACES.length;
  var MISS_PENALTY = 20;          /* 0.1秒きざみで数えるので 20 = 2.0秒 */
  var PEEK_MS = 2000;             /* はじめに見せる時間 */
  var BACK = '../images/pair/back.webp';

  var stage  = document.getElementById('stage');
  var leftEl = document.getElementById('left');
  var timeEl = document.getElementById('hTime');
  var missEl = document.getElementById('hMiss');
  var bestEl = document.getElementById('hBest');


  var cards = [], open = [], done = 0, miss = 0;
  var startAt = 0, tick = null, busy = false, playing = false;

  /* 先に読ませておく。めくった瞬間に一拍おかないように */
  (function () {
    for (var i = 0; i < FACES.length; i++) {
      var im = new Image(); im.src = '../images/face/' + FACES[i] + '.webp';
    }
  })();

  /* カードの裏の絵。あるかどうかを1回だけ確かめて、
     あれば全部の裏に貼る。無ければCSSで描いた裏面をそのまま使う */
  var backOk = false;
  (function () {
    var probe = new Image();
    probe.onload = function () { backOk = true; applyBack(); };
    probe.src = BACK;
  })();
  function applyBack() {
    if (!backOk) return;
    var bs = stage.querySelectorAll('.pc-b');
    for (var i = 0; i < bs.length; i++) {
      if (bs[i].querySelector('img')) continue;
      var im = document.createElement('img');
      im.src = BACK; im.alt = '';
      bs[i].appendChild(im);
      bs[i].classList.add('pic');
    }
  }

  function screen(id) {
    var all = document.querySelectorAll('.ascreen');
    for (var i = 0; i < all.length; i++) all[i].classList.toggle('active', all[i].id === id);
  }

  AfroScore.setup({
    game: 'pair',
    title: 'アフロペア',
    hash: 'アフロペア',
    lower: true,
    format: function (v) { return (v / 10).toFixed(1) + '秒'; },
    grades: [
      { v: 220, name: '神がかりの記憶' },
      { v: 300, name: 'G1級の記憶' },
      { v: 400, name: 'オープン級' },
      { v: 550, name: '3勝クラス' },
      { v: 750, name: '1勝クラス' },
      { v: Infinity, name: '新馬' }
    ],
    onRetry: go
  });

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function paintLeft() {
    var h = '';
    for (var i = 0; i < PAIRS; i++) h += '<i class="' + (i < done ? 'done' : '') + '"></i>';
    leftEl.innerHTML = h;
  }

  /* 経過は時刻の引き算で出す。裏に回って表示が止まっても記録はずれない */
  function elapsed() { return Math.round((Date.now() - startAt) / 100); }
  function paintTime() { timeEl.textContent = (elapsed() / 10).toFixed(1); }

  function build() {
    var deck = shuffle(FACES.concat(FACES));
    stage.innerHTML = '';
    cards = [];
    for (var i = 0; i < deck.length; i++) {
      var c = document.createElement('div');
      c.className = 'pc';
      c.setAttribute('data-face', deck[i]);
      c.innerHTML =
        '<div class="pc-in">' +
          '<div class="pc-b"></div>' +
          '<div class="pc-f"><img src="../images/face/' + deck[i] + '.webp" alt=""></div>' +
        '</div>';
      stage.appendChild(c);
      cards.push(c);
    }
    applyBack();
  }

  function flip(c) {
    if (!playing || busy) return;
    if (c.classList.contains('on') || c.classList.contains('done')) return;

    c.classList.add('on');
    open.push(c);
    Sfx.tap();
    if (open.length < 2) return;

    busy = true;
    var a = open[0], b = open[1];
    open = [];

    if (a.getAttribute('data-face') === b.getAttribute('data-face')) {   /* そろった */
      setTimeout(function () {
        a.classList.add('done'); b.classList.add('done');
        a.classList.remove('on'); b.classList.remove('on');
        done++;
        paintLeft();
        Sfx.good();
        busy = false;
        if (done >= PAIRS) clear();
      }, 260);
    } else {                                                            /* ちがった */
      miss++;
      missEl.textContent = miss;
      a.classList.add('miss'); b.classList.add('miss');
      Sfx.bad();
      setTimeout(function () {
        a.classList.remove('on', 'miss');
        b.classList.remove('on', 'miss');
        busy = false;
      }, 760);
    }
  }

  function clear() {
    playing = false;
    clearInterval(tick);
    var score = elapsed() + miss * MISS_PENALTY;
    paintTime();
    setTimeout(function () {
      AfroScore.finish(score);
      bestEl.textContent = document.getElementById('gBest').textContent;
    }, 480);
  }

  function go() {
    clearTimeout(go._t); clearInterval(tick);
    done = 0; miss = 0; open = []; busy = false; playing = false;
    missEl.textContent = '0';
    timeEl.textContent = '0.0';
    bestEl.textContent = document.getElementById('gBest').textContent;
    build();
    paintLeft();
    screen('scPlay');
    Sfx.bgm('pair');

    /* はじめの2秒だけ全部見せる。おぼえる時間 */
    for (var i = 0; i < cards.length; i++) cards[i].classList.add('on');
    go._t = setTimeout(function () {
      for (var j = 0; j < cards.length; j++) cards[j].classList.remove('on');
      startAt = Date.now();
      playing = true;
      Sfx.start();
      tick = setInterval(paintTime, 100);
    }, PEEK_MS);
  }

  stage.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== stage && !t.classList.contains('pc')) t = t.parentNode;
    if (t && t !== stage) flip(t);
  });

  document.getElementById('startBtn').addEventListener('click', function () { Sfx.unlock(); go(); });

  var snd = document.getElementById('sndBtn');
  function paintSnd() {
    snd.classList.toggle('on', Sfx.enabled());
    snd.textContent = Sfx.enabled() ? 'SOUND' : 'MUTED';
  }
  snd.addEventListener('click', function () { Sfx.toggle(); paintSnd(); });
  paintSnd();
  paintLeft();
})();
</script>
</body>
</html>
