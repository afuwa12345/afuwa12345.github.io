<style>
  /* ---- アフロキャッチ ---- */
  #scPlay { padding-bottom: 6px; }
  #scPlay .ain.grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  #stage { overflow: hidden; }
  #stage::before {                        /* 受け取りライン */
    content: ''; position: absolute; left: 0; right: 0; bottom: 8px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: .5; z-index: 1;
  }

  /* 落ちてくるアフロ。何個も同時に降る */
  .c-afro {
    position: absolute; left: 50%; top: 0; width: 74px; height: 60px;
    transform: translate(-50%, -100px); z-index: 2; will-change: transform;
    opacity: .72; transition: opacity .16s;
  }
  .c-afro.img { height: auto; }
  /* いちばん下＝次に落ちるやつだけはっきり見せる */
  .c-afro.lead { opacity: 1; filter: drop-shadow(0 0 12px rgba(0, 240, 255, .55)); }
  .c-afro i {
    position: absolute; border-radius: 50%; background: var(--c);
    box-shadow: inset -4px -5px 0 rgba(0, 0, 0, .14);
  }
  .c-afro i:nth-child(1) { left: 12%; top: 26%; width: 42%; height: 58%; }
  .c-afro i:nth-child(2) { left: 44%; top: 24%; width: 44%; height: 60%; }
  .c-afro i:nth-child(3) { left: 27%; top: 2%;  width: 46%; height: 54%; }
  .c-afro i:nth-child(4) { left: 2%;  top: 44%; width: 34%; height: 44%; }
  .c-afro i:nth-child(5) { left: 64%; top: 42%; width: 34%; height: 46%; }
  .c-afro.img i { display: none; }
  .c-afro img { display: block; width: 100%; height: auto; }

  .c-afro.caught { animation: cCaught .3s ease-out forwards; }
  @keyframes cCaught {
    to { transform: translate(-50%, var(--y, 0px)) scale(.3); opacity: 0; }
  }

  /* 下に並ぶ6頭。3列×2段で大きく */
  .c-pad {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px;
    padding: 9px 0 2px;
  }
  .c-key {
    position: relative; padding: 5px 3px 4px; cursor: pointer;
    background: rgba(255, 255, 255, .05);
    border: 2px solid var(--grey2); border-radius: 12px;
    transition: transform .09s, border-color .12s, background .12s, box-shadow .12s;
  }
  .c-key img { display: block; width: 100%; height: auto; max-height: 76px; object-fit: contain; }
  .c-key b {
    position: absolute; left: 6px; right: 6px; bottom: -1px; height: 3px;
    border-radius: 2px; background: var(--c);
  }
  .c-key.ok  { border-color: var(--green); background: rgba(18, 209, 122, .2); box-shadow: 0 0 18px rgba(18, 209, 122, .5); }
  .c-key.ng  { border-color: var(--red);   background: rgba(255, 8, 68, .2);   box-shadow: 0 0 18px rgba(255, 8, 68, .5); }
  .c-key:active { transform: translateY(2px); }

  /* ライフ */
  .c-life { letter-spacing: 2px; }
  .c-life .off { opacity: .22; }

  #cue { z-index: 30; }
  #cue .acue-big { font-size: 70px; color: var(--gold); }
</style>
</head>
<body>

<div class="abg"></div>

<nav class="anav">
  <a class="anav-logo" href="../game.html">AFRO<em>Horse</em></a>
  <div class="anav-r">
    <button class="anav-btn" type="button" id="sndBtn">SOUND</button>
    <a class="anav-btn" href="../game.html">EXIT</a>
  </div>
</nav>

<!-- ===== タイトル ===== -->
<section class="ascreen active" id="scTitle">
  <div class="at-eye">CATCH</div>
  <h1 class="at-ttl">アフロキャッチ</h1>
  <p class="at-sub">落ちてきたアフロは、誰のアフロ？</p>
  <img class="at-hero" src="../images/face/buruma.webp" alt="">
  <div class="at-best">自己ベスト <b id="gBest">—</b></div>
  <button class="abtn" type="button" id="startBtn">スタート</button>
  <ul class="at-how">
    <li>上からアフロが次々に落ちてきます</li>
    <li>そのアフロの持ち主を下からタップ（下にあるものから）</li>
    <li>間違い・取りこぼしでライフが1つ減る</li>
    <li>ライフ3つ。だんだん速くなります</li>
  </ul>
</section>

<!-- ===== プレイ ===== -->
<section class="ascreen" id="scPlay">
  <div class="ain">
    <div class="ahud">
      <div class="ahud-cell"><span class="ahud-lbl">CATCH</span><span class="ahud-val gold" id="hScore">0</span></div>
      <div class="ahud-cell"><span class="ahud-lbl">COMBO</span><span class="ahud-val" id="hCombo">0</span></div>
      <div class="ahud-cell"><span class="ahud-lbl">LIFE</span><span class="ahud-val c-life" id="hLife">♥♥♥</span></div>
    </div>
  </div>
  <div class="ain grow">
    <div class="astage" id="stage">
      <div class="acue" id="cue" hidden><div class="acue-big" id="cueBig">3</div></div>
    </div>
    <div class="c-pad" id="pad"></div>
    <p class="astage-note">光っているのが、いちばん下のアフロ</p>
  </div>
</section>

<div id="gResult"></div>

<script src="../js/afro-rank-config.js"></script>
<script src="../js/afro-sfx.js"></script>
<script src="../js/afro-score.js"></script>
<script>
(function () {
  /* file … 顔アップ / afro … アフロ画像 / c … アフロの色 */
  var CHARAS = [
    { file: 'afuwa',    name: 'アフワ',        afro: 'afro_kuro', c: '#3b3128' },
    { file: 'buruma',   name: 'ブルマ',        afro: 'afro_mizu', c: '#7ec8e8' },
    { file: 'chafuwa',  name: 'チャフワ',      afro: 'afro_cha',  c: '#b5502a' },
    { file: 'kurofuwa', name: 'クロフワ',      afro: 'afro_kon',  c: '#2b3a5c' },
    { file: 'ginma',    name: 'ギンマ',        afro: 'afro_gin',  c: '#cfcfcf' },
    { file: 'yancha',   name: 'やんちゃアフワ', afro: 'afro_kin',  c: '#f0c33c' }
  ];
  var LIVES      = 3;
  var CATCH_LINE = 56;   /* 下から何pxで取りこぼしにするか */
  var MAX_DROPS  = 5;    /* 同時に降る上限。これ以上は見て分からなくなる */

  var stage  = document.getElementById('stage');
  var pad    = document.getElementById('pad');
  var cue    = document.getElementById('cue');
  var cueBig = document.getElementById('cueBig');
  var hScore = document.getElementById('hScore');
  var hCombo = document.getElementById('hCombo');
  var hLife  = document.getElementById('hLife');

  var keys = [], score = 0, combo = 0, lives = LIVES, playing = false;
  var drops = [], raf = null, last = 0, spawnTimer = null;

  function screen(id) {
    var all = document.querySelectorAll('.ascreen');
    for (var i = 0; i < all.length; i++) all[i].classList.toggle('active', all[i].id === id);
  }

  /* アフロ画像を先に読ませておく（降り始めてから読むとちらつく） */
  (function preload() {
    for (var i = 0; i < CHARAS.length; i++) {
      var im = new Image();
      im.src = '../images/afro/' + CHARAS[i].afro + '.webp';
    }
  })();

  /* ---- 下の6頭（3列×2段） ---- */
  (function build() {
    pad.innerHTML = CHARAS.map(function (c) {
      return '<button class="c-key" type="button" style="--c:' + c.c + '">' +
               '<img src="../images/face/' + c.file + '.webp" alt="' + c.name + '">' +
               '<b></b></button>';
    }).join('');
    keys = Array.prototype.slice.call(pad.querySelectorAll('.c-key'));
    keys.forEach(function (k, i) {
      var viaPointer = false;
      k.addEventListener('pointerdown', function (e) { e.preventDefault(); viaPointer = true; pick(i); });
      k.addEventListener('click', function () {
        if (viaPointer) { viaPointer = false; return; }
        pick(i);
      });
    });
  })();

  function setScore(v) { score = v; hScore.textContent = score; }

  function setCombo(v) {
    combo = v;
    hCombo.textContent = combo;
    hCombo.classList.toggle('gold', combo >= 5);
  }

  function setLife(v) {
    lives = v;
    var h = '';
    for (var i = 0; i < LIVES; i++) h += '<span class="' + (i < lives ? '' : 'off') + '">&#9829;</span>';
    hLife.innerHTML = h;
  }

  function flash(i, cls) {
    keys[i].classList.add(cls);
    setTimeout(function () { keys[i].classList.remove(cls); }, 260);
  }

  function float(text, cls, leftPct, topPx) {
    var f = document.createElement('span');
    f.className = 'afloat ' + cls;
    f.textContent = text;
    f.style.left = (leftPct == null ? 50 : leftPct) + '%';
    f.style.top  = (topPx == null ? stage.clientHeight * 0.5 : topPx) + 'px';
    stage.appendChild(f);
    setTimeout(function () { f.remove(); }, 700);
  }

  function shake() {
    stage.classList.remove('ashake');
    void stage.offsetWidth;
    stage.classList.add('ashake');
  }

  /* 落ちる速さと、次が降ってくる間隔。取るほどきつくなる */
  function fallMs()  { return Math.max(1700, 3400 - score * 45); }
  function spawnMs() { return Math.max(520,  1500 - score * 35); }

  function spawn() {
    if (!playing) return;

    if (drops.length < MAX_DROPS) {
      var idx = Math.floor(Math.random() * CHARAS.length);
      var c = CHARAS[idx];

      var el = document.createElement('div');
      el.className = 'c-afro';
      el.style.setProperty('--c', c.c);
      el.innerHTML = '<i></i><i></i><i></i><i></i><i></i>';
      var im = new Image();
      im.alt = '';
      im.onload = function () { el.classList.add('img'); el.appendChild(im); };
      im.src = '../images/afro/' + c.afro + '.webp';

      /* すでに降っているものと横位置が重ならないようにする */
      var lx, tries = 0;
      do {
        lx = 16 + Math.random() * 68;
        tries++;
      } while (tries < 8 && tooClose(lx));
      el.style.left = lx + '%';
      stage.appendChild(el);

      var elH  = el.offsetHeight || 60;
      var goal = stage.clientHeight - CATCH_LINE;
      var from = -(elH + 10);
      el.style.transform = 'translate(-50%,' + from + 'px)';

      drops.push({
        el: el, idx: idx, lx: lx, y: from, goal: goal,
        speed: (goal - from) / (fallMs() / 1000), done: false
      });
    }

    spawnTimer = setTimeout(spawn, spawnMs() * (0.8 + Math.random() * 0.4));
  }

  function tooClose(lx) {
    for (var i = 0; i < drops.length; i++) {
      if (Math.abs(drops[i].lx - lx) < 20) return true;
    }
    return false;
  }

  /* いちばん下のものを目立たせる */
  function markLead() {
    var lead = null;
    for (var i = 0; i < drops.length; i++) {
      if (drops[i].done) continue;
      if (!lead || drops[i].y > lead.y) lead = drops[i];
    }
    for (var j = 0; j < drops.length; j++) {
      drops[j].el.classList.toggle('lead', drops[j] === lead);
    }
  }

  function remove(d, caught) {
    d.done = true;
    var el = d.el;
    if (caught) {
      el.style.setProperty('--y', d.y + 'px');
      el.classList.add('caught');
      setTimeout(function () { el.remove(); }, 320);
    } else {
      el.remove();
    }
    var k = drops.indexOf(d);
    if (k >= 0) drops.splice(k, 1);
  }

  /* ライフを1つ減らす。0になったら終了して false を返す */
  function damage() {
    setLife(lives - 1);
    if (lives <= 0) { stop(); return false; }
    return true;
  }

  function step(t) {
    if (!playing) return;
    var dt = Math.min(0.05, (t - last) / 1000);
    last = t;

    for (var i = drops.length - 1; i >= 0; i--) {
      var d = drops[i];
      if (d.done) continue;
      d.y += d.speed * dt;
      d.el.style.transform = 'translate(-50%,' + d.y + 'px)';
      if (d.y >= d.goal) {                 /* 取りこぼし */
        float('MISS', 'minus', d.lx, d.goal - 30);
        remove(d, false);
        Sfx.bad();
        setCombo(0);
        shake();
        if (!damage()) return;
      }
    }
    markLead();

    raf = requestAnimationFrame(step);
  }

  function pick(i) {
    if (!playing) return;

    /* 降っているうち、いちばん下にある「合っているもの」を取る */
    var hit = null;
    for (var k = 0; k < drops.length; k++) {
      var d = drops[k];
      if (d.done || d.idx !== i) continue;
      if (!hit || d.y > hit.y) hit = d;
    }

    if (hit) {
      flash(i, 'ok');
      setCombo(combo + 1);
      setScore(score + 1);
      float('+1', 'plus', hit.lx, hit.y);
      Sfx.good();
      remove(hit, true);
      markLead();
    } else {
      flash(i, 'ng');
      setCombo(0);
      Sfx.bad();
      shake();
      damage();
    }
  }

  function clearAll() {
    for (var i = 0; i < drops.length; i++) drops[i].el.remove();
    drops = [];
    var olds = stage.querySelectorAll('.c-afro');
    for (var j = 0; j < olds.length; j++) olds[j].remove();
  }

  function stop() {
    playing = false;
    cancelAnimationFrame(raf);
    clearTimeout(spawnTimer);
    clearAll();
    AfroScore.finish(score);
  }

  function go() {
    screen('scPlay');
    clearTimeout(spawnTimer);
    cancelAnimationFrame(raf);
    clearAll();
    setScore(0); setCombo(0); setLife(LIVES);

    var n = 3;
    cue.hidden = false;
    cueBig.textContent = n;
    Sfx.count();
    var iv = setInterval(function () {
      n--;
      if (n > 0) { cueBig.textContent = n; Sfx.count(); return; }
      clearInterval(iv);
      cueBig.textContent = 'GO！';
      Sfx.start();
      setTimeout(function () {
        cue.hidden = true;
        playing = true;
        last = performance.now();
        raf = requestAnimationFrame(step);
        spawn();
      }, 460);
    }, 620);
  }

  AfroScore.setup({
    game: 'catch',
    title: 'アフロキャッチ',
    hash: 'アフロキャッチ',
    unit: '個',
    lower: false,
    grades: [
      { v: 45, name: 'G1級の目' },
      { v: 34, name: 'オープン級' },
      { v: 25, name: '3勝クラス' },
      { v: 17, name: '2勝クラス' },
      { v: 9,  name: '1勝クラス' },
      { v: 0,  name: '新馬' }
    ],
    onRetry: go
  });

  document.getElementById('startBtn').addEventListener('click', function () { Sfx.unlock(); go(); });

  var snd = document.getElementById('sndBtn');
  function paintSnd() {
    snd.classList.toggle('on', Sfx.enabled());
    snd.textContent = Sfx.enabled() ? 'SOUND' : 'MUTED';
  }
  snd.addEventListener('click', function () { Sfx.toggle(); paintSnd(); });
  paintSnd();
  setLife(LIVES);
})();
</script>
</body>
</html>
