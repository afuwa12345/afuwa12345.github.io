<style>
  #scTitle { --bgt: url(../images/bg/race.webp); --veil: .62; }

  #scPlay { padding-bottom: 6px; }
  #scPlay .ain.grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  #stage { cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }

  /* 遠景。コースの絵をそのまま使う */
  .r-far {
    position: absolute; inset: 0; z-index: 0;
    background: url(../images/bg/race.webp) center/cover no-repeat;
    filter: brightness(.88);
  }
  /* 芝の刈り跡。これが流れて速さを見せる */
  .r-turf {
    position: absolute; left: 0; right: 0; bottom: 0; height: 46%; z-index: 1;
    background: repeating-linear-gradient(90deg,
      rgba(255,255,255,.08) 0 40px, rgba(0,0,0,.10) 40px 80px);
    background-repeat: repeat-x;
    -webkit-mask-image: linear-gradient(to top, #000 62%, transparent);
    mask-image: linear-gradient(to top, #000 62%, transparent);
  }
  /* 横に流れる線。速いほど濃く出る */
  .r-speed {
    position: absolute; left: 0; right: 0; bottom: 0; height: 46%; z-index: 7;
    background: repeating-linear-gradient(90deg,
      rgba(255,255,255,.5) 0 34px, transparent 34px 150px);
    opacity: 0; pointer-events: none;
    -webkit-mask-image: linear-gradient(to top, transparent, #000 40%, transparent);
    mask-image: linear-gradient(to top, transparent, #000 40%, transparent);
  }
  .r-pole {
    position: absolute; bottom: 46%; z-index: 3; transform: translateX(-50%);
    font-family: 'Bebas Neue', sans-serif; font-size: 13px; color: #1a0e16;
    background: var(--gold); border-radius: 3px; padding: 1px 5px;
    box-shadow: 0 2px 0 rgba(0,0,0,.45);
  }
  .r-goal {
    position: absolute; top: 2%; bottom: 0; width: 11px; z-index: 4;
    transform: translateX(-50%);
    background: repeating-linear-gradient(#fff 0 10px, #1a0e16 10px 20px);
    box-shadow: 0 0 18px rgba(255,255,255,.8);
  }

  /* 馬 */
  .r-h {
    position: absolute; height: 96px; width: auto;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,.6));
    will-change: transform;
  }
  .r-h.me { height: 110px; }
  .r-h.run { animation: rBob .24s steps(2, end) infinite; }
  @keyframes rBob { 0% { margin-bottom: 0; } 100% { margin-bottom: 7px; } }

  /* ムチの輪。縮んできて、点線に重なった瞬間が「脚が地につく」とき */
  .r-ring, .r-mark {
    position: absolute; z-index: 20; pointer-events: none;
    border-radius: 50%; transform: translate(-50%, 50%);
  }
  .r-mark { width: 64px; height: 64px; border: 3px dashed rgba(255,255,255,.8); }
  .r-ring { width: 64px; height: 64px; border: 5px solid var(--gold);
            box-shadow: 0 0 14px rgba(240,190,70,.7), inset 0 0 10px rgba(240,190,70,.4); }
  .r-ring.hot { border-color: var(--green); box-shadow: 0 0 22px rgba(18,209,122,.95); }
  #stage.is-dead .r-ring, #stage.is-dead .r-mark { opacity: .25; }

  /* 風よけ */
  .r-draft {
    position: absolute; z-index: 22; transform: translate(-50%, 0);
    font-size: 11px; font-weight: 900; white-space: nowrap;
    color: #052; background: var(--green); border-radius: 999px; padding: 2px 9px;
    opacity: .55; box-shadow: 0 0 8px rgba(18,209,122,.4); transition: opacity .12s;
  }
  .r-draft.on { opacity: 1; box-shadow: 0 0 16px rgba(18,209,122,.9); }

  /* 実況 */
  .r-call {
    position: absolute; left: 0; right: 0; top: 0; z-index: 30; padding: 7px 10px;
    text-align: center; font-weight: 900; font-size: 15px;
    color: #fff; background: rgba(26,14,22,.84);
    border-bottom: 2px solid var(--gold);
    opacity: 0; transform: translateY(-100%); transition: opacity .12s, transform .12s;
  }
  .r-call.on { opacity: 1; transform: translateY(0); }

  /* スタミナ */
  .r-sta { padding: 9px 0 2px; }
  .r-sta-top {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; color: #a1959c; padding-bottom: 4px;
  }
  .r-sta-top b { font-family: 'Bebas Neue', sans-serif; font-size: 15px; color: var(--cyan); }
  .r-bar { height: 13px; border: 1px solid var(--grey2); border-radius: 999px;
           background: rgba(0,0,0,.45); overflow: hidden; }
  .r-bar i { display: block; height: 100%; width: 100%;
             background: linear-gradient(90deg, #12d17a, #8ce05a); }
  .r-bar.mid i { background: linear-gradient(90deg, #e8b53a, #f0d05a); }
  .r-bar.low i { background: linear-gradient(90deg, #e04a4a, #f07a5a); }
  .r-bar.out i { background: linear-gradient(90deg, #7a2a2a, #a03a3a); }

  .r-fin { color: var(--gold); }
  .r-fin.lose { color: #cfc3c9; }
</style>

<script src="../js/afro-rank-config.js"></script>
<script src="../js/afro-sfx.js"></script>
<script src="../js/afro-score.js"></script>
<script src="../js/afro-ui.js"></script>
<script>
(function () {
  /* ============================================================
     ゴール前200mの叩き合い。
     ・一定のリズムで「脚が地につく」。その瞬間にタップするとムチが決まる
     ・ピッタリなら大きく、ちょっとずれたら半分、外したら逆に減速
     ・ムチ1発ごとにスタミナが減る。全部は叩けない
     ・前の馬のすぐ後ろ（1.5〜7m）は風よけで、減りが半分
     ・速くなるほど脚の回転が速くなるので、終盤ほど難しい
     ============================================================ */
  var DIST  = 200;       /* 距離（m） */
  var V0    = 15.2;      /* はじめの脚 */
  var VMAX  = 21.6;      /* これ以上は出ない */
  var VMIN  = 11.0;
  var DECAY = 0.75;      /* 何もしないと落ちていく速さ */
  var FLOOR = 14.4;      /* 落ちていく先 */
  var HIT   = 1.55;      /* ピッタリの伸び（m/s） */
  var OK    = 1.05;      /* ちょいズレの伸び */
  var MISS  = 0.55;      /* から振りの減速 */
  var W_HIT = 0.075;     /* ピッタリと見なす幅（秒） */
  var W_OK  = 0.150;     /* ちょいズレの幅 */
  var COST  = 5.2;       /* ムチ1発のスタミナ */
  var COST_M= 3.0;       /* から振りでも少し減る */
  var DRAFT = 0.5;       /* 風よけのときの倍率 */
  var PPM   = 11.5;      /* 1m を何pxで描くか */
  var LANE  = ['3%', '15%', '27%', '39%'];

  /* ライバル3頭。u は進んだ割合。横並びから始まる */
  var RIVALS = [
    { nm: 'ブルマ',   img: 'buruma', lane: 0, x0:  3.0,
      v: function (u) { return 19.8 - 4.6 * u * u; } },        /* 先に抜け出して、最後バテる */
    { nm: 'チャフワ', img: 'chafuwa', lane: 1, x0:  1.2,
      v: function (u) { return 17.9 - 0.5 * u; } },            /* ずっと同じ脚 */
    { nm: 'ギンマ',   img: 'ginma', lane: 3, x0: -1.5,
      v: function (u) { return 16.3 + 4.4 * u * u; } }         /* 最後だけ伸びる */
  ];

  var stage  = document.getElementById('stage');
  var turf   = document.getElementById('turf');
  var speed  = document.getElementById('speed');
  var call   = document.getElementById('call');
  var cue    = document.getElementById('cue');
  var cueBig = document.getElementById('cueBig');
  var cueSub = document.getElementById('cueSub');
  var leftEl = document.getElementById('hLeft');
  var posEl  = document.getElementById('hPos');
  var timeEl = document.getElementById('hTime');
  var staTxt = document.getElementById('staTxt');
  var staBar = document.getElementById('staBar');
  var staFill= document.getElementById('staFill');

  /* 本物のキャラの絵ができるまでは、サイトにある正しい絵を色だけ変えて使う */
  function horse(nm) { return '../images/race/run_' + nm + '.webp'; }
  (function () {
    var all = ['afuwa', 'buruma', 'chafuwa', 'ginma'];
    for (var i = 0; i < all.length; i++) { var im = new Image(); im.src = horse(all[i]); }
  })();

  var me, foes, els, poles, goalEl, ringEl, markEl, draftEl;
  var state = 'idle', t0 = 0, last = 0, raf = null, cd = 0;
  var beat = 0, hits = 0, chain = 0, callT = 0, said = {};

  function screen(id) {
    var all = document.querySelectorAll('.ascreen');
    for (var i = 0; i < all.length; i++) all[i].classList.toggle('active', all[i].id === id);
  }

  AfroScore.setup({
    game: 'race',
    title: 'アフロ追い比べ',
    hash: 'アフロ追い比べ',
    lower: true,
    format: function (v) { return (v / 100).toFixed(2) + '秒'; },
    grades: [
      { v: 1060, name: 'レコード勝ち' },
      { v: 1100, name: 'GI級の決め手' },
      { v: 1150, name: 'オープン級' },
      { v: 1210, name: '3勝クラス' },
      { v: 1290, name: '1勝クラス' },
      { v: Infinity, name: '新馬' }
    ],
    onRetry: go
  });

  /* 速いほど脚の回転が速い。リズムの周期（秒） */
  function period(v) {
    var t = 0.52 - (v - 14) * 0.016;
    return t < 0.30 ? 0.30 : (t > 0.56 ? 0.56 : t);
  }

  function shout(msg) {
    call.textContent = msg;
    call.classList.add('on');
    callT = 1.25;
  }

  function pop(txt, kind) {
    var el = document.createElement('div');
    el.className = 'afloat ' + kind;
    el.textContent = txt;
    el.style.left = (stage.clientWidth * 0.34) + 'px';
    el.style.bottom = 'calc(' + LANE[me.lane] + ' + 112px)';
    stage.appendChild(el);
    setTimeout(function () { el.remove(); }, 900);
  }

  function build() {
    var junk = stage.querySelectorAll('.r-h, .r-pole, .r-goal, .r-ring, .r-mark, .r-draft, .afloat');
    for (var i = 0; i < junk.length; i++) junk[i].remove();
    els = []; poles = [];

    me = { x: 0, v: V0, sta: 100, dead: false, fin: 0, lane: 2 };
    foes = RIVALS.map(function (r) {
      return { r: r, x: r.x0, v: r.v(0), fin: 0, k: 0.99 + Math.random() * 0.02, passed: false };
    });

    foes.forEach(function (f) {
      var img = document.createElement('img');
      img.className = 'r-h';
      img.src = horse(f.r.img); img.alt = '';
      img.style.bottom = LANE[f.r.lane];
      img.style.zIndex = 10 - f.r.lane;
      stage.appendChild(img);
      els.push({ el: img, o: f });
    });
    var mine = document.createElement('img');
    mine.className = 'r-h me';
    mine.src = horse('afuwa'); mine.alt = 'あなたのアフロ馬';
    mine.style.bottom = LANE[me.lane];
    mine.style.zIndex = 10 - me.lane;
    stage.appendChild(mine);
    els.push({ el: mine, o: me, mine: true });

    markEl = document.createElement('div');
    markEl.className = 'r-mark';
    markEl.style.bottom = 'calc(' + LANE[me.lane] + ' + 36px)';
    stage.appendChild(markEl);

    ringEl = document.createElement('div');
    ringEl.className = 'r-ring';
    ringEl.style.bottom = 'calc(' + LANE[me.lane] + ' + 36px)';
    stage.appendChild(ringEl);

    draftEl = document.createElement('div');
    draftEl.className = 'r-draft';
    draftEl.textContent = '風よけ';
    draftEl.hidden = true;
    draftEl.style.bottom = 'calc(' + LANE[me.lane] + ' + 108px)';
    stage.appendChild(draftEl);

    for (var m = 50; m < DIST; m += 50) {
      var p = document.createElement('div');
      p.className = 'r-pole';
      p.textContent = (DIST - m) + 'm';
      stage.appendChild(p);
      poles.push({ el: p, m: m });
    }
    goalEl = document.createElement('div');
    goalEl.className = 'r-goal';
    stage.appendChild(goalEl);

    beat = 0; hits = 0; chain = 0; said = {};
  }

  function draw() {
    var w = stage.clientWidth;
    var camX = w * 0.34;
    var cam = me.x - camX / PPM;

    for (var i = 0; i < els.length; i++) {
      var e = els[i];
      var px = (e.o.x - cam) * PPM;
      var hw = (e.el.offsetWidth || 80) / 2;
      e.el.style.transform = 'translate(' + (px - hw) + 'px, 0)';
      e.el.classList.toggle('run', state === 'run');
    }
    for (var j = 0; j < poles.length; j++) {
      poles[j].el.style.left = ((poles[j].m - cam) * PPM) + 'px';
    }
    goalEl.style.left = ((DIST - cam) * PPM) + 'px';
    turf.style.backgroundPosition = (-(me.x * PPM) % 80) + 'px 0';
    speed.style.backgroundPosition = (-(me.x * PPM * 2.1) % 184) + 'px 0';
    speed.style.opacity = Math.max(0, Math.min(0.5, (me.v - 16) / 14));

    markEl.style.left = camX + 'px';
    ringEl.style.left = camX + 'px';
    draftEl.style.left = camX + 'px';
  }

  function paintHud() {
    leftEl.textContent = Math.max(0, Math.ceil(DIST - me.x)) + 'm';
    var ahead = 0;
    for (var i = 0; i < foes.length; i++) if (foes[i].x > me.x) ahead++;
    posEl.textContent = (ahead + 1) + '/4';
    var s = Math.max(0, Math.round(me.sta));
    staTxt.textContent = s;
    staFill.style.width = s + '%';
    staBar.className = 'r-bar' + (me.dead ? ' out' : s < 20 ? ' low' : s < 45 ? ' mid' : '');
  }

  function drafting() {
    for (var i = 0; i < foes.length; i++) {
      var d = foes[i].x - me.x;
      if (d > 1.5 && d < 7) return true;
    }
    return false;
  }

  /* ムチ */
  function whip() {
    if (state !== 'run' || me.fin) return;
    if (me.dead) { pop('バテた', 'minus'); return; }

    var T = period(me.v);
    var d = Math.min(beat, T - beat);          /* いちばん近い着地までの秒数 */

    if (d <= W_HIT) {
      me.v = Math.min(VMAX, me.v + HIT);
      me.sta -= COST * (drafting() ? DRAFT : 1);
      hits++; chain++;
      pop(chain >= 3 ? 'ピッタリ ' + chain : 'ピッタリ', 'plus');
      Sfx.good();
    } else if (d <= W_OK) {
      me.v = Math.min(VMAX, me.v + OK);
      me.sta -= COST * (drafting() ? DRAFT : 1);
      hits++; chain = 0;
      pop('セーフ', 'plus');
      Sfx.tap();
    } else {
      me.v = Math.max(VMIN, me.v - MISS);
      me.sta -= COST_M;
      chain = 0;
      pop('から振り', 'minus');
      Sfx.tap();
    }
    if (me.sta <= 0) {
      me.sta = 0; me.dead = true;
      shout('バテた！もう脚がない！');
      Sfx.bad();
      stage.classList.remove('ashake'); void stage.offsetWidth; stage.classList.add('ashake');
    }
  }

  function step(now) {
    raf = requestAnimationFrame(step);
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (dt <= 0) return;

    if (callT > 0) { callT -= dt; if (callT <= 0) call.classList.remove('on'); }

    if (state === 'count') {
      cd -= dt;
      var n = Math.ceil(cd);
      if (n > 0) {
        if (cueBig.textContent !== String(n)) { cueBig.textContent = String(n); Sfx.tap(); }
      } else {
        cue.hidden = true;
        state = 'run';
        t0 = now;
        Sfx.start();
        shout('さあ、ゴール前の叩き合いだ！');
      }
      draw();
      return;
    }
    if (state !== 'run') { draw(); return; }

    var el = (now - t0) / 1000;
    timeEl.textContent = el.toFixed(2);

    /* --- 自分 --- */
    if (!me.fin) {
      var T = period(me.v);
      beat += dt;
      while (beat >= T) beat -= T;

      /* 輪は、つぎの着地に向かって縮む */
      var sc = 2.3 - 1.3 * (beat / T);
      ringEl.style.width = ringEl.style.height = (64 * sc) + 'px';
      var near = Math.min(beat, T - beat) <= W_OK;
      ringEl.classList.toggle('hot', near && !me.dead);

      var dr = drafting();
      draftEl.hidden = !dr;
      draftEl.classList.toggle('on', dr);

      /* 何もしなければ落ちていく。バテていると落ちかたが速い */
      var floor = me.dead ? VMIN : FLOOR;
      me.v += (floor - me.v) * (me.dead ? 1.6 : 1) * DECAY * dt;
      if (me.v > VMAX) me.v = VMAX;
      me.x += me.v * dt;
      if (me.x >= DIST) { me.x = DIST; me.fin = el; }
    }

    /* --- ライバル --- */
    for (var i = 0; i < foes.length; i++) {
      var f = foes[i];
      if (!f.fin) {
        var u = Math.min(1, Math.max(0, f.x / DIST));
        f.v = f.r.v(u) * f.k;
        f.x += f.v * dt;
        if (f.x >= DIST) { f.x = DIST; f.fin = el; }
      }
      /* 抜いた瞬間に実況 */
      if (!f.passed && me.x > f.x + 0.6 && !me.fin) {
        f.passed = true;
        shout(f.r.nm + 'をかわした！');
      } else if (f.passed && f.x > me.x + 0.6) {
        f.passed = false;
      }
    }

    var leftm = DIST - me.x;
    if (!said.h100 && leftm <= 100) { said.h100 = true; shout('のこり100！'); }
    if (!said.h50  && leftm <= 50)  { said.h50  = true; shout('のこり50！ここだ！'); }

    stage.classList.toggle('is-dead', me.dead);
    draw();
    paintHud();

    if (me.fin && el > me.fin + 1.0) finish();
  }

  function sa(d) {
    if (d < 0.05) return 'ハナ';
    if (d < 0.18) return 'アタマ';
    if (d < 0.40) return 'クビ';
    if (d < 1.2)  return '1/2馬身';
    if (d < 2.0)  return '3/4馬身';
    var b = d / 2.4;
    if (b >= 10) return '大差';
    return (Math.round(b * 2) / 2) + '馬身';
  }

  function finish() {
    if (state === 'over') return;
    state = 'over';
    cancelAnimationFrame(raf);
    call.classList.remove('on');

    var all = [{ nm: 'あなた', t: me.fin, mine: true }];
    for (var i = 0; i < foes.length; i++) {
      var f = foes[i];
      all.push({ nm: f.r.nm, t: f.fin || (me.fin + (DIST - f.x) / Math.max(6, f.v)) });
    }
    all.sort(function (a, b) { return a.t - b.t; });

    var rank = 0;
    for (var j = 0; j < all.length; j++) if (all[j].mine) rank = j + 1;
    var other = rank === 1 ? all[1] : all[0];
    var gap = Math.abs(other.t - me.fin) * 18;
    var word = rank === 1 ? sa(gap) + '差で1着' : rank + '着（1着と ' + sa(gap) + '）';

    cue.hidden = false;
    cueBig.className = 'acue-big r-fin' + (rank === 1 ? '' : ' lose');
    cueBig.textContent = word;
    cueSub.textContent = me.fin.toFixed(2) + '秒　ムチ ' + hits + '発';
    if (rank === 1) Sfx.good(); else Sfx.tap();

    setTimeout(function () { AfroScore.finish(Math.round(me.fin * 100)); }, 1100);
  }

  /* ---------- 操作 ---------- */
  var viaPointer = false;
  stage.addEventListener('pointerdown', function (e) { e.preventDefault(); viaPointer = true; whip(); });
  stage.addEventListener('click', function () {
    if (viaPointer) { viaPointer = false; return; }
    whip();
  });
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); whip(); }
  });
  window.addEventListener('resize', function () { if (els) draw(); });

  function go() {
    cancelAnimationFrame(raf);
    build();
    state = 'count';
    cd = 2.4;
    cue.hidden = false;
    cueBig.className = 'acue-big';
    cueBig.textContent = '3';
    cueSub.textContent = '輪が重なった瞬間にタップ';
    timeEl.textContent = '0.00';
    stage.className = 'astage';
    call.classList.remove('on');
    paintHud();
    draw();
    screen('scPlay');
    Sfx.bgm('race');
    last = performance.now();
    raf = requestAnimationFrame(step);
  }

  document.getElementById('startBtn').addEventListener('click', function () { Sfx.unlock(); go(); });

  var snd = document.getElementById('sndBtn');
  function paintSnd() {
    snd.classList.toggle('on', Sfx.enabled());
    snd.textContent = Sfx.enabled() ? 'SOUND' : 'MUTED';
  }
  snd.addEventListener('click', function () { Sfx.toggle(); paintSnd(); });
  paintSnd();
})();
</script>
</body>
</html>
