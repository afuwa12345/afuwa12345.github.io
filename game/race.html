<style>
  /* タイトル画面の背景。夕方のコースの絵。明るめなので薄膜は .62 */
  #scTitle { --bgt: url(../images/bg/jump.webp); --veil: .62; }

  /* 絵がまだ無いので、題字は文字で組む。アイコンができたら
     .at-logo の中身を <img src="../images/icon/race.webp"> に差しかえるだけ */
  .r-logo {
    font-family: 'Dela Gothic One', sans-serif; font-size: 30px; line-height: 1.25;
    color: #fff; text-shadow: 0 0 18px rgba(0,0,0,.9), 0 3px 0 #1d1118;
    animation: aBob 2.4s ease-in-out infinite;
  }
  .r-logo em { font-style: normal; color: var(--gold); display: block; }

  /* ---- 馬場 ---- */
  #scPlay { padding-bottom: 6px; }
  #scPlay .ain.grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  #stage { cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }

  /* 遠景。コースの絵をそのまま使う。遠くのものはほとんど流れないので動かさない */
  .r-far {
    position: absolute; inset: 0; z-index: 0;
    background: url(../images/bg/jump.webp) center/cover no-repeat;
    filter: brightness(.88);
  }
  /* 芝。絵の芝の上に刈り跡の縞だけを重ねて、横に流す */
  .r-turf {
    position: absolute; left: 0; right: 0; bottom: 0; height: 44%; z-index: 1;
    background: repeating-linear-gradient(90deg,
      rgba(255,255,255,.07) 0 48px, rgba(0,0,0,.09) 48px 96px);
    background-repeat: repeat-x;
    -webkit-mask-image: linear-gradient(to top, #000 62%, transparent);
    mask-image: linear-gradient(to top, #000 62%, transparent);
  }
  /* 距離の標識 */
  .r-pole {
    position: absolute; bottom: 44%; z-index: 3; transform: translateX(-50%);
    font-family: 'Bebas Neue', sans-serif; font-size: 13px; color: #1a0e16;
    background: var(--gold); border-radius: 3px; padding: 1px 5px;
    box-shadow: 0 2px 0 rgba(0,0,0,.45);
  }
  /* ゴール板 */
  .r-goal {
    position: absolute; top: 4%; bottom: 0; width: 9px; z-index: 4;
    transform: translateX(-50%);
    background: repeating-linear-gradient(#fff 0 9px, #1a0e16 9px 18px);
    box-shadow: 0 0 16px rgba(255,255,255,.75);
  }

  /* 馬。同じ絵を色だけ変えて並べる */
  .r-h {
    position: absolute; z-index: 6; width: 70px; height: auto;
    transform: translate(-50%, 0);
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.55));
    will-change: transform;
  }
  .r-h.me { z-index: 8; width: 80px; }
  .r-h.run { animation: rBob .26s steps(2, end) infinite; }
  @keyframes rBob {
    0%   { margin-top: 0; }
    100% { margin-top: -5px; }
  }
  /* アフロの色ちがい。いちど sepia で色をそろえてから回すと、
     もとの絵が茶色でもはっきり別の色になる。黒いフチは黒のまま */
  .r-h.c1 { filter: drop-shadow(0 3px 7px rgba(0,0,0,.6)) sepia(1) saturate(4.5) hue-rotate(172deg); }
  .r-h.c2 { filter: drop-shadow(0 3px 7px rgba(0,0,0,.6)) sepia(1) saturate(5)   hue-rotate(312deg); }
  .r-h.c3 { filter: drop-shadow(0 3px 7px rgba(0,0,0,.6)) grayscale(1) brightness(1.25) contrast(1.15); }
  .r-h.me { filter: drop-shadow(0 3px 7px rgba(0,0,0,.6)) saturate(1.15); }

  /* 風よけに入っているしるし。入っていれば出て、押している間はよく光る */
  .r-draft {
    position: absolute; z-index: 9; transform: translate(-50%, -140%);
    font-size: 11px; font-weight: 900; white-space: nowrap;
    color: #052; background: var(--green); border-radius: 999px; padding: 2px 9px;
    opacity: .5; box-shadow: 0 0 8px rgba(18,209,122,.4);
    transition: opacity .12s;
  }
  .r-draft.on { opacity: 1; box-shadow: 0 0 16px rgba(18,209,122,.9); }

  /* スタミナ */
  .r-sta { padding: 9px 0 2px; }
  .r-sta-top {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; color: #a1959c; padding-bottom: 4px;
  }
  .r-sta-top b { font-family: 'Bebas Neue', sans-serif; font-size: 15px; color: var(--cyan); }
  .r-bar {
    height: 13px; border: 1px solid var(--grey2); border-radius: 999px;
    background: rgba(0,0,0,.45); overflow: hidden;
  }
  .r-bar i {
    display: block; height: 100%; width: 100%;
    background: linear-gradient(90deg, #12d17a, #8ce05a);
    transition: background .2s;
  }
  .r-bar.mid i { background: linear-gradient(90deg, #e8b53a, #f0d05a); }
  .r-bar.low i { background: linear-gradient(90deg, #e04a4a, #f07a5a); }
  .r-bar.out i { background: linear-gradient(90deg, #7a2a2a, #a03a3a); }

  /* 押しているあいだ画面のふちが光る */
  #stage.is-push { box-shadow: inset 0 0 0 2px var(--gold), 0 0 22px rgba(240,190,70,.35); }
  #stage.is-dead .r-turf { filter: saturate(.4); }

  /* 着順の出し方 */
  .r-fin { color: var(--gold); }
  .r-fin.lose { color: #cfc3c9; }
</style>

<script src="../js/afro-rank-config.js"></script>
<script src="../js/afro-sfx.js"></script>
<script src="../js/afro-score.js"></script>
<script src="../js/afro-ui.js"></script>
<script>
(function () {
  /* ============================================================
     直線400mの追い比べ。
     ・押している間だけ速くなる（スタミナが減る）
     ・離すと巡航に落ちて、スタミナが戻る
     ・前の馬の 2.5〜9.5m 後ろにいると、減りかたが 0.42 倍（風よけ）
     ・スタミナが尽きると大失速。28 まで戻るまで立て直せない
     ============================================================ */
  var DIST   = 400;      /* 距離（m） */
  var V_RUN  = 15.7;     /* 手を離しているときの上限（m/s） */
  var V_PUSH = 20.3;     /* 押しているときの上限 */
  var V_DEAD = 11.8;     /* スタミナ切れの上限 */
  var V0     = 14.6;     /* スタート時の脚 */
  var BURN   = 9.6;      /* 押しているときのスタミナの減り（毎秒） */
  var DRAFT  = 0.42;     /* 風よけに入っているときの倍率 */
  var HEAL   = 5.4;      /* 離しているときの戻り（毎秒） */
  var HEAL_D = 3.4;      /* 切れているときの戻り */
  var BACK   = 28;       /* ここまで戻れば、また押せる */
  var PPM    = 6.4;      /* 1m を何pxで描くか */
  var LANE   = ['5%', '15%', '26%', '38%'];    /* 下からの高さ。絵の芝の中に収まる */

  /* ライバル3頭。u は進んだ割合。脚色がそれぞれ違う */
  var RIVALS = [
    { nm: 'ブルマ',   cls: 'c1', lane: 0, x0:  12,
      v: function (u) { return 19.0 - 5.4 * u * u; } },          /* 逃げ。最後バテる */
    { nm: 'チャフワ', cls: 'c2', lane: 1, x0:   4,
      v: function (u) { return 17.6 - 1.1 * u; } },              /* 先行。ずっと同じ脚 */
    { nm: 'ギンマ',   cls: 'c3', lane: 3, x0:  -7,
      v: function (u) { return 16.2 + 4.5 * u * u; } }           /* 差し。最後だけ伸びる */
  ];

  var stage  = document.getElementById('stage');
  var turf   = document.getElementById('turf');
  var cue    = document.getElementById('cue');
  var cueBig = document.getElementById('cueBig');
  var cueSub = document.getElementById('cueSub');
  var leftEl = document.getElementById('hLeft');
  var posEl  = document.getElementById('hPos');
  var timeEl = document.getElementById('hTime');
  var staTxt = document.getElementById('staTxt');
  var staBar = document.getElementById('staBar');
  var staFill= document.getElementById('staFill');

  var HORSE = '../images/game/run_afuwa.webp';
  (function () { var i = new Image(); i.src = HORSE; })();

  var me, foes, els, poles = [], goalEl = null, draftEl = null;
  var push = false, state = 'idle', t0 = 0, last = 0, raf = null, cd = 0;

  function screen(id) {
    var all = document.querySelectorAll('.ascreen');
    for (var i = 0; i < all.length; i++) all[i].classList.toggle('active', all[i].id === id);
  }

  AfroScore.setup({
    game: 'race',
    title: 'アフロ追い比べ',
    hash: 'アフロ追い比べ',
    lower: true,
    format: function (v) { return (v / 100).toFixed(2) + '秒'; },
    grades: [
      { v: 2100, name: 'レコード勝ち' },
      { v: 2180, name: 'GI級の決め手' },
      { v: 2280, name: 'オープン級' },
      { v: 2400, name: '3勝クラス' },
      { v: 2560, name: '1勝クラス' },
      { v: Infinity, name: '新馬' }
    ],
    onRetry: go
  });

  /* ---------- 馬と標識を作る ---------- */
  function build() {
    stage.querySelectorAll('.r-h, .r-pole, .r-goal, .r-draft').forEach(function (n) { n.remove(); });
    els = []; poles = [];

    me = { x: 0, v: V0, sta: 100, dead: false, fin: 0, lane: 2 };
    foes = RIVALS.map(function (r) {
      return { r: r, x: r.x0, v: r.v(0), fin: 0, k: 0.985 + Math.random() * 0.03 };
    });

    /* ライバル */
    foes.forEach(function (f) {
      var img = document.createElement('img');
      img.className = 'r-h ' + f.r.cls;
      img.src = HORSE; img.alt = '';
      img.style.bottom = LANE[f.r.lane];
      stage.appendChild(img);
      els.push({ el: img, o: f });
    });
    /* 自分 */
    var mine = document.createElement('img');
    mine.className = 'r-h me';
    mine.src = HORSE; mine.alt = 'あなたのアフロ馬';
    mine.style.bottom = LANE[me.lane];
    stage.appendChild(mine);
    els.push({ el: mine, o: me, mine: true });

    /* 風よけのしるし */
    draftEl = document.createElement('div');
    draftEl.className = 'r-draft';
    draftEl.textContent = '風よけ';
    draftEl.hidden = true;
    draftEl.style.bottom = 'calc(' + LANE[me.lane] + ' + 74px)';
    stage.appendChild(draftEl);

    /* 100mごとの標識 */
    for (var m = 100; m < DIST; m += 100) {
      var p = document.createElement('div');
      p.className = 'r-pole';
      p.textContent = (DIST - m) + 'm';
      stage.appendChild(p);
      poles.push({ el: p, m: m });
    }
    /* ゴール板 */
    goalEl = document.createElement('div');
    goalEl.className = 'r-goal';
    stage.appendChild(goalEl);
  }

  /* ---------- 画面に写す ---------- */
  function draw() {
    var w = stage.clientWidth;
    var cam = me.x - (w * 0.34) / PPM;         /* 自分は左から34%あたりに置く */

    for (var i = 0; i < els.length; i++) {
      var e = els[i];
      var px = (e.o.x - cam) * PPM;
      var hw = (e.el.offsetWidth || 70) / 2;
      e.el.style.transform = 'translate(' + (px - hw) + 'px, 0)';
      var moving = state === 'run' && (e.mine ? true : !e.o.fin);
      e.el.classList.toggle('run', moving);
    }
    for (var j = 0; j < poles.length; j++) {
      poles[j].el.style.left = ((poles[j].m - cam) * PPM) + 'px';
    }
    goalEl.style.left = ((DIST - cam) * PPM) + 'px';

    /* 芝とラチを流す */
    turf.style.backgroundPosition = (-(me.x * PPM) % 96) + 'px 0';

    draftEl.style.left = ((me.x - cam) * PPM) + 'px';
  }

  function paintHud() {
    var left = Math.max(0, DIST - me.x);
    leftEl.textContent = Math.ceil(left) + 'm';

    var ahead = 0;
    for (var i = 0; i < foes.length; i++) if (foes[i].x > me.x) ahead++;
    posEl.textContent = (ahead + 1) + '/4';

    var s = Math.max(0, Math.round(me.sta));
    staTxt.textContent = s;
    staFill.style.width = s + '%';
    staBar.className = 'r-bar' + (me.dead ? ' out' : s < 20 ? ' low' : s < 45 ? ' mid' : '');
  }

  /* 風よけに入っているか。2.5〜9.5m 前に誰かいればOK */
  function drafting() {
    for (var i = 0; i < foes.length; i++) {
      var d = foes[i].x - me.x;
      if (d > 2.5 && d < 9.5) return true;
    }
    return false;
  }

  /* ---------- 1フレーム ---------- */
  function step(now) {
    raf = requestAnimationFrame(step);
    var dt = Math.min(0.05, (now - last) / 1000);     /* 裏に回って戻ったとき飛ばない */
    last = now;
    if (dt <= 0) return;

    if (state === 'count') {
      cd -= dt;
      var n = Math.ceil(cd);
      if (n > 0) {
        if (cueBig.textContent !== String(n)) { cueBig.textContent = String(n); Sfx.tap(); }
      } else {
        cue.hidden = true;
        state = 'run';
        t0 = now;
        Sfx.start();
      }
      draw();
      return;
    }

    if (state !== 'run') { draw(); return; }

    var el = (now - t0) / 1000;
    timeEl.textContent = el.toFixed(2);

    /* --- 自分 --- */
    if (!me.fin) {
      var dr = drafting();
      draftEl.hidden = !dr;
      draftEl.classList.toggle('on', dr && push && !me.dead);

      var cap;
      if (me.dead) {
        cap = V_DEAD;
        me.sta += HEAL_D * dt;
        if (me.sta >= BACK) me.dead = false;
      } else if (push) {
        cap = V_PUSH;
        me.sta -= BURN * (dr ? DRAFT : 1) * dt;
        if (me.sta <= 0) {
          me.sta = 0; me.dead = true;
          Sfx.bad();
          stage.classList.remove('ashake'); void stage.offsetWidth; stage.classList.add('ashake');
        }
      } else {
        cap = V_RUN;
        me.sta = Math.min(100, me.sta + HEAL * dt);
      }
      me.v += (cap - me.v) * (push && !me.dead ? 2.6 : 1.9) * dt;
      me.x += me.v * dt;
      if (me.x >= DIST) { me.x = DIST; me.fin = el; }
    }

    /* --- ライバル --- */
    for (var i = 0; i < foes.length; i++) {
      var f = foes[i];
      if (f.fin) continue;
      var u = Math.min(1, f.x / DIST);
      f.v = f.r.v(u) * f.k;
      f.x += f.v * dt;
      if (f.x >= DIST) { f.x = DIST; f.fin = el; }
    }

    stage.classList.toggle('is-push', push && !me.dead && !me.fin);
    stage.classList.toggle('is-dead', me.dead);

    draw();
    paintHud();

    /* 自分がゴールして、少し見せてから結果へ */
    if (me.fin && el > me.fin + 1.1) finish();
  }

  /* ---------- 着差のことば ---------- */
  function sa(d) {
    if (d < 0.05) return 'ハナ';
    if (d < 0.18) return 'アタマ';
    if (d < 0.40) return 'クビ';
    if (d < 1.2)  return '1/2馬身';
    if (d < 2.0)  return '3/4馬身';
    var b = d / 2.4;
    if (b >= 10) return '大差';
    return (Math.round(b * 2) / 2) + '馬身';
  }

  function finish() {
    if (state === 'over') return;
    state = 'over';
    cancelAnimationFrame(raf);
    stage.classList.remove('is-push');

    /* まだ走っている馬は、そのままの脚で何秒かかるか計算して順位を出す */
    var all = [{ nm: 'あなた', t: me.fin, x: DIST, mine: true }];
    for (var i = 0; i < foes.length; i++) {
      var f = foes[i];
      var t = f.fin;
      if (!t) {
        var rest = DIST - f.x;
        t = me.fin + rest / Math.max(6, f.v);     /* 残りを今の脚で割る */
      }
      all.push({ nm: f.r.nm, t: t, x: f.x });
    }
    all.sort(function (a, b) { return a.t - b.t; });

    var rank = 0;
    for (var j = 0; j < all.length; j++) if (all[j].mine) rank = j + 1;

    /* 1着なら2着との差、負けなら1着との差 */
    var other = rank === 1 ? all[1] : all[0];
    var gap = Math.abs((other.t - me.fin)) * 17;   /* 秒差をおおよその馬身差に */
    var word = rank === 1
      ? sa(gap) + '差で1着'
      : rank + '着（1着と ' + sa(gap) + '）';

    cue.hidden = false;
    cueBig.className = 'acue-big r-fin' + (rank === 1 ? '' : ' lose');
    cueBig.textContent = word;
    cueSub.textContent = me.fin.toFixed(2) + '秒';
    if (rank === 1) Sfx.good(); else Sfx.tap();

    setTimeout(function () {
      AfroScore.finish(Math.round(me.fin * 100));
    }, 1100);
  }

  /* ---------- 操作 ---------- */
  function hold(on) {
    if (state !== 'run' || me.fin) { push = false; return; }
    push = on;
  }
  stage.addEventListener('pointerdown', function (e) { e.preventDefault(); hold(true); });
  window.addEventListener('pointerup',     function () { hold(false); });
  window.addEventListener('pointercancel', function () { hold(false); });
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); hold(true); }
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'Space') { e.preventDefault(); hold(false); }
  });
  window.addEventListener('blur', function () { push = false; });
  window.addEventListener('resize', function () { if (els) draw(); });

  function go() {
    cancelAnimationFrame(raf);
    build();
    push = false;
    state = 'count';
    cd = 2.4;
    cue.hidden = false;
    cueBig.className = 'acue-big';
    cueBig.textContent = '3';
    cueSub.textContent = '押しているあいだ、追う';
    timeEl.textContent = '0.00';
    stage.className = 'astage';
    paintHud();
    draw();
    screen('scPlay');
    Sfx.bgm('race');
    last = performance.now();
    raf = requestAnimationFrame(step);
  }

  document.getElementById('startBtn').addEventListener('click', function () { Sfx.unlock(); go(); });

  var snd = document.getElementById('sndBtn');
  function paintSnd() {
    snd.classList.toggle('on', Sfx.enabled());
    snd.textContent = Sfx.enabled() ? 'SOUND' : 'MUTED';
  }
  snd.addEventListener('click', function () { Sfx.toggle(); paintSnd(); });
  paintSnd();
})();
</script>
</body>
</html>
