<style>
  /* タイトル画面の背景。絵の明るさ 50/255 なので薄膜は .32 */
  #scTitle { --bgt: url(../images/bgt/memory.webp); --veil: .32; }

  /* ---- アフロ記憶 ---- */
  #scPlay { padding-bottom: 6px; }
  #scPlay .ain.grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  #stage { display: flex; flex-direction: column; justify-content: center; padding: 14px 10px; }

  .m-state {
    text-align: center; font-family: 'Dela Gothic One', sans-serif;
    font-size: 19px; min-height: 28px; color: #cfc3c9;
    text-shadow: 0 0 14px currentColor;
  }
  .m-state.watch { color: var(--cyan); }
  .m-state.go { color: var(--green); }
  .m-state.ok { color: var(--gold); }
  .m-state.ng { color: var(--red); }

  /* 段数が増えても1行に収める。はみ出させない */
  .m-seq {
    display: flex; justify-content: center; align-items: center;
    gap: var(--dg, 5px); min-height: 14px; margin: 9px 0 14px;
    flex-wrap: nowrap; overflow: hidden;
  }
  .m-dot {
    flex: none; width: var(--ds, 9px); height: var(--ds, 9px);
    border-radius: 50%; background: var(--grey2);
    transition: background .12s, transform .12s, box-shadow .12s;
  }
  .m-dot.on { background: var(--gold); transform: scale(1.3); box-shadow: 0 0 10px var(--gold); }
  /* 点で表せない段数になったら数字に切り替える */
  .m-seq.count {
    font-family: 'Bebas Neue', sans-serif; font-size: 19px; color: var(--gold);
    text-shadow: 0 0 10px var(--gold); letter-spacing: 1px;
  }
  .m-seq.count b { color: var(--white); text-shadow: none; }

  /* 持ち時間。5秒さわらないとタイムオーバー */
  .m-clock {
    max-width: 220px; height: 4px; margin: 0 auto 11px;
    background: var(--grey2); border-radius: 2px; overflow: hidden;
    opacity: 0; transition: opacity .15s;
  }
  .m-clock.on { opacity: 1; }
  .m-clock i {
    display: block; height: 100%; width: 100%;
    background: var(--green); transform-origin: left center;
  }
  .m-clock.run i { animation: mClock 5s linear forwards; }
  @keyframes mClock {
    0%   { transform: scaleX(1); background: var(--green); }
    60%  { background: var(--gold); }
    100% { transform: scaleX(0); background: var(--red); }
  }

  .m-pad { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .m-key {
    width: 96px; padding: 7px 5px 6px; cursor: pointer;
    background: rgba(255, 255, 255, .05);
    border: 2px solid var(--grey2); border-radius: 14px;
    transition: transform .1s, box-shadow .14s, border-color .14s, background .14s;
  }
  .m-key img { display: block; width: 100%; height: auto; filter: grayscale(.45) brightness(.72); transition: filter .14s; }
  .m-key span {
    display: block; text-align: center; margin-top: 3px;
    font-family: 'Dela Gothic One', sans-serif; font-size: 10.5px; color: #8d8288;
  }
  .m-key.lit {
    transform: translateY(-4px) scale(1.05);
    border-color: var(--gold); background: rgba(255, 214, 10, .16);
    box-shadow: 0 0 26px rgba(255, 214, 10, .55);
  }
  .m-key.lit img { filter: none; }
  .m-key.lit span { color: var(--gold); }
  .m-key.bad {
    border-color: var(--red); background: rgba(255, 8, 68, .18);
    box-shadow: 0 0 26px rgba(255, 8, 68, .6);
  }
  .m-key.bad img { filter: none; }

  @media (max-width: 360px) { .m-key { width: 86px; } }
  @media (max-height: 700px) { .m-key { width: 84px; } }
</style>
</head>
<body>

<div class="abg"></div>

<nav class="anav">
  <a class="anav-logo" href="../game.html">AFRO<em>Horse</em></a>
  <div class="anav-r">
    <button class="anav-btn" type="button" id="sndBtn">SOUND</button>
    <a class="anav-btn" href="../game.html">EXIT</a>
  </div>
</nav>

<!-- ===== タイトル ===== -->
<section class="ascreen active" id="scTitle">
  <div class="at-eye">MEMORY</div>
  <h1 class="at-logo"><img src="../images/icon/memory.webp" alt="アフロ記憶"></h1>
  <p class="at-sub">光った順に、タップ</p>
  <div class="at-best">自己ベスト <b id="gBest">—</b></div>
  <button class="abtn" type="button" id="startBtn">スタート</button>
  <ul class="at-how">
    <li>アフロ馬が順番に光ります</li>
    <li>「どうぞ」が出たら同じ順にタップ</li>
    <li>正解すると1つ増えます</li>
    <li>5秒さわらないとタイムオーバー</li>
    <li>間違えたら終わり。クリアした段数が記録</li>
  </ul>
</section>

<!-- ===== プレイ ===== -->
<section class="ascreen" id="scPlay">
  <div class="ain">
    <div class="ahud">
      <div class="ahud-cell"><span class="ahud-lbl">LEVEL</span><span class="ahud-val" id="hLv">1</span></div>
      <div class="ahud-cell"><span class="ahud-lbl">CLEAR</span><span class="ahud-val" id="hClear">0</span></div>
      <div class="ahud-cell"><span class="ahud-lbl">BEST</span><span class="ahud-val gold" id="hBest">—</span></div>
    </div>
  </div>
  <div class="ain grow">
    <div class="astage" id="stage">
      <div class="m-state" id="state">おぼえて</div>
      <div class="m-seq" id="seq"></div>
      <div class="m-clock" id="clock"><i></i></div>
      <div class="m-pad" id="pad">
        <button class="m-key" type="button"><img src="../images/face/afuwa.webp" alt="アフワ"><span>アフワ</span></button>
        <button class="m-key" type="button"><img src="../images/face/buruma.webp" alt="ブルマ"><span>ブルマ</span></button>
        <button class="m-key" type="button"><img src="../images/face/chafuwa.webp" alt="チャフワ"><span>チャフワ</span></button>
        <button class="m-key" type="button"><img src="../images/face/kurofuwa.webp" alt="クロフワ"><span>クロフワ</span></button>
        <button class="m-key" type="button"><img src="../images/face/ginma.webp" alt="ギンマ"><span>ギンマ</span></button>
      </div>
    </div>
    <p class="astage-note">光った馬を、同じ順番で</p>
  </div>
</section>

<div id="gResult"></div>

<script src="../js/afro-rank-config.js"></script>
<script src="../js/afro-sfx.js"></script>
<script src="../js/afro-score.js"></script>
<script>
(function () {
  /* キーごとの音（高さを変えて、音でも覚えられるように） */
  var NOTE = [392, 494, 587, 698, 880];

  var pad     = document.getElementById('pad');
  var keys    = Array.prototype.slice.call(pad.querySelectorAll('.m-key'));
  var stateEl = document.getElementById('state');
  var seqEl   = document.getElementById('seq');
  var lvEl    = document.getElementById('hLv');
  var clEl    = document.getElementById('hClear');
  var bestEl  = document.getElementById('hBest');
  var clockEl = document.getElementById('clock');

  var LIMIT_MS = 5000;     /* これだけさわらないとタイムオーバー */

  var seq = [], input = 0, level = 1, playing = false, showing = false, dead = false;
  var clock = null;

  function screen(id) {
    var all = document.querySelectorAll('.ascreen');
    for (var i = 0; i < all.length; i++) all[i].classList.toggle('active', all[i].id === id);
  }

  AfroScore.setup({
    game: 'memory',
    title: 'アフロ記憶',
    hash: 'アフロ記憶',
    unit: '段',
    lower: false,
    grades: [
      { v: 12, name: 'G1級の記憶' },
      { v: 9,  name: 'オープン級' },
      { v: 7,  name: '3勝クラス' },
      { v: 5,  name: '2勝クラス' },
      { v: 3,  name: '1勝クラス' },
      { v: 0,  name: '新馬' }
    ],
    onRetry: go
  });

  bestEl.textContent = document.getElementById('gBest').textContent;

  /* 持ち時間を数えはじめる（押すたびに呼んで振り出しに戻す） */
  function startClock() {
    stopClock();
    clockEl.classList.add('on');
    clockEl.classList.remove('run');
    void clockEl.offsetWidth;            /* アニメーションを頭から流し直す */
    clockEl.classList.add('run');
    clock = setTimeout(timeOver, LIMIT_MS);
  }

  function stopClock() {
    clearTimeout(clock);
    clock = null;
    clockEl.classList.remove('on', 'run');
  }

  function timeOver() {
    if (!playing || showing || dead) return;
    var cleared = seq.length - 1;
    playing = false; dead = true;
    stopClock();
    say('タイムオーバー', 'ng');
    Sfx.bad();
    setTimeout(function () {
      AfroScore.finish(cleared);
      bestEl.textContent = document.getElementById('gBest').textContent;
    }, 800);
  }

  function say(txt, cls) {
    stateEl.textContent = txt;
    stateEl.className = 'm-state' + (cls ? ' ' + cls : '');
  }

  var DOT_LIMIT = 24;      /* これを超えたら点をやめて数字にする */

  function paintSeq(at) {
    var n = seq.length;

    if (n > DOT_LIMIT) {
      seqEl.className = 'm-seq count';
      seqEl.innerHTML = (at == null ? 0 : at + 1) + ' <b>/</b> ' + n;
      return;
    }

    /* 入る大きさを大きい方から探す（隙間も含めて必ず収める） */
    var w = (seqEl.clientWidth || 300) - 6;
    var size = 4, gap = 2;
    for (var s = 9; s >= 4; s--) {
      var g = Math.max(2, s - 4);
      if (n * s + (n - 1) * g <= w) { size = s; gap = g; break; }
    }
    seqEl.className = 'm-seq';
    seqEl.style.setProperty('--ds', size + 'px');
    seqEl.style.setProperty('--dg', gap + 'px');

    var html = '';
    for (var i = 0; i < n; i++) {
      html += '<span class="m-dot' + (at != null && i <= at ? ' on' : '') + '"></span>';
    }
    seqEl.innerHTML = html;
  }

  function lit(i, ms) {
    keys[i].classList.add('lit');
    if (window.Sfx) Sfx.note ? Sfx.note(NOTE[i]) : Sfx.tap();
    setTimeout(function () { keys[i].classList.remove('lit'); }, ms);
  }

  function onMs()  { return Math.max(320, 620 - level * 22); }
  function gapMs() { return Math.max(140, 260 - level * 10); }

  function show() {
    showing = true;
    stopClock();
    say('おぼえて', 'watch');
    var i = 0, on = onMs(), gap = gapMs();
    paintSeq(-1);
    (function step() {
      if (i >= seq.length) {
        setTimeout(function () {
          showing = false;
          say('どうぞ', 'go');
          paintSeq(-1);
          startClock();
        }, 280);
        return;
      }
      lit(seq[i], on);
      paintSeq(i);
      i++;
      setTimeout(step, on + gap);
    })();
  }

  function nextLevel() {
    seq.push(Math.floor(Math.random() * keys.length));
    level = seq.length;
    lvEl.textContent = level;
    show();
  }

  function fail(i) {
    var cleared = seq.length - 1;
    playing = false; dead = true;
    stopClock();
    keys[i].classList.add('bad');
    say('ちがう！', 'ng');
    Sfx.bad();
    setTimeout(function () {
      keys[i].classList.remove('bad');
      AfroScore.finish(cleared);
      bestEl.textContent = document.getElementById('gBest').textContent;
    }, 750);
  }

  function press(i) {
    if (dead || !playing || showing) return;

    lit(i, 190);
    if (seq[input] !== i) { fail(i); return; }

    input++;
    paintSeq(input - 1);
    startClock();                        /* 1つ押すごとに持ち時間は振り出しへ */

    if (input >= seq.length) {
      clEl.textContent = seq.length;
      input = 0;
      stopClock();
      say('せいかい！', 'ok');
      Sfx.up();
      setTimeout(nextLevel, 650);
    }
  }

  function go() {
    screen('scPlay');
    stopClock();
    seq = []; input = 0; level = 0;
    playing = true; showing = false; dead = false;
    clEl.textContent = '0';
    seqEl.innerHTML = '';
    say('よく見て', 'watch');
    setTimeout(nextLevel, 700);
  }

  keys.forEach(function (k, i) {
    var viaPointer = false;
    k.addEventListener('pointerdown', function (e) { e.preventDefault(); viaPointer = true; press(i); });
    k.addEventListener('click', function () {
      if (viaPointer) { viaPointer = false; return; }
      press(i);
    });
  });

  document.getElementById('startBtn').addEventListener('click', function () { Sfx.unlock(); go(); });

  var snd = document.getElementById('sndBtn');
  function paintSnd() {
    snd.classList.toggle('on', Sfx.enabled());
    snd.textContent = Sfx.enabled() ? 'SOUND' : 'MUTED';
  }
  snd.addEventListener('click', function () { Sfx.toggle(); paintSnd(); });
  paintSnd();
})();
</script>
</body>
</html>
