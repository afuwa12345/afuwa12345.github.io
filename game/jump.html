<style>
  /* タイトル画面の背景。絵の明るさ 111/255 なので薄膜は .52 */
  #scTitle { --bgt: url(../images/bgt/jump.webp); --veil: .52; }

  /* ---- アフロジャンプ ---- */
  #scPlay { padding-bottom: 6px; }
  #scPlay .ain.grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* 空はCSSで描く。下端の色を、流れる帯の最上の色（#7460BA）に合わせてつなぐ */
  #stage {
    cursor: pointer;
    --sveil: 0;
    background-color: #1a1230;
    background-image: linear-gradient(180deg,
      #140f2a 0%, #241a44 32%, #3d2a63 58%, #5a4290 80%, #7460BA 100%);
  }
  /* 絵に景色が入ったので、CSSで描いていた丘は消す */
  .j-hills { display: none; }

  /* 流れる遠景。900x302 の帯（左右がつながっている絵）を横に繰り返す。
     上のCSSの空へなじませるため、上端だけぼかして消す */
  .j-far {
    position: absolute; left: 0; right: 0; bottom: 56px; height: 46%;
    background-image: url(../images/bg/jump.webp);
    background-repeat: repeat-x;
    background-size: auto 100%;
    background-position: 0 bottom;
    filter: brightness(.86) saturate(.95);
    mask-image: linear-gradient(transparent 0%, #000 22%);
    -webkit-mask-image: linear-gradient(transparent 0%, #000 22%);
  }

  /* 遠景 */
  .j-sky {
    position: absolute; left: 0; right: 0; top: 0; bottom: 0;
    background:
      radial-gradient(60% 40% at 78% 24%, rgba(255, 43, 214, .16) 0, transparent 70%),
      radial-gradient(50% 36% at 22% 18%, rgba(0, 240, 255, .12) 0, transparent 70%);
  }
  .j-hills {
    position: absolute; left: 0; right: 0; bottom: 74px; height: 62px;
    background:
      radial-gradient(52px 30px at 14% 100%, #16362a 0 99%, transparent 100%),
      radial-gradient(74px 40px at 44% 100%, #123024 0 99%, transparent 100%),
      radial-gradient(60px 32px at 78% 100%, #16362a 0 99%, transparent 100%);
    opacity: .9;
  }

  /* 地面 */
  /* 絵の芝から地面へ、上をぼかしてつなぐ。継ぎ目を出さない */
  .j-ground {
    position: absolute; left: 0; right: 0; bottom: 0; height: 74px;
    background: linear-gradient(rgba(10, 48, 33, 0) 0%, rgba(9, 44, 30, .55) 28%,
                                rgba(7, 36, 24, .88) 60%, rgba(5, 26, 17, .96) 100%);
    border-top: 1px solid rgba(0, 240, 255, .16);
  }
  /* 走っている感じを出すための流れる線。芝の上なので薄く */
  .j-lines {
    position: absolute; left: 0; right: 0; bottom: 0; height: 52px;
    background-image: repeating-linear-gradient(90deg,
      rgba(255, 255, 255, .09) 0 26px, transparent 26px 92px);
    background-size: 92px 100%;
    mask-image: linear-gradient(transparent, #000 60%);
    -webkit-mask-image: linear-gradient(transparent, #000 60%);
  }

  /* 馬 */
  .j-horse {
    position: absolute; left: 34px; bottom: 74px; height: 92px; width: auto;
    z-index: 3; transform-origin: 50% 100%;
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .6));
  }
  .j-horse.crash { height: 84px; }

  /* 生垣 */
  .j-obs {
    position: absolute; bottom: 74px; z-index: 2; height: auto;
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .55));
  }

  /* 距離 */
  .j-dist {
    position: absolute; right: 10px; top: 8px; z-index: 6;
    font-family: 'Bebas Neue', sans-serif; font-size: 34px; line-height: 1;
    color: var(--gold); text-shadow: 0 0 14px var(--gold);
  }
  .j-dist small { font-size: 15px; margin-left: 2px; }

  #cue { z-index: 30; }
  #cue .acue-big { font-size: 70px; color: var(--gold); }
</style>
</head>
<body>

<div class="abg"></div>

<nav class="anav">
  <a class="anav-logo" href="../game.html">AFRO<em>Horse</em></a>
  <div class="anav-r">
    <button class="anav-btn" type="button" id="sndBtn">SOUND</button>
    <a class="anav-btn" href="../game.html">EXIT</a>
  </div>
</nav>

<!-- ===== タイトル ===== -->
<section class="ascreen active" id="scTitle">
  <div class="at-eye">JUMP</div>
  <h1 class="at-logo"><img src="../images/icon/jump.webp" alt="アフロジャンプ"></h1>
  <p class="at-sub">タップで跳んで、生垣を越えろ</p>
  <div class="at-best">自己ベスト <b id="gBest">—</b></div>
  <button class="abtn" type="button" id="startBtn">スタート</button>
  <button class="abtn ghost" type="button" id="howBtn">説明</button>
</section>

<!-- ===== 説明 ===== -->
<div class="ahow" id="howPop" hidden>
  <div class="ahow-card">
    <div class="ahow-t">あそびかた</div>
    <ul class="at-how">
    <li>画面をタップするとジャンプ</li>
    <li>生垣にぶつかったら終わり</li>
    <li>2本続きは1回のジャンプでまとめて跳ぶ</li>
    <li>走るほど速くなる。走った距離が記録</li>
    </ul>
    <button class="gr-btn primary" type="button" id="howClose">とじる</button>
  </div>
</div>

<!-- ===== プレイ ===== -->
<section class="ascreen" id="scPlay">
  <div class="ain">
    <div class="ahud">
      <div class="ahud-cell"><span class="ahud-lbl">SPEED</span><span class="ahud-val" id="hSpeed">0</span></div>
      <div class="ahud-cell"><span class="ahud-lbl">JUMP</span><span class="ahud-val" id="hJump">0</span></div>
      <div class="ahud-cell"><span class="ahud-lbl">BEST</span><span class="ahud-val gold" id="hBest">—</span></div>
    </div>
  </div>
  <div class="ain grow">
    <div class="astage" id="stage">
      <div class="j-sky"></div>
      <div class="j-hills"></div>
      <div class="j-far" id="far"></div>
      <div class="j-ground"></div>
      <div class="j-lines" id="lines"></div>
      <img class="j-horse" id="horse" src="../images/game/run_afuwa.webp" alt="">
      <div class="j-dist"><span id="dist">0</span><small>m</small></div>
      <div class="acue" id="cue" hidden><div class="acue-big" id="cueBig">3</div></div>
    </div>
    <p class="astage-note">画面のどこでもタップできます</p>
  </div>
</section>

<div id="gResult"></div>

<script src="../js/afro-rank-config.js"></script>
<script src="../js/afro-sfx.js"></script>
<script src="../js/afro-score.js"></script>
<script src="../js/afro-ui.js"></script>
<script>
(function () {
  var GROUND   = 74;      /* 地面の高さ(px) */
  var GRAV     = 2400;    /* 重力(px/s^2) */
  var JUMP_V   = 1020;    /* 跳ぶ勢い(px/s)。頂点217px・滞空0.85秒 */
  var SPD0     = 340;     /* 初速(px/s) */
  var SPD_MAX  = 720;
  var SPD_UP   = 9;       /* 1秒あたりの加速 */
  var PAIR_FROM = 470;    /* この速度から「2本続き」が出はじめる */
  var PX_PER_M = 26;      /* 何pxで1m扱いにするか */

  var stage  = document.getElementById('stage');
  var horse  = document.getElementById('horse');
  var lines  = document.getElementById('lines');
  var far    = document.getElementById('far');
  var distEl = document.getElementById('dist');
  var cue    = document.getElementById('cue');
  var cueBig = document.getElementById('cueBig');
  var hSpeed = document.getElementById('hSpeed');
  var hJump  = document.getElementById('hJump');
  var hBest  = document.getElementById('hBest');

  var HORSE_W = 78, HORSE_H = 92;   /* 見た目の当たり判定 */
  /* h は画像の縦横比から出した実際の高さ。当たり判定と絵をずらさない
     hurdle_low  360x104 → 104/360 = 0.289
     hurdle_high 360x112 → 112/360 = 0.311 */
  var OBS = [
    { src: '../images/game/hurdle_low.webp',  w: 104, h: Math.round(104 * 104 / 360) },
    { src: '../images/game/hurdle_high.webp', w: 132, h: Math.round(132 * 112 / 360) }
  ];

  /* 使う絵を先に読ませる。走り出してから読むと、生垣が途中から急に現れる */
  var ART = [
    '../images/game/run_afuwa.webp',
    '../images/game/jump_afuwa.webp',
    '../images/game/crash_afuwa.webp',
    '../images/game/hurdle_low.webp',
    '../images/game/hurdle_high.webp'
  ];
  var artReady = 0;
  (function preload() {
    for (var i = 0; i < ART.length; i++) {
      var im = new Image();
      im.onload = im.onerror = function () { artReady++; };
      im.src = ART[i];
    }
  })();

  var playing = false, y = 0, vy = 0, onGround = true;
  var speed = SPD0, px = 0, jumps = 0, shift = 0;
  var obs = [], nextGap = 0, raf = null, last = 0;
  var farShift = 0, farTile = 626;   /* 帯1枚の表示幅。go() で測り直す */

  function screen(id) {
    var all = document.querySelectorAll('.ascreen');
    for (var i = 0; i < all.length; i++) all[i].classList.toggle('active', all[i].id === id);
  }

  AfroScore.setup({
    game: 'jump',
    title: 'アフロジャンプ',
    hash: 'アフロジャンプ',
    unit: 'm',
    lower: false,
    grades: [
      { v: 1200, name: 'G1級の飛び' },
      { v: 800,  name: 'オープン級' },
      { v: 550,  name: '3勝クラス' },
      { v: 350,  name: '2勝クラス' },
      { v: 180,  name: '1勝クラス' },
      { v: 0,    name: '新馬' }
    ],
    onRetry: go
  });
  hBest.textContent = document.getElementById('gBest').textContent;

  function meters() { return Math.floor(px / PX_PER_M); }

  function clearObs() {
    for (var i = 0; i < obs.length; i++) obs[i].el.remove();
    obs = [];
  }

  function place(kind, x) {
    var el = document.createElement('img');
    el.className = 'j-obs';
    el.src = kind.src;
    /* 高さも指定する。画像が届く前から箱があるので途中で急に現れない。
       当たり判定の h と描画がぴったり一致する */
    el.style.width  = kind.w + 'px';
    el.style.height = kind.h + 'px';
    el.style.left = x + 'px';
    /* 絵が届くまでは緑の板を敷いておく。届いたら外す */
    el.style.background = 'linear-gradient(#2f7a36, #1b4a22)';
    el.style.borderRadius = '4px';
    el.onload = function () { el.style.background = 'none'; };
    stage.appendChild(el);
    obs.push({ el: el, x: x, w: kind.w, h: kind.h });
  }

  /* 2本続きが出る確率。速くなるほど増える */
  function pairChance() {
    if (speed < PAIR_FROM) return 0;
    return Math.min(0.45, (speed - PAIR_FROM) / 620);
  }

  function addObs() {
    var x0 = stage.clientWidth;
    var pair = Math.random() < pairChance();

    /* 2本続きの1本目は必ず低い方。高い方が先だと跳びきれない */
    var first = pair ? OBS[0] : OBS[Math.random() < 0.34 ? 1 : 0];
    place(first, x0);

    /* 着地してから次が来る最低限だけ空ける。速いほどギリギリになる */
    nextGap = 165 + Math.random() * 140 + speed * 0.56;

    if (pair) {
      /* 内側の隙間は着地できない狭さ。1回のジャンプで2本まとめて跳ぶしかない */
      var inner  = 24 + Math.random() * 14;   /* 馬の幅78pxより狭い＝着地できない */
      var second = (speed >= 600 && Math.random() < 0.35) ? OBS[1] : OBS[0];
      place(second, x0 + first.w + inner);
      nextGap += 80;          /* 2本続きのあとは少し余裕をあげる */
    }
  }

  function jump() {
    if (!playing || !onGround) return;
    vy = JUMP_V;
    onGround = false;
    jumps++;
    hJump.textContent = jumps;
    horse.src = '../images/game/jump_afuwa.webp';
    Sfx.tap();
  }

  function crash() {
    playing = false;
    cancelAnimationFrame(raf);
    horse.src = '../images/game/crash_afuwa.webp';
    horse.classList.add('crash');
    horse.style.transform = 'translateY(6px)';
    lines.style.animation = 'none';
    stage.classList.remove('ashake'); void stage.offsetWidth; stage.classList.add('ashake');
    Sfx.bad();
    setTimeout(function () {
      AfroScore.finish(meters());
      hBest.textContent = document.getElementById('gBest').textContent;
    }, 700);
  }

  function step(t) {
    if (!playing) return;
    var dt = Math.min(0.045, (t - last) / 1000);
    last = t;

    /* 走る */
    speed = Math.min(SPD_MAX, speed + SPD_UP * dt);
    px += speed * dt;
    distEl.textContent = meters();
    hSpeed.textContent = Math.round(speed / 10);

    /* 地面のスクロール */
    shift = (shift + speed * dt) % 92;
    lines.style.backgroundPosition = (-shift) + 'px 0';

    /* 遠景はゆっくり流す（奥のものは遅く動いて見える） */
    farShift = (farShift + speed * 0.38 * dt) % farTile;
    far.style.backgroundPositionX = (-farShift) + 'px';

    /* 跳ぶ */
    if (!onGround) {
      vy -= GRAV * dt;
      y += vy * dt;
      if (y <= 0) {
        y = 0; vy = 0; onGround = true;
        horse.src = '../images/game/run_afuwa.webp';
      }
      horse.style.transform = 'translateY(' + (-y) + 'px)';
    }

    /* 生垣を流す */
    nextGap -= speed * dt;
    if (nextGap <= 0) addObs();

    for (var i = obs.length - 1; i >= 0; i--) {
      var o = obs[i];
      o.x -= speed * dt;
      o.el.style.left = o.x + 'px';

      /* あたり判定（左34px・幅HORSE_W の箱と重なるか） */
      var hx0 = 34 + 10, hx1 = 34 + HORSE_W - 10;
      if (o.x < hx1 && o.x + o.w > hx0 && y < o.h) { crash(); return; }

      if (o.x + o.w < -20) { o.el.remove(); obs.splice(i, 1); }
    }

    raf = requestAnimationFrame(step);
  }

  function go() {
    screen('scPlay');
    clearObs();

    /* 帯1枚の表示幅 = 表示している高さ × (900/302) */
    var bh = far.clientHeight || 210;
    farTile = 900 * (bh / 302);
    farShift = 0;
    far.style.backgroundPositionX = '0px';
    y = 0; vy = 0; onGround = true;
    speed = SPD0; px = 0; jumps = 0; shift = 0;
    distEl.textContent = '0';
    hJump.textContent = '0';
    hSpeed.textContent = Math.round(SPD0 / 10);
    horse.src = '../images/game/run_afuwa.webp';
    horse.classList.remove('crash');
    horse.style.transform = 'translateY(0)';

    var n = 3;
    cue.hidden = false;
    cueBig.textContent = n;
    Sfx.count();
    var iv = setInterval(function () {
      n--;
      if (n > 0) { cueBig.textContent = n; Sfx.count(); return; }
      clearInterval(iv);
      cueBig.textContent = 'GO！';
      Sfx.start();
      /* 絵がそろうのを待ってから走り出す（長くても1.5秒で見切る） */
      var waited = 0;
      (function ready() {
        if (artReady >= ART.length || waited >= 1500) {
          cue.hidden = true;
          playing = true;
          Sfx.bgm('jump');
          nextGap = 320;
          last = performance.now();
          raf = requestAnimationFrame(step);
          return;
        }
        waited += 100;
        setTimeout(ready, 100);
      })();
    }, 620);
  }

  var viaPointer = false;
  stage.addEventListener('pointerdown', function (e) { e.preventDefault(); viaPointer = true; jump(); });
  stage.addEventListener('click', function () {
    if (viaPointer) { viaPointer = false; return; }
    jump();
  });
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
  });

  document.getElementById('startBtn').addEventListener('click', function () { Sfx.unlock(); go(); });

  var snd = document.getElementById('sndBtn');
  function paintSnd() {
    snd.classList.toggle('on', Sfx.enabled());
    snd.textContent = Sfx.enabled() ? 'SOUND' : 'MUTED';
  }
  snd.addEventListener('click', function () { Sfx.toggle(); paintSnd(); });
  paintSnd();
})();
</script>
</body>
</html>
