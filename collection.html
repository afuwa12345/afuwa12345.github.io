  .tk-guard { position: absolute; inset: 0; }
  .tk-card-b { padding: 11px 14px 13px; position: relative; }
  .tk-card-b b {
    display: block; font-family: 'Dela Gothic One', sans-serif; font-size: 16px;

    letter-spacing: .06em; background: var(--turf); color: var(--paper);
    border-radius: 5px; padding: 3px 7px; margin-right: 7px; vertical-align: 2px;
  }
  .tk-card-b i {
    display: block; font-style: normal; font-size: 11.5px; color: var(--ink-dim);

  .tk-badge {
