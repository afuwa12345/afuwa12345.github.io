<style>
  /* ===== 絵を見せるところ ===== */
  .mk-stage {
    position: relative; margin: 0 auto;
    width: min(100%, 380px); aspect-ratio: 1;
    border: 1px solid var(--rule); border-radius: 16px;
    background: var(--white);
    overflow: hidden;
  }
  .mk-stage canvas { display: block; width: 100%; height: 100%; }
  .mk-load {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--ink-dim); background: var(--white);
  }
  .mk-load.done { display: none; }

  /* ===== なまえ ===== */
  .mk-name {
    display: flex; align-items: center; gap: 9px;
    max-width: 380px; margin: 14px auto 0;
  }
  .mk-name label {
    flex: none; font-size: 12px; font-weight: 900; color: var(--ink-soft);
  }
  .mk-name input {
    flex: 1; min-width: 0; padding: 9px 12px;
    border: 1px solid var(--rule); border-radius: 10px;
    background: var(--white); color: var(--ink);
    font-family: inherit; font-size: 14px; font-weight: 700;
  }
  .mk-name input:focus { outline: 0; border-color: var(--turf); }

  /* ===== 画像の下のボタン ===== */
  .mk-tabs {
    display: flex; flex-wrap: wrap; gap: 7px; justify-content: center;
    margin: 14px 0 0;
  }
  .mk-tab {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 11px 6px 7px; cursor: pointer;
    border: 1px solid var(--rule); border-radius: 999px;
    background: var(--white); font-family: inherit;
    font-size: 12px; font-weight: 700; color: var(--ink-soft);
    transition: border-color .12s, background .12s, color .12s;
  }
  .mk-tab:hover { border-color: var(--turf); }
  .mk-tab.on { background: var(--turf); border-color: var(--turf); color: var(--paper); }
  .mk-tab-ico {
    position: relative; width: 22px; height: 22px; flex: none;
    border-radius: 6px; overflow: hidden; background: var(--paper-2);
    box-shadow: inset 0 0 0 1px rgba(26,30,24,.12);
  }
  .mk-tab-ico i { position: absolute; inset: 0; display: block; }
  .mk-tab-ico img { position: absolute; inset: 2px; width: calc(100% - 4px);
    height: calc(100% - 4px); object-fit: contain; }

  /* ===== 押すと下に開くパネル ===== */
  .mk-pop {
    margin: 10px 0 0; border: 1px solid var(--rule); border-radius: 14px;
    background: var(--white); box-shadow: var(--sh-sm);
    animation: mkPop .16s ease-out;
  }
  @keyframes mkPop { from { opacity: 0; transform: translateY(-6px); } }
  .mk-pop-in { padding: 13px 14px 14px; }
  .mk-pop-t {
    display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px;
    font-size: 13px; font-weight: 900;
  }
  .mk-pop-t em {
    font-style: normal; font-family: 'Anton', sans-serif; font-size: 10px;
    letter-spacing: .18em; color: var(--gold);
  }
  .mk-pop-x {
    margin-left: auto; width: 26px; height: 26px; flex: none; cursor: pointer;
    border: 1px solid var(--rule); border-radius: 50%; background: var(--white);
    font-size: 15px; line-height: 1; color: var(--ink-soft); font-family: inherit;
  }
  .mk-pop-x:hover { border-color: var(--turf); color: var(--turf); }

  /* ===== 選ぶところ ===== */
  .mk-part { margin: 18px 0 0; }
  .mk-part-t {
    display: flex; align-items: baseline; gap: 8px; margin: 0 0 9px;
    font-size: 13.5px; font-weight: 900;
  }
  .mk-part-t em {
    font-style: normal; font-family: 'Anton', sans-serif; font-size: 10px;
    letter-spacing: .18em; color: var(--gold);
  }
  .mk-part-t b { margin-left: auto; font-size: 11.5px; font-weight: 700; color: var(--ink-soft); }

  .mk-sw { display: flex; flex-wrap: wrap; gap: 7px; }
  .mk-sw button {
    position: relative; width: 38px; height: 38px; padding: 0; cursor: pointer;
    border: 2px solid var(--rule); border-radius: 10px; background: none;
    overflow: hidden; transition: transform .12s, border-color .12s;
  }
  .mk-sw button i {
    position: absolute; inset: 0; display: block; border-radius: 7px;
  }
  .mk-sw button:hover { transform: translateY(-2px); }
  .mk-sw button.on { border-color: var(--turf); box-shadow: 0 0 0 2px rgba(20,88,58,.18); }
  .mk-sw button.on::after {
    content: ''; position: absolute; right: 2px; bottom: 2px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--turf); box-shadow: 0 0 0 2px var(--white);
  }
  .mk-sw button.rare { border-color: var(--gold-lt); }
  .mk-sw button.rare2 { border-color: var(--gold); box-shadow: 0 0 9px rgba(181,135,26,.35); }
  .mk-sw button.none i {
    background: var(--paper-2);
    background-image: linear-gradient(45deg, transparent 45%, var(--rule) 45% 55%, transparent 55%);
  }

  /* 自由に色を選ぶ */
  .mk-free { display: flex; align-items: center; gap: 8px; margin: 8px 0 0; }
  .mk-free input[type="color"] {
    width: 38px; height: 38px; padding: 0; border: 2px solid var(--rule);
    border-radius: 10px; background: none; cursor: pointer;
  }
  .mk-free span { font-size: 11.5px; color: var(--ink-soft); }

  /* ===== 下のボタン ===== */
  .mk-acts { display: flex; flex-wrap: wrap; gap: 9px; margin: 22px 0 0; }
  .mk-btn {

  .mk-btn:hover { transform: translateY(-2px); box-shadow: var(--sh-md); }
  .mk-btn.primary { background: var(--turf); color: var(--paper); }
  .mk-btn.gold { background: var(--gold); color: #fff; }

  .mk-note { font-size: 11.5px; color: var(--ink-dim); line-height: 1.8; margin: 12px 0 0; }
  #mkMsg {

    background: var(--gold-soft); border-radius: 9px; padding: 9px 12px;

  /* 顔のパーツは、パーツの絵そのものを見本にする */

  @media (max-width: 480px) {
    .mk-sw button { width: 34px; height: 34px; }
    .mk-sw.face button { width: 50px; height: 42px; }
  }

<script src="js/afro-paint.js"></script>
<script src="js/afro-ui.js"></script>
<script>
(function () {
  /* ===== 塗り分けの下地 =====
     ベースの絵は、場所ごとにわざと違う色で塗ってある。
     その色を手がかりに「ここはアフロ」「ここは蹄」と見分けて塗りかえる。
     key は実際の絵から測った色。r は「この距離までは完全に塗りかえる」半径 */
  var PARTS = [
    { id: 'afro',   name: 'アフロ',     en: 'AFRO',   key: [0x36, 0xA2, 0x3E], r: 60, pat: true,  def: 'cha' },
    { id: 'body',   name: '体・頭',     en: 'BODY',   key: [0xAF, 0xF1, 0xFD], r: 60, pat: false, def: 'kinari' },
    { id: 'muzzle', name: '口のまわり', en: 'MUZZLE', key: [0xFD, 0xAE, 0xC4], r: 60, pat: false, def: 'tan' },
    { id: 'tail',   name: 'しっぽ',     en: 'TAIL',   key: [0xFD, 0x90, 0x1E], r: 70, pat: false, def: 'cha' },
    { id: 'hoof',   name: 'ひづめ',     en: 'HOOF',   key: [0x7B, 0x45, 0xB0], r: 80, pat: false, def: 'sumi' }
  ];

  /* 体まわりで使う、おちついた色。アフロは AfroPaint.PAL（15種）を使う */
  var SKIN = [
    { id: 'kinari', n: 'きなり',   flat: '#F4EBD6', chip: '#F4EBD6' },
    { id: 'shiro',  n: '白',       flat: '#FBFBF8', chip: '#FBFBF8' },
    { id: 'tan',    n: 'ベージュ', flat: '#D6BA96', chip: '#D6BA96' },
    { id: 'cha',    n: '茶',       flat: '#8A6A50', chip: '#8A6A50' },
    { id: 'koicha', n: 'こげ茶',   flat: '#4D443A', chip: '#4D443A' },
    { id: 'sumi',   n: 'すみ',     flat: '#3A342D', chip: '#3A342D' },
    { id: 'hai',    n: 'はい色',   flat: '#B9B5AC', chip: '#B9B5AC' },
    { id: 'ashige', n: 'あし毛',   flat: '#E2DED5', chip: '#E2DED5' },
    { id: 'kuri',   n: '栗毛',     flat: '#B5794A', chip: '#B5794A' },
    { id: 'ao',     n: '青毛',     flat: '#2E2A2A', chip: '#2E2A2A' },
    { id: 'momo',   n: 'もも',     flat: '#E8B4B8', chip: '#E8B4B8' },
    { id: 'kin',    n: '金',       flat: '#D4A02A', chip: '#D4A02A' }
  ];

  /* 顔のパーツ。images/maker/parts.json に位置と大きさが入っている */
  var FACE = [
    { id: 'me',    name: '目',   en: 'EYES' },
    { id: 'mayu',  name: 'まゆ', en: 'BROWS' },
    { id: 'hana',  name: '鼻',   en: 'NOSE' },
    { id: 'kuchi', name: '口',   en: 'MOUTH' }
  ];
  var MAN = null;            /* parts.json の中身 */
  var PIMG = {};             /* 読みこんだパーツの絵 */

  var stage  = document.getElementById('mkStage');
  var canvas = document.getElementById('mkCanvas');
  var ctx    = canvas.getContext('2d');
  var loadEl = document.getElementById('mkLoad');
  var tabsEl = document.getElementById('mkTabs');
  var popEl  = document.getElementById('mkPop');

  var SIZE = 900;
  var base = null;          /* もとの絵の画素 */
  var W = {};               /* 場所ごとの「どれだけ塗るか」0〜255 */
  var pick = {};            /* いま選んでいるもの */


  /* ===== 覚えておく ===== */
  var KEY = 'afro.maker.v1';
  function load() {
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || '{}');
      if (o && o.pick) { pick = o.pick; }
      if (o && o.name) {
        var ne = document.getElementById('mkName');
        if (ne) ne.value = o.name;
      }
    } catch (e) {}
    for (var i = 0; i < PARTS.length; i++) {
      var p = PARTS[i];
      if (!pick[p.id]) pick[p.id] = { kind: 'skin', id: p.def };
    }
    for (var j = 0; j < FACE.length; j++) {
      if (!pick[FACE[j].id]) pick[FACE[j].id] = { kind: 'face', n: 1 };
    }
    if (!pick.afro || pick.afro.kind === 'skin') {
      /* アフロだけは初期値を本来の色（こげ茶）にする */
      pick.afro = { kind: 'free', hex: '#4D443A' };
    }
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ pick: pick, name: myName() }));
    } catch (e) {}
  }

  /* ===== 色を決める ===== */
  function palById(id) {
    var L = AfroPaint.PAL;
    for (var i = 0; i < L.length; i++) if (L[i].id === id) return L[i];
    return null;
  }
  function skinById(id) {
    for (var i = 0; i < SKIN.length; i++) if (SKIN[i].id === id) return SKIN[i];
    return SKIN[0];
  }
  function hex2rgb(h) {
    var n = parseInt(String(h).slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  /* その場所に塗るもの。一色なら [r,g,b]、柄なら画素の並び */
  function inkFor(p) {
    var s = pick[p.id];
    if (!s) return hex2rgb('#888888');
    if (s.kind === 'free') return hex2rgb(s.hex);
    if (s.kind === 'skin') return hex2rgb(skinById(s.id).flat);
    var pal = palById(s.id);
    if (!pal) return hex2rgb('#888888');
    if (pal.flat) return hex2rgb(pal.flat);
    var cv = AfroPaint.makeSkin(pal, SIZE, SIZE, 12345);
    return cv.getContext('2d').getImageData(0, 0, SIZE, SIZE).data;
  }

  /* ===== 描く ===== */
  /* 名前を絵の下に書く。長いほど小さくして、はみ出さないようにする */
  function drawName(g, text) {
    var pad = SIZE * 0.08;
    var maxW = SIZE - pad * 2;
    var size = SIZE * 0.085;
    g.textAlign = 'center';
    g.textBaseline = 'alphabetic';
    for (var i = 0; i < 24; i++) {
      /* Dela Gothic One は漢字が極太すぎて、画数の多い字が
         黒い塊になる。持っていない漢字も多く、そこだけ別の字体で
         出てしまう。Zen Kaku Gothic New の一番太いものにする */
      g.font = '900 ' + size + 'px "Zen Kaku Gothic New", sans-serif';
      if (g.measureText(text).width <= maxW || size < SIZE * 0.035) break;
      size -= SIZE * 0.004;
    }
    var y = SIZE * 0.975;

    /* 白いフチを「線」で描くと、線が字の内側にも太るので、
       「景」のように画数の多い字は隙間が埋まってつぶれる。
       そこで、ぼかした白い影を何度か重ねて縁どりにする。
       こちらは字の形をいっさい削らない */
    g.save();
    g.shadowColor = '#FFFFFF';
    g.shadowBlur = size * 0.22;
    g.fillStyle = '#FFFFFF';
    for (var k = 0; k < 4; k++) g.fillText(text, SIZE / 2, y);
    g.restore();

    g.fillStyle = '#1A1E18';
    g.fillText(text, SIZE / 2, y);
  }

  /* Canvas に描く字は、フォントの読み込みを起こさない。
     ページに出ていない漢字は取りに行かれないので、
     その字だけ既定の字体で出てしまう。先に読ませておく */
  function ensureFont(text, cb) {
    if (!text || !document.fonts || !document.fonts.load) { cb(); return; }
    var want = '900 80px "Zen Kaku Gothic New"';
    function done() {
      cb();
      /* 届いたばかりの字がまだ反映されていないことがあるので、
         少し置いてもう一度だけ描きなおす */
      setTimeout(cb, 350);
      setTimeout(cb, 1200);
    }
    try {
      document.fonts.load(want, text).then(done, done);
    } catch (e) { done(); }
  }

  /* 絵の左上に、どこで作ったかを小さく入れる。
     キャラは中央から右に寄っているので、ここは空いている */
  function drawMark(g) {
    var x = SIZE * 0.045;
    g.save();
    g.textAlign = 'left';
    g.textBaseline = 'alphabetic';

    g.font = '900 ' + (SIZE * 0.036) + 'px "Zen Kaku Gothic New", sans-serif';
    g.fillStyle = 'rgba(26,30,24,.62)';
    g.fillText('アフロ馬メーカー', x, SIZE * 0.062);

    g.font = '700 ' + (SIZE * 0.026) + 'px "Zen Kaku Gothic New", sans-serif';
    g.fillStyle = 'rgba(181,135,26,.85)';
    g.fillText('afro-horse.com', x, SIZE * 0.097);
    g.restore();
  }

  function myName() {
    var el = document.getElementById('mkName');
    return (el && el.value || '').replace(/[\r\n\t]/g, '').trim().slice(0, 12);
  }

  function render() {
    if (!base) return;
    var out = new Uint8ClampedArray(base.data);
    for (var k = 0; k < PARTS.length; k++) {
      var p = PARTS[k];
      var w = W[p.id];
      var ink = inkFor(p);
      var isPat = ink.length > 3;
      for (var i = 0, j = 0; i < w.length; i++, j += 4) {
        var a = w[i];
        if (!a) continue;
        var f = a / 255;
        var r = isPat ? ink[j] : ink[0];
        var g = isPat ? ink[j + 1] : ink[1];
        var b = isPat ? ink[j + 2] : ink[2];
        out[j]     = out[j]     * (1 - f) + r * f;
        out[j + 1] = out[j + 1] * (1 - f) + g * f;
        out[j + 2] = out[j + 2] * (1 - f) + b * f;
      }
    }
    /* いったん別の紙に組み立てる。名前を入れるときに縮めたいため */
    if (!render._off) {
      render._off = document.createElement('canvas');
      render._off.width = SIZE; render._off.height = SIZE;
    }
    var off = render._off;
    var og = off.getContext('2d');
    og.clearRect(0, 0, SIZE, SIZE);
    og.putImageData(new ImageData(out, SIZE, SIZE), 0, 0);

    /* 顔のパーツを上から重ねる。順番は 鼻 → 口 → 目 → まゆ */
    ['hana', 'kuchi', 'me', 'mayu'].forEach(function (key) {
      var s = pick[key];
      if (!MAN || !s || s.n === 0) return;
      var r = MAN.parts[key] && MAN.parts[key][s.n - 1];
      var im = r && PIMG[r.id];
      if (r && im && im.complete && im.naturalWidth) og.drawImage(im, r.x, r.y);
    });

    /* 名前があるときは、絵を少し縮めて下に場所をあける */
    ctx.clearRect(0, 0, SIZE, SIZE);
    var nm = myName();
    if (nm) {
      var k = 0.88;
      ctx.drawImage(off, 0, 0, SIZE, SIZE, (SIZE - SIZE * k) / 2, 0, SIZE * k, SIZE * k);
      drawName(ctx, nm);
    } else {
      ctx.drawImage(off, 0, 0);
    }
    drawMark(ctx);
    paintShare();
  }

  /* ===== 下ごしらえ ===== */
  function prepare(img) {
    var tmp = document.createElement('canvas');
    tmp.width = SIZE; tmp.height = SIZE;
    var g = tmp.getContext('2d', { willReadFrequently: true });
    g.drawImage(img, 0, 0, SIZE, SIZE);
    base = g.getImageData(0, 0, SIZE, SIZE);
    var d = base.data, n = SIZE * SIZE;

    /* どの画素も「いちばん近い下地の色」に必ず割りあてる。
       距離で切ると、線とのにじみが取り残されて
       元の色（緑や桃）がフチに残ってしまうため。

       黒い線のそばだけは弱める。そうしないと輪郭まで塗れてしまう */
    var arrs = [];
    for (var k = 0; k < PARTS.length; k++) {
      arrs.push(new Uint8Array(n));
      W[PARTS[k].id] = arrs[k];
      var kk = PARTS[k].key;
      var kl = Math.sqrt(kk[0] * kk[0] + kk[1] * kk[1] + kk[2] * kk[2]) || 1;
      PARTS[k].unit = [kk[0] / kl, kk[1] / kl, kk[2] / kl];
    }
    for (var i = 0, j = 0; i < n; i++, j += 4) {
      var al = d[j + 3];
      if (al < 8) continue;
      var r0 = d[j], g0 = d[j + 1], b0 = d[j + 2];

      /* 黒からの遠さ。線の上では 0 に近い */
      var dk = Math.sqrt(r0 * r0 + g0 * g0 + b0 * b0);
      if (dk < 45) continue;

      /* 「いちばん近い色」で選んではいけない。
         線に近づいて暗くなった水色は、RGB のものさしでは
         紫や緑のほうが近くなってしまい、フチだけ別の色に塗られる。

         暗いか明るいかは見ないで、色あいの向きだけで見くらべる。
         暗くなった水色は、向きとしては水色のままなので正しく選べる */
      var len0 = Math.sqrt(r0 * r0 + g0 * g0 + b0 * b0) || 1;
      var bi = -1, bs = -1;
      for (var k2 = 0; k2 < PARTS.length; k2++) {
        var u = PARTS[k2].unit;
        var cos = (r0 * u[0] + g0 * u[1] + b0 * u[2]) / len0;
        if (cos > bs) { bs = cos; bi = k2; }
      }
      if (bi < 0) continue;

      var w = Math.min(1, (dk - 45) / 45);
      arrs[bi][i] = Math.round(w * (al / 255) * 255);
    }
  }

  /* ===== 選ぶところ =====
     画像の下にボタンを並べ、押すとその下にパネルが開く。
     開けるのはひとつだけ。もう一度押すと閉じる */
  var CATS = [];
  var openCat = null;

  function chip(css) {
    var i = document.createElement('i');
    i.style.background = css;
    return i;
  }

  /* いま選んでいるものを、ボタンの中の小さい四角に映す */
  function tabFace(c) {
    var box = c.btn.querySelector('.mk-tab-ico');
    box.innerHTML = '';
    var s = pick[c.id] || {};
    if (c.kind === 'color') {
      var css = '#888';
      if (s.kind === 'free') css = s.hex;
      else if (s.kind === 'pal') { var q = palById(s.id); if (q) css = q.chip; }
      else { css = skinById(s.id).chip; }
      box.appendChild(chip(css));
    } else {
      var r = MAN && MAN.parts[c.id] && MAN.parts[c.id][(s.n || 1) - 1];
      if (r) {
        var im = document.createElement('img');
        im.src = 'images/maker/' + r.id + '.webp';
        im.alt = '';
        box.appendChild(im);
      }
    }
  }
  function paintTabs() { CATS.forEach(tabFace); }

  function closePop() {
    openCat = null;
    popEl.hidden = true;
    popEl.innerHTML = '';
    CATS.forEach(function (c) { c.btn.classList.remove('on'); });
  }

  function openPop(c) {
    if (openCat === c) { closePop(); return; }
    openCat = c;
    popEl.innerHTML = '';
    popEl.appendChild(panelFor(c));
    popEl.hidden = false;
    CATS.forEach(function (x) { x.btn.classList.toggle('on', x === c); });
  }

  /* パネルの中身 */
  function panelFor(c) {
    var wrap = document.createElement('div');
    wrap.className = 'mk-pop-in';

    var head = document.createElement('div');
    head.className = 'mk-pop-t';
    head.innerHTML = '<span>' + c.name + '</span><em>' + c.en + '</em>';
    var x = document.createElement('button');
    x.type = 'button';
    x.className = 'mk-pop-x';
    x.setAttribute('aria-label', 'とじる');
    x.textContent = '×';
    x.onclick = closePop;
    head.appendChild(x);
    wrap.appendChild(head);

    var row = document.createElement('div');
    row.className = 'mk-sw' + (c.kind === 'face' ? ' face' : '');
    wrap.appendChild(row);

    if (c.kind === 'color') {
      var list = c.p.pat ? AfroPaint.PAL : SKIN;
      list.forEach(function (o) {
        var b = document.createElement('button');
        b.type = 'button';
        b.title = o.n;
        b.setAttribute('data-id', o.id);
        if (o.rank === 1) b.className = 'rare';
        if (o.rank === 2) b.className = 'rare2';
        b.appendChild(chip(o.chip));
        b.onclick = function () {
          pick[c.id] = { kind: c.p.pat ? 'pal' : 'skin', id: o.id };
          save(); render(); markPanel(c, wrap); paintTabs();
        };
        row.appendChild(b);
      });

      var free = document.createElement('div');
      free.className = 'mk-free';
      var inp = document.createElement('input');
      inp.type = 'color';
      inp.value = (pick[c.id] && pick[c.id].kind === 'free') ? pick[c.id].hex : '#8A6A50';
      inp.oninput = function () {
        pick[c.id] = { kind: 'free', hex: inp.value };
        save(); render(); markPanel(c, wrap); paintTabs();
      };
      var lab = document.createElement('span');
      lab.textContent = '自分で色をえらぶ';
      free.appendChild(inp); free.appendChild(lab);
      wrap.appendChild(free);
    } else {
      (MAN.parts[c.id] || []).forEach(function (r, i) {
        if (!r) return;
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'pic';
        b.setAttribute('data-n', String(i + 1));
        var im = document.createElement('img');
        im.src = 'images/maker/' + r.id + '.webp';
        im.alt = '';
        b.appendChild(im);
        b.onclick = function () {
          pick[c.id] = { kind: 'face', n: i + 1 };
          save(); render(); markPanel(c, wrap); paintTabs();
        };
        row.appendChild(b);
      });
    }

    markPanel(c, wrap);
    return wrap;
  }

  /* パネルの中で、いま選んでいるものに印をつける */
  function markPanel(c, wrap) {
    var s = pick[c.id] || {};
    var btns = wrap.querySelectorAll('.mk-sw button');
    for (var i = 0; i < btns.length; i++) {
      var b = btns[i];
      var on = (c.kind === 'color')
        ? (s.kind !== 'free' && b.getAttribute('data-id') === s.id)
        : (Number(b.getAttribute('data-n')) === s.n);
      b.classList.toggle('on', !!on);
    }
    var name = '自分で選んだ色';
    if (c.kind === 'face') name = c.name + (s.n || 1);
    else if (s.kind === 'pal') { var q = palById(s.id); if (q) name = q.n; }
    else if (s.kind === 'skin') name = skinById(s.id).n;
    var t = wrap.querySelector('.mk-pop-t span');
    t.textContent = c.name + '　' + name;
  }

  function build() {
    CATS = [];
    PARTS.forEach(function (p) {
      CATS.push({ kind: 'color', id: p.id, name: p.name, en: p.en, p: p });
    });
    if (MAN) FACE.forEach(function (f) {
      var any = (MAN.parts[f.id] || []).some(function (r) { return !!r; });
      if (any) CATS.push({ kind: 'face', id: f.id, name: f.name, en: f.en, f: f });
    });

    tabsEl.innerHTML = '';
    CATS.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'mk-tab';
      b.innerHTML = '<span class="mk-tab-ico"></span><span class="mk-tab-n">' + c.name + '</span>';
      b.onclick = function () { openPop(c); };
      c.btn = b;
      tabsEl.appendChild(b);
    });
    paintTabs();
  }

  function markAll() {
    paintTabs();
    if (openCat) {
      var in_ = popEl.querySelector('.mk-pop-in');
      if (in_) markPanel(openCat, in_);
    }
  }

  /* ===== ランダム ===== */
  document.getElementById('mkRandom').addEventListener('click', function () {
    PARTS.forEach(function (p) {
      var list = p.pat ? AfroPaint.PAL : SKIN;
      var c = list[Math.floor(Math.random() * list.length)];
      pick[p.id] = { kind: p.pat ? 'pal' : 'skin', id: c.id };
    });
    /* 使わないことにしたコマ（中身が空）は引かない。
       引いてしまうと、そのパーツだけ何も出ない姿になる */
    if (MAN) FACE.forEach(function (f) {
      var list = MAN.parts[f.id] || [];
      var ok = [];
      for (var i = 0; i < list.length; i++) if (list[i]) ok.push(i + 1);
      if (ok.length) pick[f.id] = { kind: 'face', n: ok[Math.floor(Math.random() * ok.length)] };
    });
    save(); render(); markAll();
  });

  /* ===== 画像にする ===== */
  /* 白地にしてから1枚の絵にする。data: の文字列で返す */
  function makeUrl() {
    var out = document.createElement('canvas');
    out.width = SIZE; out.height = SIZE;
    var g = out.getContext('2d');
    g.fillStyle = '#FFFFFF';
    g.fillRect(0, 0, SIZE, SIZE);
    g.drawImage(canvas, 0, 0);
    return out.toDataURL('image/png');
  }

  /* data: の文字列を、そのままファイルに変える。
     途中で待たないので、押した流れのまま共有をひらける
     （待ちをはさむと、スマホでは共有がひらけないことがある） */
  function urlToFile(url, name) {
    var bin = atob(url.split(',')[1]);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new File([arr], name, { type: 'image/png' });
  }

  function fileName() {
    var nm = myName().replace(/[\\/:*?"<>|\s]/g, '');
    return 'afro-horse' + (nm ? '-' + nm : '') + '.png';
  }

  function download(url, name) {
    var a = document.createElement('a');
    a.download = name;
    a.href = url;
    a.click();
  }

  function say(text) {
    var m = document.getElementById('mkMsg');
    if (!m) return;
    m.textContent = text;
    m.hidden = !text;
  }

  /* ===== 保存 ===== */
  document.getElementById('mkSave').addEventListener('click', function () {
    download(makeUrl(), fileName());
    say('画像を保存しました。');
  });

  /* ===== シェア ===== */
  var shareText = '';

  function paintShare() {
    var names = [];
    PARTS.forEach(function (p) {
      var s = pick[p.id] || {};
      if (s.kind === 'pal') { var q = palById(s.id); if (q && q.rank) names.push(q.n); }
    });
    var nm = myName();
    var t = nm ? ('自分だけのアフロ馬【' + nm + '】をつくった！\n')
               : '自分だけのアフロ馬をつくった！\n';
    if (names.length) t += 'アフロは【' + names.join('・') + '】\n';
    t += '#アフロホース #アフロ馬メーカー\n';
    shareText = t;
  }

  function xIntent() {
    return 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(shareText) +
           '&url=' + encodeURIComponent('https://afro-horse.com/maker.html');
  }

  /* 絵ごと渡せる端末かどうかで、ボタンの文字を変える。
     渡せるなら X だけでなく Instagram のストーリーズにも出せるので、
     「X でシェア」とは書かない */
  (function () {
    var b = document.getElementById('mkShare');
    var can = false;
    try {
      var probe = new File([new Uint8Array([0])], 'a.png', { type: 'image/png' });
      can = !!(navigator.canShare && navigator.canShare({ files: [probe] }));
    } catch (e) {}
    b.textContent = can ? '画像つきでシェア' : 'X でシェア';
    if (can) b.title = 'X・Instagramのストーリーズ・LINE などに、絵ごと送れます';
  })();

  document.getElementById('mkShare').addEventListener('click', function () {
    var url = makeUrl();
    var file = null;
    try { file = urlToFile(url, fileName()); } catch (e) {}

    /* スマホなど、絵ごと渡せる端末はそのまま渡す。
       共有の窓から X を選べば、絵が付いたまま投稿できる */
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({
        files: [file],
        text: shareText,
        title: 'アフロ馬メーカー'
      }).then(function () { say(''); })['catch'](function () { /* やめただけ */ });
      return;
    }

    /* パソコンなどは、絵を直接わたせない。
       絵を保存してから、文だけ入った投稿画面をひらく */
    download(url, fileName());
    say('画像を保存しました。開いた投稿画面に、その画像を貼りつけてください。');
    window.open(xIntent(), '_blank', 'noopener');
  });

  /* 打つたびに描きなおす */
  (function () {
    var ne = document.getElementById('mkName');
    if (!ne) return;
    ne.addEventListener('input', function () {
      save();
      render();                       /* まず今ある字体で出す */
      ensureFont(myName(), render);   /* そろったら描きなおす */
    });
  })();

  /* 字体がそろってから、もう一度だけ描きなおす。
     先に描くと、名前が別の字体のまま残ってしまう */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      ensureFont(myName(), function () { if (base) render(); });
    });
  }

  /* ===== はじめる ===== */
  load();

  function loadParts() {
    return fetch('images/maker/parts.json').then(function (r) { return r.json(); })
      .then(function (d) {
        MAN = d;
        var waits = [];
        FACE.forEach(function (f) {
          (MAN.parts[f.id] || []).forEach(function (r) {
            if (!r) return;
            var im = new Image();
            PIMG[r.id] = im;
            waits.push(new Promise(function (ok) {
              im.onload = ok; im.onerror = ok;
              im.src = 'images/maker/' + r.id + '.webp';
            }));
          });
        });
        return Promise.all(waits);
      })['catch'](function () { MAN = null; });
  }

  var img = new Image();
  img.onload = function () {
    prepare(img);
    loadParts().then(function () {
      build();
      render();
      loadEl.classList.add('done');
    });
  };
  img.onerror = function () { loadEl.textContent = '絵をよみこめませんでした'; };
  img.src = 'images/maker/base.webp';
})();
</script>
</body>
