<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFRO Horse｜カルーセル</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
 :root{--bg:#15120f;--bg2:#241e18;--accent:#e0562f;--accent2:#d9b271;--text:#f4efe6;--sub:#9d8d7c}
 *{margin:0;padding:0;box-sizing:border-box}
 body{background:#0b0b0b;color:var(--text);font-family:'Noto Sans JP',sans-serif;padding:14px}
 h1{font-family:'Dela Gothic One';font-size:19px}
 h1 span{color:var(--accent)}
 .bar{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap;margin:12px 0 16px;
   background:var(--bg2);padding:11px 13px;border-radius:8px;position:sticky;top:6px;z-index:20}
 .bar label{font-size:10px;color:var(--sub);display:block;margin-bottom:3px;letter-spacing:.5px}
 select,button{font-family:inherit;font-size:13px;padding:7px 10px;border-radius:5px;border:0}
 select{background:#332b23;color:var(--text)}
 #race{min-width:200px}
 button{background:var(--accent);color:#fff;font-weight:900;cursor:pointer}
 button.sub{background:#3a322a;color:var(--text)}
 .info{margin-left:auto;font-size:11px;color:var(--sub);text-align:right;line-height:1.6}
 .info b{color:var(--accent2)}
 .sheets{display:flex;gap:12px;flex-wrap:wrap}
 .sheets.one{flex-direction:column;align-items:center}
 .card{background:var(--bg2);border-radius:8px;padding:7px}
 .card h2{font-size:10px;color:var(--sub);margin-bottom:5px;font-weight:900;letter-spacing:1px;
   display:flex;align-items:center;gap:8px}
 .card h2 button{font-size:10px;padding:3px 7px;margin-left:auto}
 iframe{width:540px;height:675px;border:0;border-radius:4px;display:block;
   background:#15120f;overflow:hidden}
 @media(max-width:600px){ .card{width:calc(100vw - 42px)}
   iframe{width:100%;height:calc((100vw - 56px)*1.25)} }
</style></head><body>
<h1>AFRO <span>Horse</span>｜カルーセル</h1>
<div class="bar">
  <div><label>レース</label><select id="race"></select></div>
  <div><label>キャラ</label><select id="chara"></select></div>
  <div><label>比率</label><select id="ratio">
    <option value="4:5">4:5（1080×1350）</option>
    <option value="1:1">1:1（1080×1080）</option></select></div>
  <div><label>並べ方</label><select id="view">
    <option value="row">横に並べる</option>
    <option value="one">たてに1枚ずつ</option></select></div>
  <div><button id="dl">7枚まとめて保存</button></div>
  <div class="info" id="info"></div>
</div>
<div class="sheets" id="sheets"></div>
<script>
const PAGES = ["<!DOCTYPE html>\n<html lang=\"ja\">\n<head><meta charset=\"UTF-8\"><title>v5 表紙8種<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;700;900&family=Bebas+Neue&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{--bg:#15120f;--bg2:#241e18;--accent:#e0562f;--accent2:#d9b271;--text:#f4efe6;--sub:#9d8d7c}\n  *{margin:0;padding:0;box-sizing:border-box}\n  body{background:#0b0b0b;padding:20px;font-family:'Noto Sans JP',sans-serif}\n  .row{display:flex;gap:16px;flex-wrap:wrap}\n  .slide{width:540px;min-width:540px;height:675px;flex:none;background:var(--bg);color:var(--text);\n    position:relative;overflow:hidden;display:flex;flex-direction:column;padding:28px 32px 24px}\n  .slide::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;\n    background:linear-gradient(90deg,var(--accent) 0%,var(--accent2) 100%);z-index:3}\n  .slash{position:absolute;left:-90px;top:222px;width:760px;height:190px;\n    background:linear-gradient(180deg,rgba(224,86,47,.11),rgba(224,86,47,0));transform:rotate(-6deg);z-index:0}\n  .head{display:flex;justify-content:space-between;align-items:center;z-index:2}\n  .brand{font-family:'Bebas Neue';font-size:15px;letter-spacing:5px;color:var(--accent2)}\n  .grade{font-family:'Dela Gothic One';font-size:12px;letter-spacing:2px;background:var(--accent);\n    color:#fff;padding:4px 11px;border-radius:2px}\n  .when{margin-top:20px;font-size:12.5px;letter-spacing:1.5px;color:var(--sub);z-index:2}\n  .race{font-family:'Dela Gothic One';font-size:41px;line-height:1.06;margin-top:5px;z-index:2}\n  .rule{width:56px;height:4px;background:var(--accent2);margin-top:12px;z-index:2}\n  .hook{margin-top:auto;z-index:2;display:flex;align-items:flex-end;gap:6px}\n  .hook-l{flex:1;min-width:0}\n  .hook-r{width:196px;flex-shrink:0;margin-right:-22px;margin-bottom:-14px;\n    filter:drop-shadow(4px 7px 12px rgba(0,0,0,.5))}\n  .hook-r img{width:100%;height:auto;display:block}\n  .hook-lead{font-size:16px;font-weight:700;letter-spacing:.5px}\n  .hook-main{display:flex;align-items:baseline;gap:12px;margin-top:-4px}\n  .hook-num{font-family:'Bebas Neue';line-height:1;color:var(--accent);letter-spacing:-2px;\n    text-shadow:0 8px 30px rgba(224,86,47,.30)}\n  .hook-unit{font-family:'Dela Gothic One';font-size:26px;letter-spacing:1px;white-space:nowrap}\n  /* ★「回」のような1文字の漢字は Dela Gothic One だと中が潰れて□に見えるので細めの書体にする */\n  .hook-unit.one{font-family:'Noto Sans JP';font-weight:700;font-size:30px;letter-spacing:0}\n  .hook-sub{font-size:13px;font-weight:700;line-height:1.7;border-left:3px solid var(--accent2);\n    padding-left:12px;margin-top:10px}\n  .chart{margin-top:auto;margin-bottom:2px;z-index:2}\n  .chart-ttl{font-size:10.5px;color:var(--sub);letter-spacing:1.5px;margin-bottom:7px}\n  .bars{display:flex;align-items:flex-end;gap:6px;height:80px}\n  .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}\n  .bar .v{width:100%;background:#4a3d33;border-radius:2px 2px 0 0}\n  .bar.hot .v{background:var(--accent)}\n  .bar .n{font-family:'Bebas Neue';font-size:11.5px;color:var(--sub);line-height:1}\n  .bar.hot .n{color:var(--accent);font-size:13px}\n  .yrs{display:flex;gap:6px;margin-top:5px}\n  .yr{flex:1;text-align:center;font-family:'Bebas Neue';font-size:9px;color:#6b5d50}\n  .foot{display:flex;align-items:flex-end;z-index:2;margin-top:18px}\n  .foot-txt{flex:1;background:var(--bg2);border-left:3px solid var(--accent);padding:11px 14px;\n    border-radius:3px;display:flex;justify-content:space-between;align-items:flex-end}\n  .foot-txt .t1{font-size:12.5px;font-weight:700;line-height:1.55}\n  .foot-txt .t1 b{color:var(--accent2);font-weight:900}\n  .foot-txt .t2{font-size:10.5px;color:var(--sub);letter-spacing:1px;white-space:nowrap;padding-left:10px}\n  .tag{position:absolute;top:8px;left:8px;background:#fff;color:#000;font-size:10.5px;\n    padding:2px 8px;border-radius:2px;z-index:9;font-weight:900}\n<\/style><\/head>\n<body><div class=\"row\" id=\"row\"><\/div>\n<script>\n/* web公開では1枚だけを枠いっぱいに出す（余白とスクロールを消す） */\ndocument.addEventListener('DOMContentLoaded', () => {\n  const st = document.createElement('style');\n  st.textContent = 'html,body{margin:0;padding:0;overflow:hidden;background:transparent}'\n                 + '.row{gap:0!important}';\n  document.head.appendChild(st);\n});\n/* ===== web公開用：?race= で1レースだけ描く ===== */\nfunction 選ぶ(list){\n  const q = parent.__RACE;\n  const hit = list.filter(x => x.race === q);\n  return hit.length ? hit : list.slice(0,1);\n}\n\n/* 親ページから「保存して」と言われたら、この1枚をPNGにして返す */\nwindow.addEventListener('message', async e => {\n  if(!e.data || e.data.cmd !== 'save') return;\n  if(!window.html2canvas){\n    await new Promise(r => { const s=document.createElement('script');\n      s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';\n      s.onload=r; document.head.appendChild(s); });\n  }\n  const el = document.querySelector('.slide');\n  if(!el) return;\n  const H = e.data.ratio === '1:1' ? 540 : 675;\n  el.style.height = H + 'px'; el.style.width = '540px';\n  const c = await html2canvas(el, {scale:2, width:540, height:H, backgroundColor:null});\n  parent.postMessage({cmd:'saved', no:e.data.no, png:c.toDataURL('image/png')}, '*');\n});\n\n/* ===== レースごとの担当キャラ（1レース＝1キャラ、7枚とも同じ） ===== */\nconst SLIDE_NO = 1;\nlet CHARA = {}, IMGS = {};\nasync function loadChara(){\n  [CHARA, IMGS] = await Promise.all([\n    fetch('./担当キャラ.json?v='+Date.now()).then(r=>r.json()),\n    fetch('./画像一覧.json?v='+Date.now()).then(r=>r.json())\n  ]);\n}\nconst CHARA_NAME = {\"ginma\": \"ギンマ\", \"afuwa\": \"アフワ\", \"buruma\": \"ブルマ\", \"chafuwa\": \"チャフワ\", \"kurofuwa\": \"クロフワ\", \"yancha\": \"やんちゃアフワ\"};\nfunction charaKey(race){ return parent.__CHARA || (CHARA[race] && CHARA[race].chara) || 'ginma'; }\nfunction charaName(race){ return CHARA_NAME[charaKey(race)]; }\nlet SERIF = {};\nasync function loadSerif(){\n  try{ SERIF = await fetch('./台詞.json?v='+Date.now()).then(r=>r.json()); }catch(e){ SERIF = {}; }\n}\n/* APIが書いた台詞があればそれを使う。無ければ元の文のまま */\nfunction serif(race, fallback){\n  const k = race + '|' + SLIDE_NO;\n  return (SERIF[k] && SERIF[k].text) ? SERIF[k].text : fallback;\n}\nfunction charaImg(race){\n  const c = parent.__CHARA || (CHARA[race] && CHARA[race].chara) || 'ginma';\n  const list = IMGS[c] || [];\n  if(!list.length) return './Images/ginma1.png';\n  // レース名から決まる数に、何枚目かを足してずらす（同じレースでも毎枚ちがう絵になる）\n  let h = 0; for(const ch of race) h = (h*31 + ch.codePointAt(0)) >>> 0;\n  return './画像/' + c + '/' + list[(h + SLIDE_NO*7) % list.length];\n}\n\nPromise.all([loadChara(),loadSerif()]).then(()=>fetch('./eight.json?v='+Date.now())).then(r=>r.json()).then(list=>{ list = 選ぶ(list);\n const row=document.getElementById('row');\n list.forEach(d=>{\n  const MAXP=Math.max(12,...d.pop);\n  const bars=d.pop.map(p=>`<div class=\"bar${p>=8?' hot':''}\"><div class=\"n\">${p}<\/div>\n    <div class=\"v\" style=\"height:${Math.round(p/MAXP*58)+4}px\"><\/div><\/div>`).join('');\n  const yrs=d.pop.map((_,i)=>`<div class=\"yr\">${String(d.y0+i).slice(2)}<\/div>`).join('');\n  const fs = d.num.length>=4 ? 84 : (d.num.length===3 ? 104 : 126);\n  row.insertAdjacentHTML('beforeend',`\n  <div class=\"slide\"><div class=\"tag\">${d.kind}<\/div><div class=\"slash\"><\/div>\n    <div class=\"head\"><div class=\"brand\">AFRO HORSE<\/div><div class=\"grade\">${d.grade}<\/div><\/div>\n    <div class=\"when\">${d.when}<\/div><div class=\"race\">${d.race}<\/div><div class=\"rule\"><\/div>\n    <div class=\"hook\"><div class=\"hook-l\">\n      <div class=\"hook-lead\">${d.lead}<\/div>\n      <div class=\"hook-main\"><span class=\"hook-num\" style=\"font-size:${fs}px\">${d.num}<\/span>\n        <span class=\"hook-unit${d.unit.length<=1?' one':''}\">${d.unit}<\/span><\/div>\n      <div class=\"hook-sub\">${serif(d.race, d.line)}<\/div>\n    <\/div><div class=\"hook-r\"><img src=\"${charaImg(d.race)}\" alt=\"\"><\/div><\/div>\n    <div class=\"chart\"><div class=\"chart-ttl\">勝ち馬の人気（${d.y0} → ${d.y0+d.pop.length-1}）<\/div>\n      <div class=\"bars\">${bars}<\/div><div class=\"yrs\">${yrs}<\/div><\/div>\n    <div class=\"foot\"><div class=\"foot-txt\">\n      <div class=\"t1\">過去<b>${d.eds}回<\/b>・<b>${d.runs}頭<\/b>のデータで<br>このレースの\"いま\"を読む<\/div>\n      <div class=\"t2\">→ スワイプ<\/div><\/div><\/div>\n  <\/div>`);\n });\n});\n<\/script><\/body><\/html>\n", "<!DOCTYPE html>\n<html lang=\"ja\"><head><meta charset=\"UTF-8\"><title>v5 2枚目6種<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;700;900&family=Bebas+Neue&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{--bg:#15120f;--bg2:#241e18;--accent:#e0562f;--accent2:#d9b271;--text:#f4efe6;--sub:#9d8d7c;--dim:#4a3d33}\n  *{margin:0;padding:0;box-sizing:border-box}\n  body{background:#0b0b0b;padding:20px;font-family:'Noto Sans JP',sans-serif}\n  .row{display:flex;gap:16px;flex-wrap:wrap}\n  .slide{width:540px;min-width:540px;height:675px;flex:none;background:var(--bg);color:var(--text);\n    position:relative;overflow:hidden;display:flex;flex-direction:column;padding:28px 32px 22px}\n  .slide::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;\n    background:linear-gradient(90deg,var(--accent) 0%,var(--accent2) 100%);z-index:3}\n  .kicker{font-family:'Bebas Neue';font-size:13px;letter-spacing:4px;color:var(--accent2)}\n  .ttl{font-family:'Dela Gothic One';font-size:25px;line-height:1.3;margin-top:4px}\n  .ttl em{color:var(--accent);font-style:normal}\n  .rule{width:52px;height:4px;background:var(--accent2);margin-top:11px}\n  .list{display:flex;flex-direction:column;gap:12px;margin-top:16px}\n  .item-h{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}\n  .item-t{font-family:'Dela Gothic One';font-size:13.5px;color:var(--accent2)}\n  .sp{flex:1}\n  .item-n{font-size:9.5px;color:var(--sub);letter-spacing:.3px}\n  .r{display:grid;grid-template-columns:104px 1fr 40px 50px;gap:8px;align-items:center;margin-bottom:5px}\n  .r .lab{font-size:11.5px;font-weight:700;text-align:right;line-height:1.25}\n  .r .lab span{display:block;font-size:9px;color:var(--sub);font-weight:400}\n  .track{height:20px;background:#221c17;border-radius:2px;overflow:hidden}\n  .fill{height:100%;background:var(--dim);border-radius:2px}\n  .r.hi .fill{background:var(--accent)}\n  .r .rn{font-size:9.5px;color:var(--sub);text-align:right}\n  .r .pc{font-family:'Bebas Neue';font-size:19px;text-align:right;color:var(--sub);line-height:1}\n  .r.hi .pc{color:var(--accent);font-size:22px}\n  .note{margin-top:11px;font-size:9.5px;color:var(--sub);line-height:1.5}\n  .say{display:flex;align-items:flex-end;gap:10px;margin-top:auto;height:112px}\n  .bub{flex:1;background:var(--bg2);border-radius:13px;padding:11px 13px;font-size:12.5px;\n    font-weight:700;line-height:1.6;position:relative;align-self:center}\n  .bub::after{content:'';position:absolute;right:-8px;top:50%;transform:translateY(-50%);\n    border:8px solid transparent;border-left-color:var(--bg2)}\n  .bub b{color:var(--accent2)}\n  .ch{width:118px;height:118px;flex-shrink:0;margin-right:-14px;\n    filter:drop-shadow(3px 5px 9px rgba(0,0,0,.45))}\n  .ch img{width:100%;height:100%;object-fit:contain;display:block}\n  .tag{position:absolute;top:8px;left:8px;background:#fff;color:#000;font-size:10.5px;\n    padding:2px 8px;border-radius:2px;z-index:9;font-weight:900}\n<\/style><\/head>\n<body><div class=\"row\" id=\"row\"><\/div>\n<script>\n/* web公開では1枚だけを枠いっぱいに出す（余白とスクロールを消す） */\ndocument.addEventListener('DOMContentLoaded', () => {\n  const st = document.createElement('style');\n  st.textContent = 'html,body{margin:0;padding:0;overflow:hidden;background:transparent}'\n                 + '.row{gap:0!important}';\n  document.head.appendChild(st);\n});\n/* ===== web公開用：?race= で1レースだけ描く ===== */\nfunction 選ぶ(list){\n  const q = parent.__RACE;\n  const hit = list.filter(x => x.race === q);\n  return hit.length ? hit : list.s \n}\n/* APIが書いた台詞があればそれを使う。無ければ元の文のまま */\nfunction serif(race, fallback){\n  const k = race + '|' + SLIDE_NO;\n  return (SERIF[k] && SERIF[k].text) ? SERIF[k].text : fallback;\n}\nfunction charaImg(race){\n  const c = parent.__CHARA || (CHARA[race] && CHARA[race].chara) || 'ginma';\n  const list = IMGS[c] || [];\n  if(!list.length) return './Images/ginma1.png';\n  // レース名から決まる数に、何枚目かを足してずらす（同じレースでも毎枚ちがう絵になる）\n  let h = 0; for(const ch of race) h = (h*31 + ch.codePointAt(0)) >>> 0;\n  return './画像/' + c + '/' + list[(h + SLIDE_NO*7) % list.length];\n}\n\nPromise.all([loadChara(),loadSerif()]).then(()=>fetch('./s7_show.json?v='+Date.now())).then(r=>r.json()).then(list=>{ list = 選ぶ(list);\n const row=document.getElementById('row');\n list.forEach(d=>{\n  const m0=d.main[0], a0=d.ana[0];\n  const rate=x=>(x.v/Math.max(x.o,1)).toFixed(1);\n  const ttl = (m0&&a0) ? `軸は<em>${m0.lab}<\/em>。穴なら<em>${a0.lab}<\/em>。`\n            : m0 ? `軸は<em>${m0.lab}<\/em>。穴に共通点は無し。`\n            : a0 ? `軸が立たない。穴は<em>${a0.lab}<\/em>。`\n                 : `絞れる条件は、<em>見つからなかった<\/em>。`;\n  const mainRows = d.main.length\n    ? d.main.slice(0,3).map(x=>`<div class=\"it\"><div class=\"l\">${x.lab}<\/div>\n        <div class=\"v\">${x.v}<span style=\"font-size:13px\">%<\/span><\/div>\n        <div class=\"s\">当てはまらない馬は${x.o}%（${rate(x)}倍）<\/div><\/div>`).join('')\n    : `<div class=\"none\">ひとつも無し<span>どの条件で切っても複勝率が横並び。人気どおりに決まりにくいレースです<\/span><\/div>`;\n  const anaRows = d.ana.length\n    ? d.ana.slice(0,3).map(x=>`<div class=\"it\"><div class=\"l\">${x.lab}<\/div>\n        <div class=\"v\">${x.ka}<span style=\"font-size:13px\">/${x.na}頭<\/span><\/div>\n        <div class=\"s\">${x.pa}%。来なかった組は${x.pb}%<\/div><\/div>`).join('')\n    : `<div class=\"none\">共通点は無し<span>来た穴馬がバラバラ。条件で絞らず手広く狙うレースです<\/span><\/div>`;\n\n  // ★まとめのコメント（数字から組み立てる。のちにAPIが口調だけ書き換える枠）\n  let talk;\n  if(m0&&a0){\n    talk = `<b>${m0.lab}<\/b>の複勝率が<b>${m0.v}%<\/b>。当てはまらない馬は${m0.o}%やから、`\n         + `その差は<b>${rate(m0)}倍<\/b>や。軸はここでええ。<br>`\n         + `いっぽう20倍以上で好走した${d.n_ana}頭を見ると、<u>${a0.ka}頭が${a0.lab}<\/u>。`\n         + `来なかった組は${a0.pb}%やった。<br>`\n         + `つまり<b>軸は人気の高いところ、穴は別の条件<\/b>で拾う。`\n         + `見る場所を分けるというわけだ。`;\n  }else if(a0){\n    talk = `堅く来ている条件は、ひとつも見つからんかった。`\n         + `人気どおりに決まりにくいレースや。<br>`\n         + `ただ20倍以上で好走した${d.n_ana}頭のうち<u>${a0.ka}頭が${a0.lab}<\/u>。`\n         + `来なかった組の${a0.pb}%より多い。<br>`\n         + `<b>軸は立てず、穴の条件から組み立てる<\/b>ほうが早いというわけだ。`;\n  }else if(m0){\n    talk = `<b>${m0.lab}<\/b>の複勝率が<b>${m0.v}%<\/b>で、それ以外の${m0.o}%の<b>${rate(m0)}倍<\/b>。`\n         + `軸はここでええ。<br>`\n         + `いっぽう穴馬のほうは共通点が見つからんかった。`\n         + `<b>軸を厚くして、あとは手広く<\/b>押さえるしかないというわけだ。`;\n  }else{\n    talk = `今年は、絞れる条件が見つからんかった。<br>`\n         + `${d.eds}回・${d.runs}走を調べて、どの条件も横並びや。`\n         + `<b>無いものを有るように言うのが一番あかん<\/b>。他を見たほうが早い。`;\n  }\n\n  row.insertAdjacentHTML('beforeend',`\n  <div class=\"slide\"><div class=\"tag\">${d.race}<\/div>\n    <div class=\"kicker\">SUMMARY / まとめ<\/div>\n    <div class=\"ttl\">${ttl}<\/div>\n    <div class=\"meta\">過去${d.eds}回・のべ${d.runs}走／20倍以上で好走した馬${d.n_ana}頭を集計<\/div>\n    <div class=\"top\">\n      <div class=\"card m\"><div class=\"ch\"><span class=\"bd\">本線<\/span>\n        <span class=\"ct\">堅く来ている条件<\/span><\/div>\n        <div class=\"cn\">数字は複勝率（3着以内に入った割合）<\/div>\n        <div class=\"body\">${mainRows}<\/div><\/div>\n      <div class=\"card a\"><div class=\"ch\"><span class=\"bd\">穴<\/span>\n        <span class=\"ct\">穴馬に多かった条件<\/span><\/div>\n        <div class=\"cn\">20倍以上で好走した${d.n_ana}頭のうち<\/div>\n        <div class=\"body\">${anaRows}<\/div><\/div>\n    <\/div>\n    <div class=\"bot\">\n      <div class=\"talk\"><div class=\"who\">${charaName(d.race)}<\/div><p>${serif(d.race, talk)}<\/p><\/div>\n      <div class=\"who2\"><img src=\"${charaImg(d.race)}\" alt=\"\"><\/div>\n    <\/div>\n    <div class=\"foot\">\n      <div class=\"cta\"><div class=\"big\">保存して、当日の出馬表と見くらべて。<\/div>\n        <div class=\"ic\">SAVE ↓<\/div><\/div>\n      <div class=\"dis\">\n        <p>※過去${d.eds}回の実測値です。とくに穴の条件は頭数が少ないので、法則ではなく手がかりとして。\n           あくまで予想です。馬券は自己責任で。<\/p>\n        <div class=\"brand\">AFRO HORSE<small>アフロ馬の競馬道場<\/small><\/div>\n      <\/div>\n    <\/div>\n  <\/div>`);\n });\n});\n<\/script><\/body><\/html>\n"];
const RACES = ["CBC賞", "NHKマイルC", "きさらぎ賞", "みやこS", "アイビスSD", "アメリカジョッキーCC", "アルゼンチン共和国杯", "アルテミスS", "アンタレスS", "エプソムC", "エリザベス女王杯", "エルムS", "オークス", "オーシャンS", "オールカマー", "カペラS", "キーンランドC", "クイーンC", "クイーンS", "サウジアラビアRC", "シリウスS", "シルクロードS", "シンザン記念", "ジャパンC", "ステイヤーズS", "スプリングS", "スプリンターズS", "スワンS", "セントウルS", "セントライト記念", "ターコイズS", "ダイヤモンドS", "ダービー卿CT", "チャレンジC", "チャンピオンズC", "チャーチルダウンズC", "チューリップ賞", "デイリー杯2歳S", "ニュージーランドT", "ファルコンS", "ファンタジーS", "フィリーズレビュー", "フェアリーS", "フェブラリーS", "フラワーC", "フローラS", "プロキオンS", "ホープフルS", "マイラーズC", "マイルCS", "マーチS", "マーメイドS", "ユニコーンS", "ラジオNIKKEI賞", "レパードS", "ローズS", "ヴィクトリアマイル", "七夕賞", "中京記念", "中山牝馬S", "中山記念", "中山金杯", "中日新聞杯", "京成杯", "京成杯AH", "京王杯2歳S", "京王杯スプリングC", "京都2歳S", "京都大賞典", "京都新聞杯", "京都記念", "京都金杯", "京阪杯", "共同通信杯", "函館2歳S", "函館スプリントS", "函館記念", "北九州記念", "大阪杯", "天皇賞・春", "天皇賞・秋", "安田記念", "宝塚記念", "富士S", "小倉2歳S", "小倉大賞典", "小倉記念", "平安S", "府中牝馬S", "弥生賞", "愛知杯", "新潟2歳S", "新潟大賞典", "新潟記念", "日本ダービー", "日経新春杯", "日経賞", "有馬記念", "朝日杯FS", "札幌2歳S", "札幌記念", "東京スポーツ杯2歳S", "東京新聞杯", "東海S", "根岸S", "桜花賞", "武蔵野S", "毎日杯", "毎日王冠", "皐月賞", "目黒記念", "神戸新聞杯", "福島牝馬S", "福島記念", "秋華賞", "紫苑S", "菊花賞", "葵S", "金鯱賞", "関屋記念", "阪急杯", "阪神C", "阪神JF", "阪神大賞典", "阪神牝馬S", "青葉賞", "高松宮記念", "鳴尾記念"];
const CN    = {"afuwa": "アフワ", "yancha": "やんちゃアフワ", "buruma": "ブルマ", "chafuwa": "チャフワ", "kurofuwa": "クロフワ", "ginma": "ギンマ"};
const $ = id => document.getElementById(id);
let CHARA_MAP = {};

RACES.forEach(r => $('race').add(new Option(r, r)));
$('chara').add(new Option('レースごとの担当（おまかせ）', ''));
Object.keys(CN).forEach(k => $('chara').add(new Option(CN[k], k)));
const q = new URLSearchParams(location.search).get('race');
if (q && RACES.includes(q)) $('race').value = q;

fetch('./担当キャラ.json?v=' + Date.now()).then(r => r.json())
  .then(m => { CHARA_MAP = m; draw(); }).catch(() => draw());

function draw(){
  window.__RACE  = $('race').value;
  window.__CHARA = $('chara').value;
  const c = CHARA_MAP[$('race').value];
  const key = $('chara').value || (c && c.chara) || 'ginma';
  $('info').innerHTML = '担当：<b>' + (CN[key] || '-') + '</b>'
    + (c && !$('chara').value ? '<br>' + c.why : '');
  const box = $('sheets');
  box.className = 'sheets ' + $('view').value;
  box.innerHTML = PAGES.map((_, i) =>
    '<div class="card"><h2>' + (i+1) + ' / 7'
    + '<button class="sub" data-one="' + i + '">この1枚を保存</button></h2>'
    + '<iframe id="f' + i + '"></iframe></div>').join('');
  PAGES.forEach((html, i) => {
    const d = $('f' + i).contentDocument;
    d.open(); d.write(html); d.close();
  });
  history.replaceState(null, '', '?race=' + encodeURIComponent($('race').value));
}
['race','chara','view'].forEach(id => $(id).onchange = draw);

function save(list){
  const ratio = $('ratio').value;
  list.forEach(i => { const f = $('f' + i);
    if (f) f.contentWindow.postMessage({cmd:'save', no:i+1, ratio}, '*'); });
}
$('dl').onclick = () => save([0,1,2,3,4,5,6]);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-one]');
  if (b) save([+b.dataset.one]);
});
window.addEventListener('message', e => {
  if (!e.data || e.data.cmd !== 'saved') return;
  const a = document.createElement('a');
  a.href = e.data.png;
  a.download = $('race').value + '_' + e.data.no + '.png';
  a.click();
});
</script></body></html>
