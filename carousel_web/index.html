<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFRO Horse｜カルーセル</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
 :root{--bg:#15120f;--bg2:#241e18;--accent:#e0562f;--accent2:#d9b271;--text:#f4efe6;--sub:#9d8d7c}
 *{margin:0;padding:0;box-sizing:border-box}
 body{background:#0b0b0b;color:var(--text);font-family:'Noto Sans JP',sans-serif;padding:14px}
 h1{font-family:'Dela Gothic One';font-size:19px}
 h1 span{color:var(--accent)}
 .bar{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap;margin:10px 0;
   background:var(--bg2);padding:10px 12px;border-radius:8px}
 .bar.top{position:sticky;top:6px;z-index:30}
 .bar label{font-size:10px;color:var(--sub);display:block;margin-bottom:3px;letter-spacing:.5px}
 select,button,input,textarea{font-family:inherit;font-size:13px;padding:7px 10px;
   border-radius:5px;border:0}
 select,input,textarea{background:#332b23;color:var(--text)}
 #key{min-width:200px}
 button{background:var(--accent);color:#fff;font-weight:900;cursor:pointer}
 button.sub{background:#3a322a;color:var(--text)}
 button:disabled{opacity:.5;cursor:default}
 /* レースを選ぶボタン */
 #pick{background:var(--accent2);color:#1a1510;font-size:15px;padding:9px 16px;
   display:flex;align-items:center;gap:9px}
 #pickT{background:#332b23;color:var(--text);display:flex;align-items:center;gap:8px}
 #pickT i{width:15px;height:15px;border-radius:4px;display:inline-block;border:1px solid #0006}
 #pickT::after{content:'▾';font-size:11px;color:var(--sub)}
 .tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;
   max-height:56vh;overflow:auto}
 .tlist button{background:#332b23;color:var(--text);text-align:left;font-weight:700;
   padding:8px 10px;display:flex;align-items:center;gap:8px}
 .tlist button.on{outline:2px solid var(--accent2)}
 .sw{width:34px;height:20px;border-radius:4px;flex-shrink:0;border:1px solid #0006;
   display:flex;overflow:hidden}
 .sw b{flex:1}
 #pick small{font-weight:400;font-size:11px;opacity:.75}
 #pick::after{content:'▾';font-size:12px}
 .info{margin-left:auto;font-size:11px;color:var(--sub);text-align:right;line-height:1.6}
 .info b{color:var(--accent2)}
 .getkey{display:block;margin-top:4px;font-size:10px;color:var(--accent2);text-decoration:none}
 .getkey:hover{text-decoration:underline}
 /* ポップアップ */
 .mask{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:none;
   padding:18px;overflow:auto}
 .mask.on{display:block}
 .modal{max-width:860px;margin:0 auto;background:var(--bg2);border-radius:10px;padding:16px}
 .modal .mh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
 .modal .mh b{font-family:'Dela Gothic One';font-size:16px}
 .modal .mh button{margin-left:auto}
 .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
 .filters input{flex:1;min-width:150px}
 .tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
 .tabs button{background:#332b23;color:var(--text);font-weight:700;font-size:12px;padding:6px 11px}
 .tabs button.on{background:var(--accent);color:#fff}
 .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px;
   max-height:52vh;overflow:auto}
 .list button{background:#332b23;color:var(--text);text-align:left;font-weight:700;
   padding:9px 11px;line-height:1.4}
 .list button.on{outline:2px solid var(--accent2)}
 .list button small{display:block;font-weight:400;font-size:10px;color:var(--sub);margin-top:2px}
 .none{color:var(--sub);font-size:12px;padding:16px}
 /* スライド */
 .sheets{display:flex;gap:12px;flex-wrap:wrap}
 .sheets.one{flex-direction:column;align-items:center}
 .card{background:var(--bg2);border-radius:8px;padding:7px;width:554px}
 .card h2{font-size:10px;color:var(--sub);margin-bottom:5px;font-weight:900;letter-spacing:1px;
   display:flex;align-items:center;gap:8px}
 .card h2 button{font-size:10px;padding:3px 7px;margin-left:auto}
 .frame{width:540px;height:675px;overflow:hidden;border-radius:4px;background:#15120f}
 iframe{width:540px;height:675px;border:0;display:block;background:#15120f;transform-origin:top left}
 .say{margin-top:6px}
 .say label{font-size:9.5px;color:var(--sub);display:flex;align-items:center;gap:6px;margin-bottom:3px}
 .say label button{font-size:9px;padding:2px 6px;margin-left:auto}
 .say textarea{width:100%;min-height:50px;line-height:1.6;resize:vertical;font-size:12px}
 @media(max-width:760px){
   body{padding:10px}
   .bar{gap:7px;padding:9px 10px}
   .sheets{gap:10px}
   .card{width:100%}
   .frame{width:100%;height:auto;aspect-ratio:540/675}
   .info{margin-left:0;text-align:left;width:100%}
   .modal{padding:12px}
   .list{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));max-height:44vh}
 }
</style></head><body>
<h1>AFRO <span>Horse</span>｜カルーセル</h1>

<div class="bar top">
  <div><label>レース</label><button id="pick">—</button></div>
  <div><label>キャラ</label><select id="chara"></select></div>
  <div><label>色</label><button id="pickT">—</button></div>
  <div><label>比率</label><select id="ratio">
    <option value="4:5">4:5（1080×1350）</option>
    <option value="1:1">1:1（1080×1080）</option></select></div>
  <div><label>並べ方</label><select id="view">
    <option value="row">横に並べる</option>
    <option value="one">たてに1枚ずつ</option></select></div>
  <div><button id="dl">7枚まとめて保存</button></div>
  <div class="info" id="info"></div>
</div>

<div class="bar">
  <div><label>Gemini APIキー</label>
    <input id="key" type="password" placeholder="AIzaSy…" autocomplete="off">
    <a class="getkey" href="https://aistudio.google.com/app/apikey" target="_blank"
       rel="noopener">aistudio.google.com で無料でもらえます →</a></div>
  <div><label>モデル</label><select id="model">
    <option value="gemini-2.5-flash">gemini-2.5-flash</option></select></div>
  <div><label>1分あたり</label><select id="rpm">
    <option value="4">4本（無料枠むけ）</option>
    <option value="9">9本</option>
    <option value="14">14本</option>
    <option value="60">制限なし</option></select></div>
  <div><button id="gen">7枚ぶん書かせる（前半＋後半）</button></div>
  <div><button class="sub" id="gen1">1〜4枚目だけ</button></div>
  <div><button class="sub" id="gen2">5〜7枚目だけ</button></div>
  <div><button class="sub" id="clr">台詞を元にもどす</button></div>
  <div class="info" id="apimsg">数字はこちらで決めています。APIには言い回しだけ書かせます</div>
</div>

<div class="sheets" id="sheets"></div>

<div class="mask" id="maskT">
  <div class="modal">
    <div class="mh"><b>色を選ぶ</b><span id="cntT" class="info"></span>
      <button class="sub" id="closeT">閉じる</button></div>
    <div class="tlist" id="tlist"></div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="mh"><b>レースを選ぶ</b><span id="cnt" class="info"></span>
      <button class="sub" id="close">閉じる</button></div>
    <div class="filters">
      <input id="q" placeholder="レース名で探す（例：記念）" autocomplete="off">
      <select id="grade"></select>
    </div>
    <div class="tabs" id="months"></div>
    <div class="list" id="list"></div>
  </div>
</div>

<script>
const PAGES = ["<!DOCTYPE html>\n<html lang=\"ja\">\n<head><meta charset=\"UTF-8\"><title>v5 表紙8種<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;700;900&family=Bebas+Neue&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{--bg:#15120f;--bg2:#241e18;--accent:#e0562f;--accent2:#d9b271;--text:#f4efe6;--sub:#9d8d7c;--m6:rgb(34,31,28);--m9:rgb(41,38,34);--m13:rgb(50,47,43);--m16:rgb(57,53,49);--m24:rgb(75,71,67);--a10:rgb(41,25,18);--a11:rgb(43,25,19);--a12:rgb(45,26,19);--a14:rgb(49,28,19);--a15:rgb(51,28,20);--a30:rgb(82,38,25);--a40:rgb(102,45,28);--b11:rgb(43,36,26);--b18:rgb(56,47,33);--s10:rgb(35,30,26);}\n  *{margin:0;padding:0;box-sizing:border-box}\n  body{background:#0b0b0b;padding:20px;font-family:'Noto Sans JP',sans-serif}\n  .row{display:flex;gap:16px;flex-wrap:wrap}\n  .slide{width:540px;min-width:540px;height:675px;flex:none;background:var(--bg);color:var(--text);\n    position:relative;overflow:hidden;display:flex;flex-direction:column;padding:28px 32px 24px}\n  .slide::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;\n    background:linear-gradient(90deg,var(--accent) 0%,var(--accent2) 100%);z-index:3}\n  .slash{position:absolute;left:-90px;top:222px;width:760px;height:190px;\n    background:linear-gradient(180deg,var(--a11),transparent);transform:rotate(-6deg);z-index:0}\n  .head{display:flex;justify-content:space-between;align-items:center;z-index:2}\n  .brand{font-family:'Bebas Neue';font-size:15px;letter-spacing:5px;color:var(--accent2)}\n  .grade{font-family:'Dela Gothic One';font-size:12px;letter-spacing:2px;background:var(--accent);\n    color:#fff;padding:4px 11px;border-radius:2px}\n  .when{margin-top:20px;font-size:12.5px;letter-spacing:1.5px;color:var(--sub);z-index:2}\n  .race{font-family:'Dela Gothic One';font-size:41px;line-height:1.06;margin-top:5px;z-index:2}\n  .rule{width:56px;height:4px;background:var(--accent2);margin-top:12px;z-index:2}\n  .hook{margin-top:auto;z-index:2;display:flex;align-items:flex-end;gap:6px}\n  .hook-l{flex:1;min-width:0}\n  .hook-r{width:196px;flex-shrink:0;margin-right:-22px;margin-bottom:-14px;\n    filter:drop-shadow(4px 7px 12px rgba(0,0,0,.5))}\n  .hook-r img{width:100%;height:auto;display:block}\n  .hook-lead{font-size:16px;font-weight:700;letter-spacing:.5px}\n  .hook-main{display:flex;align-items:baseline;gap:12px;margin-top:-4px}\n  .hook-num{font-family:'Bebas Neue';line-height:1;color:var(--accent);letter-spacing:-2px;\n    text-shadow:0 8px 30px var(--a30)}\n  .hook-unit{font-family:'Dela Gothic One';font-size:26px;letter-spacing:1px;white-space:nowrap}\n  /* ★「回」のような1文字の漢字は Dela Gothic One だと中が潰れて□に見えるので細めの書体にする */\n  .hook-unit.one{font-family:'Noto Sans JP';font-weight:700;font-size:30px;letter-spacing:0}\n  .hook-sub{font-size:13px;font-weight:700;line-height:1.7;border-left:3px solid var(--accent2);\n    padding-left:12px;margin-top:10px}\n  .chart{margin-top:auto;margin-bottom:2px;z-index:2}\n  .chart-ttl{font-size:10.5px;color:var(--sub);letter-spacing:1.5px;margin-bottom:7px}\n  .bars{display:flex;align-items:flex-end;gap:6px;height:80px}\n  .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}\n  .bar .v{width:100%;background:var(--m24);border-radius:2px 2px 0 0}\n  .bar.hot .v{background:var(--accent)}\n  .bar .n{font-family:'Bebas Neue';font-size:11.5px;color:var(--sub);line-height:1}\n  .bar.hot .n{color:var(--accent);font-size:13px}\n  .yrs{display:flex;gap:6px;margin-top:5px}\n  .yr{flex:1;text-align:center;font-family:'Bebas Neue';font-size:9px;color:var(--sub)}\n  .foot{display:flex;align-items:flex-end;z-index:2;margin-top:18px}\n  .foot-txt{flex:1;background:var(--bg2);border-left:3px solid var(--accent);padding:11px 14px;\n    border-radius:3px;display:flex;justify-content:space-between;align-items:flex-end}\n  .foot-txt .t1{font-size:12.5px;font-weight:700;line-height:1.55}\n  .foot-txt .t1 b{color:var(--accent2);font-weight:900}\n  .foot-txt .t2{font-size:10.5px;color:var(--sub);letter-spacing:1px;white-space:nowrap;padding-left:10px}\n  .tag{display:none;position:absolute;top:8px;left:8px;background:#fff;color:#000;font-size:10.5px;\n    padding:2px 8px;border-radius:2px;z-index:9;font-weight:900}\n<\/style><\/head>\n<body><div class=\"row\" id=\"row\"><\/div>\n<script>\n/* web公開では1枚だけを枠いっぱいに出す（余白とスクロールを消す） */\ndocument.addEventListener('DOMContentLoaded', () => {\n  const st = document.createElement('style');\n  st.textContent = 'html,body{margin:0;padding:0;overflow:hidden;background:transparent}'\n                 + '.row{gap:0!important}';\n  document.head.appendChild(st);\n});\n/* ===== web公開用：?race= で1レースだけ描く ===== */\n/* 親（APIで書かせた分）を優先し、無ければサーバーの台詞.json */\nconst _origSerif = window.serif;\nwindow.serif = (race, fb) => {\n  const k = race + '|' + SLIDE_NO;\n  const a = parent.__SERIF && parent.__SERIF[k];\n  if (a && a.text) return a.text;\n  return _origSerif(race, fb);\n};\nfunction 選ぶ(list){\n  const q = parent.__RACE;\n  const hit = list.filter(x => x.race === q);\n  return hit.length ? hit : list.slice(0,1);\n}\n\n/* 親ページから「保存して」と言われたら、この1枚をPNGにして返す */\nwindow.addEventListener('message', async e => {\n  if(!e.data || e.data.cmd !== 'save') return;\n  if(!window.html2canvas){\n    await new Promise(r => { const s=document.createElement('script');\n      s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';\n      s.onload=r; document.head.appendChild(s); });\n  }\n  const el = document.querySelector('.slide');\n  if(!el) return;\n  const H = e.data.ratio === '1:1' ? 540 : 675;\n  el.style.height = H + 'px'; el.style.width = '540px';\n  const c = await html2canvas(el, {scale:2, width:540, height:H, backgroundColor:null});\n  parent.postMessage({cmd:'saved', no:e.data.no, png:c.toDataURL('image/png')}, '*');\n});\n\n/* ===== レースごとの担当キャラ（1レース＝1キャラ、7枚とも同じ） ===== */\nconst SLIDE_NO = 1;\nlet CHARA = {}, IMGS = {};\nasync function loadChara(){\n  [CHARA, IMGS] = aw ;\n  return (SERIF[k] && SERIF[k].text) ? SERIF[k].text : fallback;\n}\nfunction charaImg(race){\n  const c = parent.__CHARA || (CHARA[race] && CHARA[race].chara) || 'ginma';\n  const list = IMGS[c] || [];\n  if(!list.length) return './Images/ginma1.png';\n  // レース名から決まる数に、何枚目かを足してずらす（同じレースでも毎枚ちがう絵になる）\n  let h = 0; for(const ch of race) h = (h*31 + ch.codePointAt(0)) >>> 0;\n  return './画像/' + c + '/' + list[(h + SLIDE_NO) % list.length];\n}\n\nPromise.all([loadChara(),loadSerif()]).then(()=>fetch('./s7_show.json?v='+Date.now())).then(r=>r.json()).then(list=>{ list = 選ぶ(list);\n const row=document.getElementById('row');\n list.forEach(d=>{\n  const m0=d.main[0], a0=d.ana[0];\n  const rate=x=>(x.v/Math.max(x.o,1)).toFixed(1);\n  const ttl = (m0&&a0) ? `軸は<em>${m0.lab}<\/em>。穴なら<em>${a0.lab}<\/em>。`\n            : m0 ? `軸は<em>${m0.lab}<\/em>。穴に共通点は無し。`\n            : a0 ? `軸が立たない。穴は<em>${a0.lab}<\/em>。`\n                 : `絞れる条件は、<em>見つからなかった<\/em>。`;\n  const mainRows = d.main.length\n    ? d.main.slice(0,3).map(x=>`<div class=\"it\"><div class=\"l\">${x.lab}<\/div>\n        <div class=\"v\">${x.v}<span style=\"font-size:13px\">%<\/span><\/div>\n        <div class=\"s\">当てはまらない馬は${x.o}%（${rate(x)}倍）<\/div><\/div>`).join('')\n    : `<div class=\"none\">ひとつも無し<span>どの条件で切っても複勝率が横並び。人気どおりに決まりにくいレースです<\/span><\/div>`;\n  const anaRows = d.ana.length\n    ? d.ana.slice(0,3).map(x=>`<div class=\"it\"><div class=\"l\">${x.lab}<\/div>\n        <div class=\"v\">${x.ka}<span style=\"font-size:13px\">/${x.na}頭<\/span><\/div>\n        <div class=\"s\">${x.pa}%。来なかった組は${x.pb}%<\/div><\/div>`).join('')\n    : `<div class=\"none\">共通点は無し<span>来た穴馬がバラバラ。条件で絞らず手広く狙うレースです<\/span><\/div>`;\n\n  // ★まとめのコメント（数字から組み立てる。のちにAPIが口調だけ書き換える枠）\n  let talk;\n  if(m0&&a0){\n    talk = `<b>${m0.lab}<\/b>の複勝率が<b>${m0.v}%<\/b>。当てはまらない馬は${m0.o}%やから、`\n         + `その差は<b>${rate(m0)}倍<\/b>や。軸はここでええ。<br>`\n         + `いっぽう20倍以上で好走した${d.n_ana}頭を見ると、<u>${a0.ka}頭が${a0.lab}<\/u>。`\n         + `来なかった組は${a0.pb}%やった。<br>`\n         + `つまり<b>軸は人気の高いところ、穴は別の条件<\/b>で拾う。`\n         + `見る場所を分けるというわけだ。`;\n  }else if(a0){\n    talk = `堅く来ている条件は、ひとつも見つからんかった。`\n         + `人気どおりに決まりにくいレースや。<br>`\n         + `ただ20倍以上で好走した${d.n_ana}頭のうち<u>${a0.ka}頭が${a0.lab}<\/u>。`\n         + `来なかった組の${a0.pb}%より多い。<br>`\n         + `<b>軸は立てず、穴の条件から組み立てる<\/b>ほうが早いというわけだ。`;\n  }else if(m0){\n    talk = `<b>${m0.lab}<\/b>の複勝率が<b>${m0.v}%<\/b>で、それ以外の${m0.o}%の<b>${rate(m0)}倍<\/b>。`\n         + `軸はここでええ。<br>`\n         + `いっぽう穴馬のほうは共通点が見つからんかった。`\n         + `<b>軸を厚くして、あとは手広く<\/b>押さえるしかないというわけだ。`;\n  }else{\n    talk = `今年は、絞れる条件が見つからんかった。<br>`\n         + `${d.eds}回・${d.runs}走を調べて、どの条件も横並びや。`\n         + `<b>無いものを有るように言うのが一番あかん<\/b>。他を見たほうが早い。`;\n  }\n\n  row.insertAdjacentHTML('beforeend',`\n  <div class=\"slide\"><div class=\"tag\">${d.race}<\/div>\n    <div class=\"kicker\">SUMMARY / まとめ<\/div>\n    <div class=\"ttl\">${ttl}<\/div>\n    <div class=\"meta\">過去${d.eds}回・のべ${d.runs}走／20倍以上で好走した馬${d.n_ana}頭を集計<\/div>\n    <div class=\"top\">\n      <div class=\"card m\"><div class=\"ch\"><span class=\"bd\">本線<\/span>\n        <span class=\"ct\">堅く来ている条件<\/span><\/div>\n        <div class=\"cn\">数字は複勝率（3着以内に入った割合）<\/div>\n        <div class=\"body\">${mainRows}<\/div><\/div>\n      <div class=\"card a\"><div class=\"ch\"><span class=\"bd\">穴<\/span>\n        <span class=\"ct\">穴馬に多かった条件<\/span><\/div>\n        <div class=\"cn\">20倍以上で好走した${d.n_ana}頭のうち<\/div>\n        <div class=\"body\">${anaRows}<\/div><\/div>\n    <\/div>\n    <div class=\"bot\">\n      <div class=\"talk\"><div class=\"who\">${charaName(d.race)}<\/div><p>${serif(d.race, talk)}<\/p><\/div>\n      <div class=\"who2\"><img src=\"${charaImg(d.race)}\" alt=\"\"><\/div>\n    <\/div>\n    <div class=\"foot\">\n      <div class=\"cta\"><div class=\"big\">保存して、当日の出馬表と見くらべて。<\/div>\n        <div class=\"ic\">SAVE ↓<\/div><\/div>\n      <div class=\"dis\">\n        <p>※過去${d.eds}回の実測値です。とくに穴の条件は頭数が少ないので、法則ではなく手がかりとして。\n           あくまで予想です。馬券 let THEMES = {}, THEME = localStorage.getItem('afro_theme') || '';   // '' はおまかせ
function 自動テーマ(){
  const x = META[RACE] || {};
  if (x.grade === 'G1') return 'g1gold';
  const m = +x.month;
  if (m >= 3 && m <= 5)  return 'spring';
  if (m >= 6 && m <= 8)  return 'summer';
  if (m >= 9 && m <= 11) return 'autumn';
  return 'winter';
}

/* ★html2canvas は color-mix() を読めない（書き出しが落ちる）。
   　 混ぜた色は親で計算して、具体的な rgb() として流し込む */
const 混ぜ = [['m',6],['m',9],['m',13],['m',16],['m',24],
              ['a',10],['a',11],['a',12],['a',14],['a',15],['a',30],['a',40],
              ['b',11],['b',18],['s',10]];
function rgb(h){
  h = String(h || '').trim().replace('#','');
  if (h.length === 3) h = [...h].map(c => c + c).join('');
  return [0,2,4].map(i => parseInt(h.slice(i, i+2), 16) || 0);
}
function 混色(fg, bg, p){
  return 'rgb(' + fg.map((f,i) => Math.round(f*p + bg[i]*(1-p))).join(',') + ')';
}
function テーマCSS(k){
  const v = (THEMES[k] || {}).vars || {};
  const base = {m: v['--text'], a: v['--accent'], b: v['--accent2'], s: v['--text-sub']};
  const bg = rgb(v['--bg']);
  let css = ':root{' + ['--bg','--bg2','--accent','--accent2','--text']
      .map(n => v[n] ? n + ':' + v[n] + ';' : '').join('')
    + (v['--text-sub'] ? '--sub:' + v['--text-sub'] + ';' : '');
  混ぜ.forEach(([t, p]) => {
    if (base[t]) css += `--${t}${p}:${混色(rgb(base[t]), bg, p/100)};`;
  });
  return css + '}';
}

  const b = e.target.closest('[data-reset]'); if (!b) return;
  delete SERIF_LOCAL[RACE + '|' + b.dataset.reset];
  localStorage.setItem('afro_serif', JSON.stringify(SERIF_LOCAL));
  draw();
});

/* ===== スマホ：枠に合わせて縮める ===== */
function fit(){
  document.querySelectorAll('.frame').forEach(fr => {
    const w = fr.clientWidth || 540;
    const k = Math.min(1, w / 540);
    const f = fr.querySelector('iframe');
    if (f) f.style.transform = 'scale(' + k + ')';
    if (k < 1) fr.style.height = Math.round(675 * k) + 'px';
  });
}
window.addEventListener('resize', fit);

/* ===== APIで台詞を書かせる ===== */
let ORDER = null, SETTING = null;
/* ★無料枠は1分あたりの本数に上限がある。投げた時刻を覚えて、超えそうなら待つ */
const CALLS = [];
const 眠る = ms => new Promise(r => setTimeout(r, ms));
async function 待機(ms, なぜ){
  const end = Date.now() + ms;
  while (Date.now() < end){
    $('apimsg').textContent = なぜ + '（あと ' + Math.ceil((end - Date.now())/1000) + ' 秒）';
    await 眠る(500);
  }
}
async function 順番待ち(){
  const limit = +$('rpm').value;
  for(;;){
    const now = Date.now();
    while (CALLS.length && now - CALLS[0] > 60000) CALLS.shift();
    if (CALLS.length < limit) return;
    await 待機(60000 - (now - CALLS[0]) + 700, '1分あたりの上限に当たらないよう待っています');
  }
}
$('key').value = localStorage.getItem('afro_gemini_key') || '';
$('key').onchange = () => localStorage.setItem('afro_gemini_key', $('key').value.trim());
['model','rpm'].forEach(id => {
  const v = localStorage.getItem('afro_' + id);
  if (v) $(id).value = v;
  $(id).onchange = () => localStorage.setItem('afro_' + id, $(id).value);
});

function 違反する数字(text, ok){
  const allow = new Set(ok);
  for (let y = 2015; y <= 2030; y++) allow.add(String(y));
  return (text.match(/\d+(?:\.\d+)?/g) || []).filter(m => !allow.has(m));
}
/* ★7枚ぶんをまとめて1回で書かせる（無料枠は1分5本なので、7本投げると弾かれる） */
function プロンプト(仕事, c, ng){
  const 枠 = 仕事.map(x => `【${x.no}枚目】
役割：${x.o.r}
長さ：${x.o.j}・${x.o.b}
触れてよい事実：
${x.o.f.map(y => '　・' + y).join('\n')}
使ってよい数字：${x.o.n.join(' ')}`).join('\n\n');
  return `あなたは競馬サイト「AFRO Horse」のキャラクター「${c.名前}」です。
インスタのカルーセル（7枚）に入れる台詞を、まとめて書いてください。

【あなたの設定】
立場：${c.立場}／性別：${c.性別}
性格：${c.性格.join('、')}
好き：${c.好き.join('、')}
人物像：${c.説明}
口調：${c['口調（推定）']}
やらないこと：${c.やらないこと}

${枠}

【守ること】
・各枠の「使ってよい数字」に無い数字を、その枠の文に出さないこと。
　計算し直したり丸めたりしない。数字を出さずに書いても構いません。
・他の枠の数字を持ち込まないこと。
${ng.map(x => '・' + x).join('\n')}
・7枚を通して同じ言い回しを繰り返さないこと。
・強調したい語は <b>〜</b> で囲んで構いません（1枚に2箇所まで）。

出力はJSONだけ。説明もかぎ括弧も付けないでください。
{${仕事.map(x => `"${x.no}":"台詞"`).join(',')}}`;
}
/* ★モデル名は推測で書かない。APIに「使えるもの」を聞く
   （gemini-2.5-flash-lite のように提供が終わる名前があるため） */
let MODELS = [];
async function モデル一覧(key){
  if (MODELS.length) return MODELS;
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?key='
    + encodeURIComponent(key) + '&pageSize=200');
  const d = await r.json();
  if (d.error) throw new Error(d.error.message);
  MODELS = (d.models || [])
    .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => m.name.replace('models/', ''))
    .filter(n => /gemini/.test(n) && !/vision|embedding|aqa|tts|image|live|native-audio/.test(n));
  // 速くて安いものを先に
  const 順 = n => (/flash-lite/.test(n) ? 0 : /flash/.test(n) ? 1 : /pro/.test(n) ? 3 : 2)
                + (/preview|exp/.test(n) ? 0.5 : 0);
  MODELS.sort((a, b) => 順(a) - 順(b) || a.localeCompare(b));
  const sel = $('model'), 前 = localStorage.getItem('afro_model');
  sel.innerHTML = MODELS.map(n => `<option value="${n}">${n}</option>`).join('');
  if (前 && MODELS.includes(前)) sel.value = 前;
  return MODELS;
}
$('key').addEventListener('change', () => 一覧を読む(true));
function 一覧を読む(しらせる){
  const k = $('key').value.trim();
  if (!k) return;
  モデル一覧(k).then(m => {
    if (しらせる) $('apimsg').innerHTML = `使えるモデル <b>${m.length}</b> 件を読み込みました`;
  }).catch(e => {
    if (しらせる) $('apimsg').textContent = 'モデル一覧が取れません：' + e.message.slice(0,120);
  });
}
/* キーを覚えているなら、開いたときに静かに一覧を取っておく */
setTimeout(() => 一覧を読む(false), 300);
async function 叩く(key, text, temp){
  const 今 = $('model').value || 'gemini-2.5-flash';
  const 試す = [今].concat(MODELS.filter(m => m !== 今)).filter(Boolean);
  let 待った = false;
  for (const model of 試す){
    for (let 回 = 0; 回 < 2; 回++){
      await 順番待ち();
      CALLS.push(Date.now());
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'
        + model + ':generateContent?key=' + encodeURIComponent(key),
        {method:'POST', headers:{'Content-Type':'application/json'},
         body: JSON.stringify({contents:[{parts:[{text}]}],
           /* ★7枚ぶんはv4の項目より長い。枠を広げ、「考える」ぶんは切って出力に回す */
           generationConfig:{responseMimeType:'application/json',
                             maxOutputTokens:8192, temperature:temp,
                             thinkingConfig:{thinkingBudget:0}}})});
      const d = await r.json().catch(() => ({}));
      if (r.status === 429 || (d.error && d.error.code === 429)){
        $('apimsg').textContent = model + ' が上限。別のモデルを試します…';
        break;                       // ★待たずに次のモデルへ
      }
      if (d.error){
        if (/no longer available|not found|not supported/i.test(d.error.message)){
          $('apimsg').textContent = model + ' は使えません。別のモデルを試します…';
          MODELS = MODELS.filter(x => x !== model);
          break;                     /* ★消えたモデルは一覧から外して次へ */
        }
        throw new Error(d.error.message);
      }
      const c = (d.candidates || [])[0];
      if (!c) throw new Error('返事が空です');
      const t = (c.content && c.content.parts || []).map(p => p.text || '').join('').trim();
      if (c.finishReason === 'MAX_TOKENS') throw new Error('MAX_TOKENS');
      if (c.finishReason && c.finishReason !== 'STOP')
        throw new Error('返事が途中で切れました（' + c.finishReason + '）');
      if (!t) throw new Error('返事が空でした');
      if (model !== $('model').value)
        $('apimsg').textContent = model + ' で書けました';
      return t;
    }
  }
  // どのモデルも上限だったときだけ待つ
  if (!待った){
    await 待機(62000, 'どのモデルも上限です。枠が空くのを待っています');
    待った = true;
    return 叩く(key, text, temp);
  }
  throw new Error('どのモデルも上限のままでした');
}
/* 1回で書かせる。長すぎて切れたら半分ずつに分けて投げ直す */
async function 書く(key, 仕事, c, temp){
  const 出来 = {};
  try {
    const 返事 = await 叩く(key, プロンプト(仕事, c, ORDER.禁止), temp);
    const 中身 = JSON.parse(返事.replace(/```json|```/g, '').trim());
    仕事.forEach(x => {
      const t = String(中身[x.no] || 中身[String(x.no)] || '').replace(/\n/g, '').trim();
      if (t) 出来[x.no] = t;
    });
    return 出来;
  } catch (e) {
    const 長すぎ = /MAX_TOKENS/.test(String(e.message));
    if (!長すぎ || 仕事.length < 2) throw e;
    const 半 = Math.ceil(仕事.length / 2);
    $('apimsg').textContent = '返事が長すぎたので、' + 仕事.length + '枚を分けて書かせます…';
    const a = await 書く(key, 仕事.slice(0, 半), c, temp);
    const b = await 書く(key, 仕事.slice(半), c, temp);
    return Object.assign(a, b);
  }
}
async function 生成(範囲, ラベル){
  const key = $('key').value.trim();
  if (!key) { $('apimsg').textContent = 'APIキーを入れてください'; return; }
  localStorage.setItem('afro_gemini_key', key);
  try { await モデル一覧(key); } catch (e) {}
  if (!ORDER)   ORDER   = await fetch('./台詞注文.json?v=' + Date.now()).then(r => r.json());
  if (!SETTING) SETTING = await fetch('./キャラ設定.json?v=' + Date.now()).then(r => r.json());
  const over = $('chara').value;
  const 全部 = [];
  for (let no = 1; no <= 7; no++){
    const o = ORDER.注文[RACE + '|' + no];
    if (o && 範囲.includes(no)) 全部.push({no, o});
  }
  if (!全部.length) { $('apimsg').textContent = 'このレースの注文書がありません'; return; }
  const c = SETTING[over || 全部[0].o.c];
  ['gen','gen1','gen2'].forEach(id => $(id).disabled = true);

  let ok = 0, 残り = 全部;
  for (let 回 = 0; 回 <= 2 && 残り.length; 回++){
    $('apimsg').textContent = (回 === 0 ? ラベル : '数字が合わなかった分を書き直し中…')
      + `${c.名前} が ${残り.length} 枚ぶん考え中…`;
    let 出来;
    try { 出来 = await 書く(key, 残り, c, 0.9 - 0.2 * 回); }
    catch (e) {
      const m = String(e.message);
      $('apimsg').textContent =
        /quota|429/i.test(m) ? '回数の上限です。少し待ってからやり直してください'
        : /MAX_TOKENS/.test(m) ? '返事が長すぎました。「1〜4枚目だけ」「5〜7枚目だけ」で分けてお試しください'
        : '通信に失敗：' + m.slice(0, 200);
      ['gen','gen1','gen2'].forEach(id => $(id).disabled = false);
      draw(); return;
    }
    const 次 = [];
    残り.forEach(x => {
      const t = 出来[x.no];
      if (!t) { 次.push(x); return; }
      if (違反する数字(t, x.o.n).length) { 次.push(x); return; }
      SERIF_LOCAL[RACE + '|' + x.no] = {text: t}; ok++;
    });
    残り = 次;
  }
  localStorage.setItem('afro_serif', JSON.stringify(SERIF_LOCAL));
  ['gen','gen1','gen2'].forEach(id => $(id).disabled = false);
  draw();
  return {ok, ng: 残り.length};
}
$('gen1').onclick = async () => {
  const r = await 生成([1,2,3,4], '');
  if (r) $('apimsg').innerHTML = `1〜4枚目：書けた <b>${r.ok}</b> 枚`
    + (r.ng ? `／不採用 ${r.ng} 枚` : '') + `　＜APIは ${CALLS.length} 回＞`;
};
$('gen2').onclick = async () => {
  const r = await 生成([5,6,7], '');
  if (r) $('apimsg').innerHTML = `5〜7枚目：書けた <b>${r.ok}</b> 枚`
    + (r.ng ? `／不採用 ${r.ng} 枚` : '') + `　＜APIは ${CALLS.length} 回＞`;
};
$('gen').onclick = async () => {
  /* ★7枚を一度に投げると返事が長すぎて切れるので、最初から前半・後半に分ける */
  const a = await 生成([1,2,3,4], '前半（1〜4枚目）／');
  if (!a) return;
  const b = await 生成([5,6,7], '後半（5〜7枚目）／');
  if (!b) return;
  $('apimsg').innerHTML = `書けた <b>${a.ok + b.ok}</b> 枚`
    + ((a.ng + b.ng) ? `／数字が合わず不採用 ${a.ng + b.ng} 枚（元の文のまま）` : '')
    + `　＜APIは ${CALLS.length} 回＞`;
};
$('clr').onclick = () => {
  Object.keys(SERIF_LOCAL).forEach(k => {
    if (k.startsWith(RACE + '|')) delete SERIF_LOCAL[k]; });
  localStorage.setItem('afro_serif', JSON.stringify(SERIF_LOCAL));
  $('apimsg').textContent = 'このレースの台詞を元にもどしました';
  draw();
};

/* ===== 保存 ===== */
function save(list){
  const ratio = $('ratio').value;
  list.forEach(i => { const f = $('f' + i);
    if (f) f.contentWindow.postMessage({cmd:'save', no:i+1, ratio}, '*'); });
}
$('dl').onclick = () => save([0,1,2,3,4,5,6]);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-one]');
  if (b) save([+b.dataset.one]);
});
window.addEventListener('message', e => {
  if (!e.data || e.data.cmd !== 'saved') return;
  const a = document.createElement('a');
  a.href = e.data.png;
  a.download = RACE + '_' + e.data.no + '.png';
  a.click();
});
