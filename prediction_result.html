    }
  });
  allG25.sort((a,b) => {
    const da=(a.race.date_label||''); const db=(b.race.date_label||'');
    if(da!==db) return da<db?-1:1;
    if(a.race.place!==b.race.place) return a.race.place<b.race.place?-1:1;
    const ra=parseInt(a.race.r)||0; const rb=parseInt(b.race.r)||0;
    if(ra!==rb) return ra-rb;
    return (parseInt(a.h.bango)||0)-(parseInt(b.h.bango)||0);
  });
  if (allG25.length === 0) {
    g25List.innerHTML = '<p class="no-bet">差8%以上×7倍以上の馬はありません</p>';
    return;
  }
  let html = `<p style="color:var(--muted);font-size:.73rem;margin-bottom:8px;">${allG25.length}頭　差8%以上（当日オッズ7倍以上で買い）</p>`;
  allG25.forEach(function(item) {
    const race=item.race, h=item.h, comp=item.comp, diff8=item.diff8||0;
    const oddsStr = h.odds ? h.odds.toFixed(1)+'倍' : '当日確認';
    const bothOk = (h.gbm_prob||0) >= 0.25;
    const nameColor = bothOk ? '#e84b4b' : 'var(--text)';
    const borderColor = bothOk ? '#e84b4b' : '#e8a44b';
    html += `<div class="bet-item" style="border-left:4px solid ${borderColor}">
      <div class="bet-left">
        <span class="bet-race">${race.place} ${race.r}R　${race.race_name}</span>
        <span class="bet-horse"><span style="color:${borderColor}">★</span> [${h.bango||'?'}番] <span style="color:${nameColor};font-weight:700">${h.name}</span>　<span style="color:#e84b4b;font-weight:700">GBM ${((h.gbm_prob||0)*100).toFixed(1)}%</span></span>
        <span class="bet-prob" style="color:var(--muted)">差${(diff8*100).toFixed(0)}%　オッズ${oddsStr}　7倍以上なら単勝買い</span>
      </div>
    </div>`;
  });
  g25List.innerHTML = html;
}

function updateG22List() {
  const g22List = document.getElementById('g22List');
  if (!g22List) return;
  let allG25 = [];
  RACES.forEach(race => {
    if (race.is_jump || race.is_shinnma) return;
    if (curDate !== 'all' && (race.date_label||'') !== curDate) return;
    const s = raceSettings[race.race_id];
    const horses = race.horses.map(h => ({...h, cur_score: getScore(h, s.baba, s.ptype)}));
    const maxScB = Math.max(...horses.map(h => h.cur_score), 0.001);
    const minScB = Math.min(...horses.map(h => h.cur_score));
    const scR = maxScB - minScB || 0.001;
    const senkoArr = horses.map(h => h.avg_senko||0.5);
    const sMin = Math.min(...senkoArr); const sMax = Math.max(...senkoArr); const sR = sMax-sMin||0.001;
    horses.forEach(h => {
      if ((h.gbm_prob||0) >= 0.25) {
        const cur = h.cur_score;
        const normSc = Math.max(0,(cur-minScB))/scR;
        const senko = h.avg_senko||0.5;
        let pb = 0.5;
        if (sR>0.01) {
          if (s.ptype==='slow') pb=1.0-(senko-sMin)/sR;
          else if (s.ptype==='fast') pb=(senko-sMin)/sR;
        }
        const comp = (h.gbm_prob||0)*0.70 + normSc*0.20 + pb*0.10;
        allG25.push({race: race, h: h, comp: comp});
      }
    });
  });
  allG25.sort((a,b) => {
    const da=(a.race.date_label||''); const db=(b.race.date_label||'');
    if(da!==db) return da<db?-1:1;
    if(a.race.place!==b.race.place) return a.race.place<b.race.place?-1:1;
    const ra=parseInt(a.race.r)||0; const rb=parseInt(b.race.r)||0;
    if(ra!==rb) return ra-rb;
    return (parseInt(a.h.bango)||0)-(parseInt(b.h.bango)||0);
  });
  if (allG25.length === 0) {
    g22List.innerHTML = '<p class="no-bet">GBM25%以上の馬はありません</p>';
    return;
  }
  let html = `<p style="color:var(--muted);font-size:.73rem;margin-bottom:8px;">${allG25.length}頭</p>`;
  allG25.forEach(function(item) {
    const race=item.race, h=item.h, comp=item.comp;
    const gbmPct = ((h.gbm_prob||0)*100).toFixed(1);
    const oddsStr = h.odds ? h.odds.toFixed(1)+'倍' : '当日確認';
    // 差8%も満たすか確認
    const raceHorses = race.horses ? [...race.horses].sort((a,b)=>(b.gbm_prob||0)-(a.gbm_prob||0)) : [];
    const diff8chk = raceHorses.length>=2 ? (raceHorses[0].gbm_prob||0)-(raceHorses[1].gbm_prob||0) : 0;
    const isAlsoTop = raceHorses.length>0 && raceHorses[0].name===h.name && diff8chk>=0.08;
    const nameColor2 = isAlsoTop ? '#e84b4b' : 'var(--text)';
    const borderColor2 = isAlsoTop ? '#e84b4b' : '#e8a44b';
    html += `<div class="bet-item" style="border-left:4px solid ${borderColor2}">
      <div class="bet-left">
        <span class="bet-race">${race.place} ${race.r}R　${race.race_name}</span>
        <span class="bet-horse"><span style="color:${borderColor2}">★</span> [${h.bango||'?'}番] <span style="color:${nameColor2};font-weight:700">${h.name}</span>　<span style="color:#e84b4b;font-weight:700">GBM ${gbmPct}%</span></span>
        <span class="bet-prob" style="color:var(--muted)">オッズ${oddsStr}　7倍以上なら単勝買い</span>
      </div>
    </div>`;
  });
  g22List.innerHTML = html;
}

function updateHoleList() {
  const holeList = document.getElementById('holeList');
  if (!holeList) return;
  let allHole = [];
  RACES.forEach(race => {
    // 未勝利戦のみ
    if (!race.race_name || race.race_name.indexOf('未勝利') < 0) return;
    if (race.is_jump || race.is_shinnma) return;
    if (curDate !== 'all' && (race.date_label||'') !== curDate) return;
    // GBM順位を計算
    const sorted = [...race.horses].sort((a,b) => (b.gbm_prob||0) - (a.gbm_prob||0));
    sorted.forEach((h, idx) => {
      const gbm = h.gbm_prob || 0;
      const rank = idx + 1;
      if (gbm >= 0.07 && rank <= 5) {
        allHole.push({race: race, h: h, rank: rank, gbm: gbm});
      }
    });
  });
  allHole.sort((a,b) => {
    const da=(a.race.date_label||''); const db=(b.race.date_label||'');
    if(da!==db) return da<db?-1:1;
    if(a.race.place!==b.race.place) return a.race.place<b.race.place?-1:1;
    const ra=parseInt(a.race.r)||0; const rb=parseInt(b.race.r)||0;
    if(ra!==rb) return ra-rb;
    return a.rank - b.rank;
  });
  if (allHole.length === 0) {
    holeList.innerHTML = '<p class="no-bet">該当馬はありません</p>';
    return;
  }
  let html = `<p style="color:var(--muted);font-size:.73rem;margin-bottom:8px;">${allHole.length}頭（オッズ20倍以上で穴狙い）</p>`;
  allHole.forEach(function(item) {
    const race=item.race, h=item.h, rank=item.rank, gbm=item.gbm;
    const gbmPct = (gbm*100).toFixed(1);
    const oddsStr = h.odds ? h.odds.toFixed(1)+'倍' : '当日確認';
    const rankBadge = rank===1 ? '◎' : (rank===2 ? '○' : (rank===3 ? '▲' : (rank+'位')));
    html += `<div class="bet-item" style="border-left:4px solid #4ba8e8">
      <div class="bet-left">
        <span class="bet-race">${race.place} ${race.r}R　${race.race_name}</span>
        <span class="bet-horse"><span style="color:#4ba8e8">${rankBadge}</span> [${h.bango||'?'}番] <span style="font-weight:700">${h.name}</span>　<span style="color:#4ba8e8;font-weight:700">GBM ${gbmPct}%</span></span>
        <span class="bet-prob" style="color:var(--muted)">オッズ${oddsStr}　20倍以上で穴狙い</span>
      </div>
    </div>`;
  });
  holeList.innerHTML = html;
}

let curDate = 'all';

function filterDate(val) {
  curDate = val;
  document.querySelectorAll('.filter-row:nth-child(1) .fbtn').forEach(b => {
    b.classList.toggle('active', (val==='all' && b.textContent==='全日') || b.textContent===val);
  });
  applyFilters();
  updateG25List();
  updateG22List();
  updateHoleList();
}

function filterPlace(val) {
  curPlace = val;
  document.querySelectorAll('.filter-row:nth-child(2) .fbtn').forEach(b => {
    b.classList.toggle('active', (val==='all' && b.textContent==='全場') || b.textContent===val);
  });
  applyFilters();
}

function filterR(val) {
  curR = val;
  document.querySelectorAll('.filter-row:nth-child(3) .fbtn').forEach(b => {
    b.classList.toggle('active', (val==='all' && b.textContent==='全R') || b.textContent===val+'R');
  });
  applyFilters();
}

function applyFilters() {
  let visible = 0;
  document.querySelectorAll('.race-card').forEach(card => {
    const do_ = curDate==='all' || card.dataset.date===curDate;
    const po = curPlace==='all' || card.dataset.place===curPlace;
    const ro = curR==='all' || card.dataset.r===curR;
    card.classList.toggle('hidden', !(do_ && po && ro));
    if (do_ && po && ro) visible++;
  });
  document.getElementById('cntInfo').textContent = visible + 'レース表示中（全72レース）';
}

renderAll();
</script>
