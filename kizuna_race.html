  border-radius: 20px;

  padding: 24px;

  transform: scale(0.85);
  position: relative;
  flex-shrink: 0;
}
.jinei-swiper .swiper-slide-active {
  opacity: 1;
  transform: scale(1);
  border-color: #ffd96b;

}
.swiper-slide img {

  font-weight: 700;
  margin-bottom: 8px;
}

  color: #c0e8d0;
  font-style: italic;
  text-align: center;
  min-height: 36px;
}
.swiper-slide.is-mine::after {
  content: '✓ 所属中';
  position: absolute;
  top: 12px;
  right: 12px;
  background: #ffd96b;
  color: #0a1f15;
  padding: 4px 10px;

let myJineiId = null;
let swiperInstance = null;
let currentJineiIdInModal = null;

async function main() {
  const user = await initAuth();
  if (user) await checkMyJinei(user.userId);
  updateStatusBox(user);
  renderSwiper();
  initSwiper();
  bindModalEvents();
}

async function checkMyJinei(userId) {
  try {
    const doc = await db.collection('kizuna_users').doc(userId).get();
    if (doc.exists) myJineiId = doc.data().jineiId;
  } catch (e) {
    console.log('陣営確認エラー:', e);
  }
}

function updateStatusBox(user) {
  const box = document.getElementById('statusBox');
  
  if (!user) {
    box.className = 'status-box';
    box.innerHTML = `
      <p>キズナレースに参加するには<br>LINEアカウントで登録が必要です</p>
      <button class="cta-btn" onclick="login()">LINEで登録 / ログイン</button>
    `;
  } else if (myJineiId) {
    const jinei = JINEI_DATA.find(j => j.id === myJineiId);
    box.className = 'status-box logged-in';
    box.innerHTML = `
      <p style="font-size:13px; color:#87b89c;">あなたの陣営</p>
      <div class="my-jinei">${jinei ? jinei.name : '不明'}</div>
      <div class="my-info">${jinei ? jinei.style : ''}</div>
      <div class="my-info" style="margin-top:8px;">${jinei ? jinei.catchphrase : ''}</div>
    `;
  } else {
    box.className = 'status-box logged-in';
    box.innerHTML = `
      <p>ようこそ、${escapeHTML(user.displayName)}さん！</p>
      <p style="font-size:13px; color:#c0e8d0; margin-top:8px;">下から好きな陣営を選んで入隊しよう</p>
    `;
  }
}

  const wrapper = document.getElementById('swiperWrapper');
  wrapper.innerHTML = JINEI_DATA.map(j => {
    const isMine = myJineiId === j.id;
    return `
      <div class="swiper-slide ${isMine ? 'is-mine' : ''}" data-id="${j.id}">
        <img src="${j.img}" alt="${escapeHTML(j.name)}">
        <div class="slide-name">${escapeHTML(j.name)}</div>
        <div class="slide-style">${escapeHTML(j.style)}</div>
        <div class="slide-catch">${escapeHTML(j.catchphrase)}</div>
      </div>
    `;
  }).join('');
}

function initSwiper() {
  swiperInstance = new Swiper('.jinei-swiper', {
    slidesPerView: 'auto',
    centeredSlides: true,
    spaceBetween: 16,
    loop: true,
    grabCursor: true,
    initialSlide: 0,
    watchSlidesProgress: true,
    observer: true,
    observeParents: true,
    observeSlideChildren: true,
    navigation: {
      nextEl: '.swiper-button-next',
      prevEl: '.swiper-button-prev',
    },
    pagination: {
      el: '.swiper-pagination',
      clickable: true,
    },
    touchRatio: 1.5,
    on: {
      resize: function() {
        this.update();
      }
    }
  });
  
  // スライドタップ
  document.querySelectorAll('.swiper-slide').forEach((slide) => {
    slide.addEventListener('click', () => {
      const id = slide.dataset.id;
      
      if (slide.classList.contains('swiper-slide-active')) {
        // 中央のスライド → 詳細モーダル
        openDetailModal(id);
      } else {
        // 中央じゃないスライド → そのスライドを中央へ
        const index = JINEI_DATA.findIndex(j => j.id === id);
        if (index >= 0) swiperInstance.slideToLoop(index);
      }
    });
  });
}

function openDetailModal(jineiId) {
  const j = JINEI_DATA.find(x => x.id === jineiId);
  if (!j) return;
  
  currentJineiIdInModal = jineiId;
  
  document.getElementById('modalImg').src = j.img;
  document.getElementById('modalName').textContent = j.name + ' 陣営';
  document.getElementById('modalStyle').textContent = j.style;
  document.getElementById('modalIntro').textContent = j.intro;
  document.getElementById('modalPredictionStyle').textContent = j.predictionStyle;
  
  document.getElementById('modalTags').innerHTML = j.tags.map(t => 
    `<span class="modal-tag">${escapeHTML(t)}</span>`
  ).join('');
  
  document.getElementById('modalRecommend').innerHTML = j.recommend.map(r => 
    `<li>${escapeHTML(r)}</li>`
  ).join('');
  
  const confirmBtn = document.getElementById('modalConfirmBtn');
  if (myJineiId === jineiId) {
    confirmBtn.textContent = '✓ 所属中';
    confirmBtn.disabled = true;
  } else if (myJineiId) {
    confirmBtn.textContent = '別陣営所属中';
    confirmBtn.disabled = true;
  } else {
    confirmBtn.textContent = '入隊する';
    confirmBtn.disabled = false;
  }
  
  document.getElementById('detailModal').classList.add('show');
}

function closeDetailModal() {
  document.getElementById('detailModal').classList.remove('show');
  currentJineiIdInModal = null;
}

function bindModalEvents() {
  document.getElementById('modalCloseBtn').addEventListener('click', closeDetailModal);
  document.getElementById('modalCancelBtn').addEventListener('click', closeDetailModal);
  
  document.getElementById('detailModal').addEventListener('click', (e) => {
    if (e.target.id === 'detailModal') closeDetailModal();
  });
  
  document.getElementById('modalConfirmBtn').addEventListener('click', () => {
    if (!currentJineiIdInModal) return;
    
    if (!isLoggedIn()) {
      if (confirm('入隊にはLINEログインが必要です。\nログインしますか？')) {
        login();
      }
      return;
    }
    
    if (myJineiId) return;
    
    joinJinei(currentJineiIdInModal);
  });
}

async function joinJinei(jineiId) {
  const user = getCurrentUser();
  if (!user) return;
  
  const jinei = JINEI_DATA.find(j => j.id === jineiId);
  if (!jinei) return;
  
  try {
    await db.collection('kizuna_users').doc(user.userId).set({
      userId: user.userId,
      displayName: user.displayName,
      pictureUrl: user.pictureUrl,
      jineiId: jineiId,
      jinei: jinei.name,
      jineiStyle: jinei.style,
      joinedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    
    myJineiId = jineiId;
    closeDetailModal();
    alert(`${jinei.name} 陣営に入隊しました！🐴`);
    
    updateStatusBox(user);
    renderSwiper();
    
    if (swiperInstance) {
      swiperInstance.destroy();
      initSwiper();
    }
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
    
  } catch (error) {
    console.error('入隊エラー:', error);
    alert('入隊処理に失敗しました。もう一度試してください。');
  }
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = String(str || '');
  return div.innerHTML;
}

main();
</script>
